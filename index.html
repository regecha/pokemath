const SC_STORY=[{"id":"prologue","title":"프롤로그","sub":"도감에 기록되지 않은 포켓몬","pages":[{"k":"ttl","a":"프롤로그","b":"도감에 기록되지 않은 포켓몬","c":""},{"k":"sc","a":"장면 0-1","b":"폐쇄된 관측소","c":""},{"k":"bg","t":"수십 년 전 버려진 관측소.\n깨진 천장의 틈으로 희미한 달빛이 새어 들어온다. 오래된 별 관측 장치들은 녹이 슨 채 멈춰 있고, 바닥에는 깨진 유리와 먼지가 쌓여 있다.\n주인공은 구석에 놓인 낡은 책상 앞에 멈춰 선다."},{"k":"bg","t":"그 위에는 검푸른 빛을 희미하게 머금은 오래된 도감 하나가 놓여 있다."},{"k":"bgm","t":"고요하고 신비로운 피아노 선율. 멀리서 별빛이 울리는 듯한 높은 음이 간헐적으로 섞인다."},{"k":"n","t":"주인공이 도감을 집어 든다.\n오래된 표지가 열리면서 수많은 포켓몬의 기록이 한 장씩 펼쳐진다. 낯익은 포켓몬부터 한 번도 본 적 없는 포켓몬까지, 수천 개의 기록이 빼곡하게 새겨져 있다.\n그러나 마지막으로 이어지는 여섯 페이지에는 아무것도 없다."},{"k":"n","t":"글자도, 그림도, 이름도 없다.\n오직 칠흑 같은 어둠만이 페이지 아래쪽에서 꿈틀거리고 있다."},{"k":"say","w":"주인공","t":"\"대단하다…… 포켓몬에 관한 기록이 이렇게 많이 남아 있었다니.\"\n(페이지를 넘기다가 멈춘다.)\n\"그런데 이상하네. 다른 페이지에는 전부 기록이 있는데…… 왜 이 여섯 페이지는 아무것도 없는 거지?\""},{"k":"n","t":"주인공이 첫 번째 빈 페이지에 손을 댄다.\n순간, 도감 깊은 곳에서 낮고 묵직한 진동이 전해진다.\n주인공은 놀라 손을 떼려 하지만, 손끝이 페이지에 닿아 있는 동안 푸른 빛이 손등을 타고 흘러내린다.\n포켓몬 카드 세 장이 가방에서 떠오른다.\n나무지기, 아차모, 물짱이."},{"k":"n","t":"세 카드의 그림이 살아 움직이듯 빛나고, 도감 안으로 세 줄기의 빛이 흘러 들어간다."},{"k":"sys","t":"\"초기 동료 기록 확인.\"\n\"나무지기…… 기록 완료.\"\n\"아차모…… 기록 완료.\"\n\"물짱이…… 기록 완료.\"\n\"천공의 도감이 계승자를 확인했습니다.\""},{"k":"say","w":"주인공","t":"\"계승자? 잠깐, 이 도감은 대체…….\""},{"k":"n","t":"도감의 표지에 새겨진 여섯 개의 별 문양이 하나씩 점등된다.\n그 순간, 방 전체가 새하얀 빛으로 뒤덮인다."},{"k":"fx","s":"우우웅……!","t":"공간을 울리는 신비로운 공명음."},{"k":"n","t":"주인공의 앞에 작은 그림자가 나타난다.\n하얀 빛으로 이루어진 몸, 머리 양옆으로 늘어진 긴 부적, 그리고 깊이를 알 수 없는 맑은 눈동자.\n환상의 포켓몬 지라치다."},{"k":"say","w":"주인공","t":"\"지라치……!\""},{"k":"n","t":"지라치는 대답하지 않는다.\n대신 주인공을 한참 동안 바라본다. 그 시선에는 오래전부터 주인공을 알고 있었던 것 같은 따뜻함이 담겨 있다.\n지라치가 천천히 두 손을 모은다.\n머리의 부적에서 여섯 개의 빛조각이 떠오른다."},{"k":"n","t":"빨강, 파랑, 주황, 은색, 보라, 그리고 무지갯빛의 마지막 조각.\n여섯 빛은 도감의 빈 페이지 위를 맴돌다가 각기 다른 방향으로 흩어진다.\n첫 번째 초록빛이 유독 강하게 흔들린다."},{"k":"fx","s":"쿠구구구궁!","t":"관측소의 벽이 흔들리고 천장에서 먼지가 쏟아진다.\n멀리서 나무가 비명을 지르듯 갈라지는 소리가 들려온다."},{"k":"say","w":"주인공","t":"\"방금 그건……!\"\n(도감을 바라본다.)\n\"유리숲 쪽이야. 이 빛이 그곳을 가리키고 있어!\""},{"k":"n","t":"도감의 첫 번째 페이지에 숲의 형상이 나타난다.\n수정처럼 반짝이는 나무와 끝없이 이어지는 초록빛 길.\n그 아래, 짧은 문장이 떠오른다."},{"k":"sys","t":"\"첫 번째 기록의 위치 확인.\"\n\"유리숲.\"\n\"미등록 포켓몬의 기록이 세계의 흐름과 충돌하고 있습니다.\""},{"k":"say","w":"주인공","t":"\"미등록 포켓몬……?\"\n(포켓몬 카드 세 장을 다시 쥔다.)\n\"좋아. 무슨 일이 벌어지고 있는지 직접 확인해 보겠어.\""},{"k":"n","t":"주인공이 관측소를 뛰쳐나간다.\n지라치는 그 뒷모습을 바라보다가 작은 미소를 짓는다."},{"k":"say","w":"지라치","t":"\"……지라.\""},{"k":"n","t":"허공에 여섯 개의 별 문양이 나타난다.\n첫 번째 별이 초록빛으로 타오른다."},{"k":"start","t":"유리숲의 역행"}]},{"id":"ch1","title":"유리숲의 역행","sub":"첫 번째 맹세","pages":[{"k":"ttl","a":"제1장","b":"유리숲의 역행","c":"첫 번째 맹세"},{"k":"sc","a":"장면 1-1","b":"끝나지 않는 숲","c":""},{"k":"bg","t":"울창한 유리숲.\n푸른 이끼가 바위를 뒤덮고, 수정으로 이루어진 나무들이 햇빛을 받아 찬란하게 빛난다. 숲속에는 포켓몬들의 울음소리가 가득해야 하지만, 지금은 이상할 정도로 조용하다.\n캐터피 한 마리가 나무를 오른다."},{"k":"bg","t":"꼭대기에 도착하기 직전, 몸이 빛에 휩싸이며 다시 나무 아래로 내려간다.\n캐터피는 아무 일도 없었다는 듯 처음부터 다시 나무를 오른다.\n다른 포켓몬들도 마찬가지다."},{"k":"bg","t":"나무 열매를 따던 포켓몬은 열매를 따기 직전의 행동을 반복하고, 날아오르려는 포켓몬은 같은 자리에서 날개만 퍼덕인다."},{"k":"n","t":"주인공은 이상 현상을 바라보다가 도감의 반응을 확인한다."},{"k":"say","w":"주인공","t":"\"포켓몬들이 같은 행동을 반복하고 있어…….\"\n\"마치 시간이 이곳에서만 멈췄다가, 아주 짧은 순간씩 되돌아가는 것 같아.\""},{"k":"fx","s":"탁, 탁, 탁!","t":"숲속에서 빠른 발소리가 들려온다.\n이안이 나무 사이를 헤치며 나타난다."},{"k":"say","w":"이안","t":"\"비켜라. 엉성하게 서성거릴 시간 없어.\""},{"k":"say","w":"주인공","t":"\"이안! 너도 이 숲의 이상 현상을 조사하러 온 거야?\""},{"k":"say","w":"이안","t":"\"조사? 한가한 소리 하고 있네.\"\n(숲 깊은 곳을 바라본다.)\n\"포켓몬의 움직임이 이상하다는 보고는 들었다. 하지만 내 관심은 그게 아니야. 숲 깊은 곳에서 강력한 포켓몬의 기운이 감지됐다고 하더군.\""},{"k":"say","w":"주인공","t":"\"포켓몬들이 모두 같은 행동을 반복하고 있는데, 그냥 지나갈 생각이야?\""},{"k":"say","w":"이안","t":"\"승리하는 트레이너에게 필요한 건 철저한 효율과 확실한 전략뿐이다. 포켓몬의 기분이나 맞춰주며 시간을 낭비할 순 없어.\""},{"k":"say","w":"주인공","t":"\"포켓몬의 상태를 살피는 것도 전략이야.\""},{"k":"say","w":"이안","t":"\"그런 말은 승리한 다음에나 해라.\""},{"k":"n","t":"이안이 몬스터볼을 들어 보인다."},{"k":"say","w":"이안","t":"\"내가 먼저 숲의 중심에 도착하겠다. 네가 정말 이 문제를 해결할 수 있다고 생각한다면 따라와 봐.\""},{"k":"n","t":"그는 앞으로 달려간다.\n주인공은 잠시 망설이다가 도감을 품에 넣고 그 뒤를 쫓는다."},{"k":"sc","a":"장면 1-2","b":"첫 번째 전투","c":"반복되는 작은 발걸음"},{"k":"bg","t":"큰 나무의 뿌리가 길을 가로막고 있는 숲길.\n나무 아래에는 수많은 캐터피가 모여 있다. 그중 한 마리가 주인공을 발견하고 몸을 일으킨다."},{"k":"say","w":"캐터피","t":"\"캐터……!\""},{"k":"n","t":"캐터피의 눈동자에서 초록빛이 번쩍인다.\n주인공이 한 걸음 다가가자 캐터피가 돌진한다. 공격을 피하더라도 캐터피는 이상한 빛에 휩싸여 처음 있던 자리로 되돌아간다. 그리고 같은 공격을 반복한다."},{"k":"say","w":"주인공","t":"\"이 캐터피도 자신의 행동을 멈출 수 없는 거야?\"\n\"괜찮아. 우선 이 반복을 끊어 보자.\""},{"k":"bt","kind":"wild","idx":1,"label":"일반 포켓몬 1/4 — 캐터피","who":"캐터피"},{"k":"n","t":"캐터피가 마지막으로 몸을 움츠린다.\n초록빛이 눈에서 사라지고, 캐터피는 그대로 바닥에 주저앉는다."},{"k":"say","w":"캐터피","t":"\"캐터……?\""},{"k":"n","t":"캐터피가 자신의 몸을 바라본다. 방금 전까지 반복하던 동작이 멈췄다는 사실을 알아차린 듯 두리번거린다."},{"k":"say","w":"주인공","t":"\"이제 괜찮아. 더 이상 같은 행동을 반복하지 않아도 돼.\""},{"k":"n","t":"캐터피의 몸에서 작은 초록빛이 피어오른다.\n캐터피는 주인공을 향해 고개를 끄덕인다. 빛이 천천히 카드 모양으로 변하면서 천공의 도감으로 들어간다."},{"k":"sys","t":"\"캐터피의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"캐터피"},{"k":"say","w":"주인공","t":"\"도감에 기록되는 순간, 이곳에 묶여 있던 기운도 사라졌어.\"\n\"이 도감은 단순히 포켓몬을 기록하는 게 아니야. 뒤틀린 세계에서 포켓몬을 해방시키는 힘도 가지고 있는 것 같아.\""},{"k":"n","t":"숲길을 막고 있던 뿌리가 천천히 옆으로 움직인다.\n새로운 길이 열린다."},{"k":"sc","a":"장면 1-3","b":"두 번째 전투","c":"거미줄에 갇힌 길"},{"k":"bg","t":"깊은 계곡 위로 수정 덩굴이 이어진 협곡.\n반짝이는 거미줄이 사방에 펼쳐져 있다. 거미줄에 닿은 나뭇잎과 작은 가지들은 허공에서 같은 방향으로 흔들리기를 반복한다.\n주인공이 길을 살피는 순간, 머리 위에서 날카로운 울음소리가 들린다."},{"k":"say","w":"페이검","t":"\"페이이이!\""},{"k":"n","t":"페이검이 수정 거미줄을 타고 내려와 주인공의 앞길을 가로막는다.\n거미줄은 페이검이 움직일 때마다 빛나는 고리로 변한다. 주인공이 물러서자 페이검은 같은 궤적을 따라 공격하고, 거미줄은 그 움직임을 그대로 복제한다."},{"k":"say","w":"주인공","t":"\"거미줄까지 움직임을 반복시키고 있어!\"\n\"이대로 공격을 피하기만 해서는 끝이 없겠어.\"\n(페이검의 움직임을 살피며)\n\"네가 만들어 내는 거미줄이 네 움직임을 묶고 있는 거야. 너 역시 여기서 빠져나가지 못하는 거구나.\""},{"k":"bt","kind":"wild","idx":2,"label":"일반 포켓몬 2/4 — 페이검","who":"페이검"},{"k":"n","t":"페이검이 땅에 내려앉는다.\n복잡하게 얽혀 있던 거미줄이 하나씩 풀리고, 계곡을 가로막던 빛의 고리도 사라진다."},{"k":"say","w":"페이검","t":"\"페이…….\""},{"k":"say","w":"주인공","t":"\"이제 네가 원하는 곳으로 움직일 수 있어.\""},{"k":"n","t":"페이검이 주인공의 신발 끝에 다가와 가볍게 몸을 비빈다.\n작은 빛이 페이검을 감싼 뒤 카드 형태로 변한다. 도감이 부드럽게 펼쳐지며 페이검의 기록을 새긴다."},{"k":"sys","t":"\"페이검의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"페이검"},{"k":"say","w":"주인공","t":"\"두 번째 기록도 완료됐어.\"\n\"하지만 이런 일이 숲 전체에서 벌어지고 있다면…… 중심에는 분명히 원인이 있을 거야.\""},{"k":"n","t":"멀리서 초록빛 기둥이 솟아오른다.\n숲의 중심으로 이어지는 길이다."},{"k":"sc","a":"장면 1-4","b":"세 번째 전투","c":"미래를 잊은 포켓몬"},{"k":"bg","t":"수정 나무가 빽빽하게 들어선 숲속 공터.\n나뭇가지마다 별처럼 빛나는 열매가 매달려 있다. 그 아래에 네이티 한 마리가 서 있다.\n네이티는 고개를 들어 같은 나뭇가지를 바라본다. 그리고 뛰어오르려다가 멈추고, 다시 처음 자리로 돌아간다.\n이 동작을 수십 번이나 반복하고 있다."},{"k":"say","w":"주인공","t":"\"이번에는 네이티야.\"\n\"높이 뛰어오르려는 것 같은데, 왜 마지막 순간마다 돌아오는 거지?\""},{"k":"n","t":"주인공이 주변을 둘러본다.\n네이티가 바라보는 나뭇가지 아래에는 작은 열매 하나가 떨어져 있다. 열매에는 다른 나뭇잎들과 달리 검은 금이 새겨져 있다."},{"k":"say","w":"주인공","t":"\"저 열매…… 주변의 빛과 어울리지 않아.\""},{"k":"n","t":"네이티가 갑자기 고개를 돌린다."},{"k":"say","w":"네이티","t":"\"네이!\""},{"k":"n","t":"네이티는 주인공이 검은 열매에 다가가지 못하도록 공격한다."},{"k":"say","w":"주인공","t":"\"나를 막으려는 게 아니구나. 저 열매를 지키려는 거야?\"\n\"하지만 저 열매가 네 시간을 묶어 두고 있어. 이대로는 안 돼!\""},{"k":"bt","kind":"wild","idx":3,"label":"일반 포켓몬 3/4 — 네이티","who":"네이티"},{"k":"n","t":"네이티가 마지막 공격을 멈춘다.\n주인공이 검은 열매를 들어 올리자 열매는 소리 없이 부서져 사라진다. 네이티의 몸을 감싸던 초록빛이 빠져나가고, 공터에 따스한 햇살이 내려앉는다.\n네이티는 고개를 갸웃하더니 주인공의 손바닥 위에 작은 깃털 하나를 올려놓는다."},{"k":"say","w":"주인공","t":"\"고마워. 네가 지키려고 했던 마음은 알 것 같아.\""},{"k":"n","t":"네이티가 빛에 둘러싸이고 도감으로 들어간다."},{"k":"sys","t":"\"네이티의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"네이티"},{"k":"n","t":"도감의 첫 번째 페이지가 저절로 펼쳐진다.\n페이지 가장자리의 초록빛이 조금씩 강해진다."},{"k":"say","w":"주인공","t":"\"세 포켓몬 모두 검은 열매와 가까운 곳에 있었어.\"\n\"숲의 중심에 있는 무언가가 시간을 뒤틀고 있다면…….\""},{"k":"fx","s":"쿠구구궁!","t":"멀리서 나무가 쓰러지는 듯한 거대한 진동이 울린다."},{"k":"sc","a":"장면 1-5","b":"네 번째 전투","c":"굴레에 묶인 이상해씨"},{"k":"bg","t":"유리숲의 가장 깊은 곳.\n거대한 수정 나무 아래에 이상해씨 한 마리가 서 있다.\n이상해씨는 나무의 뿌리를 향해 다가갔다가 멈추고, 고개를 흔든 뒤 다시 같은 자리에 선다. 등 위의 씨앗에는 초록빛 덩굴이 비정상적으로 자라나 몸을 감싸고 있다."},{"k":"say","w":"이상해씨","t":"\"이상…… 이상해……!\""},{"k":"n","t":"이상해씨의 주변에 초록빛 고리가 나타난다.\n주인공이 다가서자 이상해씨는 놀라 몸을 돌린다. 눈에 두려움이 가득하지만 몸은 의지와 상관없이 공격 자세를 취한다."},{"k":"say","w":"주인공","t":"\"괜찮아, 이상해씨. 나는 너를 해치러 온 게 아니야.\""},{"k":"say","w":"이상해씨","t":"\"씨이이!\""},{"k":"say","w":"주인공","t":"\"네 몸이 네 뜻대로 움직이지 않는 거지?\"\n(도감을 들어 올린다.)\n\"조금만 버텨 줘. 이 굴레를 끊어 낼게!\""},{"k":"n","t":"이상해씨가 돌진한다.\n주인공은 공격을 받아 내고, 마지막 순간에 도감의 초록빛이 이상해씨의 몸을 감싼다. 전투가 끝날 때마다 덩굴이 하나씩 끊어진다."},{"k":"bt","kind":"wild","idx":4,"label":"일반 포켓몬 4/4 — 이상해씨","who":"이상해씨"},{"k":"n","t":"마지막 덩굴이 끊어지며 이상해씨가 바닥에 주저앉는다.\n잠시 후 이상해씨가 천천히 고개를 든다."},{"k":"say","w":"이상해씨","t":"\"이상…… 해씨!\""},{"k":"n","t":"이상해씨는 주인공에게 다가와 머리를 부드럽게 부딪친다."},{"k":"say","w":"주인공","t":"\"이제 네가 원하는 대로 움직일 수 있어.\"\n(작게 미소 짓는다.)\n\"혼자서 오랫동안 버텼구나.\""},{"k":"n","t":"이상해씨의 몸에서 초록빛이 피어난다. 빛은 천천히 카드의 형상으로 바뀌어 도감 안에 기록된다."},{"k":"sys","t":"\"이상해씨의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"이상해씨"},{"k":"say","w":"주인공","t":"\"이상해씨까지…… 이제 네 포켓몬의 굴레는 끊어졌어.\""},{"k":"n","t":"그 순간, 수정 나무의 뿌리 깊은 곳에서 거대한 그림자가 움직인다.\n나무껍질이 갈라지고, 검은 덩굴이 땅 위로 솟구친다.\n그 중심에서 커다란 포켓몬 하나가 나타난다.\n대로트.\n유리숲의 오랜 수호자였던 포켓몬이지만, 지금은 온몸에 검은 덩굴이 뒤엉켜 있다."},{"k":"n","t":"이안도 뒤늦게 공터에 도착한다."},{"k":"say","w":"이안","t":"\"저게 숲의 중심에 있던 포켓몬인가……!\""},{"k":"say","w":"주인공","t":"\"아니. 저 포켓몬 역시 무언가에 붙잡혀 있어.\""},{"k":"say","w":"이안","t":"\"또 포켓몬의 사정부터 헤아리려는 건가?\""},{"k":"say","w":"주인공","t":"\"우리가 본 포켓몬들이 모두 그랬어. 저 포켓몬이 원인인지, 피해자인지는 아직 몰라.\""},{"k":"say","w":"이안","t":"\"……좋아. 이번에는 네 판단이 어디까지 맞는지 지켜보지.\""},{"k":"sc","a":"장면 1-6","b":"다섯 번째 전투","c":"유리숲의 수호자"},{"k":"bg","t":"거대한 수정 나무 앞.\n대로트가 땅에 뿌리를 박는다. 검은 덩굴들이 숲 전체로 퍼지고, 주변의 나무들이 동시에 주인공을 향해 기울어진다."},{"k":"say","w":"대로트","t":"\"그르르르……!\""},{"k":"n","t":"대로트의 눈에서 붉은빛이 번쩍인다.\n주인공은 이상해씨가 있던 자리를 바라본다. 이상해씨의 주변에 남아 있던 초록빛이 대로트의 검은 덩굴을 향해 가늘게 뻗는다."},{"k":"say","w":"주인공","t":"\"숲 전체가 대로트의 힘에 묶여 있어!\"\n\"대로트, 네가 정말 숲을 지키고 싶었다면…… 이제 그만 숲을 놓아줘!\""},{"k":"say","w":"이안","t":"\"말로 해결할 수 있는 상태가 아니야!\""},{"k":"say","w":"주인공","t":"\"알아. 하지만 쓰러뜨리는 것만으로 끝내지는 않을 거야!\""},{"k":"bt","kind":"boss","idx":5,"label":"보스 포켓몬 — 뒤틀린 대로트","who":"뒤틀린 대로트"},{"k":"n","t":"대로트가 거대한 뿌리를 지면에 내리찍는다. 땅이 솟아오르고 수정 나무들이 연쇄적으로 흔들린다.\n주인공의 포켓몬이 공격을 받아 밀려나지만, 주인공은 무리하게 공격을 계속하지 않는다.\n대로트가 뿌리를 거두는 순간, 도감의 빛이 검은 덩굴 사이로 파고든다."},{"k":"say","w":"주인공","t":"\"지금이야! 저 덩굴이 네 움직임을 막고 있어!\""},{"k":"n","t":"주인공의 포켓몬이 마지막 힘을 모아 대로트의 뿌리를 끊는다.\n검은 덩굴이 부서지고 대로트가 무릎을 꿇는다."},{"k":"fx","s":"콰아아앙……!","t":"한순간 숲 전체의 시간이 멈춘 듯 고요해진다.\n이후 검은 덩굴이 바스러지고, 수정 나무 사이로 따뜻한 햇빛이 쏟아진다."},{"k":"say","w":"대로트","t":"\"트레…… 버넌트…….\""},{"k":"n","t":"대로트는 천천히 몸을 일으켜 숲을 바라본다.\n나무 위에서 캐터피가 기어가고, 네이티가 자유롭게 날아오른다. 페이검은 더 이상 거미줄에 묶이지 않은 채 나뭇가지 사이를 오간다.\n대로트가 주인공을 향해 고개를 숙인다."},{"k":"sys","t":"\"대로트의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"대로트"},{"k":"n","t":"도감의 첫 번째 빈 페이지가 환하게 펼쳐진다.\n이상해씨, 캐터피, 페이검, 네이티, 대로트의 기록이 별처럼 새겨진다.\n마지막으로 페이지 한가운데에 문장이 나타난다."},{"k":"vow","t":"첫 번째 맹세: 성장은 혼자 이루는 것이 아니다.","final":0},{"k":"bgm","t":"잔잔한 피아노에 따뜻한 현악기가 더해진다."},{"k":"say","w":"주인공","t":"\"성장은…… 함께하는 동안 이루어지는 거구나.\""},{"k":"say","w":"이안","t":"\"흥. 운이 좋았을 뿐이다.\"\n(쓰러진 대로트를 바라본다.)\n\"네 방식이 언제나 통한다고 생각하지 마. 다음 해안가에서는 네가 틀렸다는 걸 증명해 주겠어.\""},{"k":"say","w":"주인공","t":"\"그래. 하지만 다음에는 포켓몬들의 움직임부터 잘 살펴봐.\""},{"k":"say","w":"이안","t":"\"쓸데없는 충고는 됐다!\""},{"k":"n","t":"이안이 먼저 숲을 빠져나간다.\n주인공이 뒤따르려는 순간, 이상해씨가 도감에서 다시 빛을 내며 모습을 드러낸다. 이상해씨는 주인공의 발치에서 고개를 들어 올린다."},{"k":"say","w":"주인공","t":"\"앞으로도 같이 가고 싶은 거니?\""},{"k":"say","w":"이상해씨","t":"\"이상해씨!\""},{"k":"say","w":"주인공","t":"\"좋아. 함께 가자.\""},{"k":"n","t":"도감의 첫 번째 페이지가 닫히면서 초록빛 별 하나가 빛난다."},{"k":"clr","r":1,"n":["캐터피","페이검","네이티","이상해씨"],"b":["대로트"],"f":false,"notes":["첫 번째 맹세 해금"]},{"k":"sc","a":"시나리오 덱 편성","b":"숲의 야영지","c":"","deckScene":1},{"k":"bg","t":"숲을 빠져나온 뒤, 작은 개울이 흐르는 야영지.\n주인공은 바위 위에 앉아 천공의 도감을 펼친다."},{"k":"say","w":"주인공","t":"\"이렇게 많은 포켓몬이 도감에 기록되다니…….\"\n\"앞으로 더 강한 포켓몬을 만나게 될 거야. 지금까지 만난 동료들과 어떻게 힘을 합칠지도 생각해 봐야겠어.\""},{"k":"deck","t":"시나리오 전용 덱 편성 화면이 열린다.\n초기 스타팅 포켓몬 3장과 첫 번째 지역에서 획득한 포켓몬 5장이 보인다.\n플레이어는 보유한 포켓몬을 선택해 덱을 변경할 수 있다."},{"k":"sys","t":"\"시나리오 덱을 편성할 수 있습니다.\"\n\"보유한 포켓몬 카드는 다음 지역에서도 사용할 수 있습니다.\""},{"k":"n","t":"주인공은 새로운 덱을 완성하고 도감을 덮는다.\n멀리서 파도 소리가 들려온다."},{"k":"next","t":"밀물의 무덤"}]},{"id":"ch2","title":"밀물의 무덤","sub":"두 번째 맹세","pages":[{"k":"ttl","a":"제2장","b":"밀물의 무덤","c":"두 번째 맹세"},{"k":"sc","a":"장면 2-1","b":"바다가 숨을 멈춘 날","c":""},{"k":"bg","t":"유리숲을 지나 도착한 조석연안.\n평소라면 바닷물이 밀려왔다가 물러가기를 반복해야 할 해안이지만, 지금은 바다가 이상할 정도로 조용하다.\n해안선은 메말라 있고, 바닥에는 거대한 조개껍데기와 물고기들의 발자국만 남아 있다."},{"k":"bg","t":"수평선 너머에는 오래된 난파선 한 척이 기울어진 채 서 있다."},{"k":"fx","s":"끼이이익…… 끼이이익…….","t":"바람도 불지 않는데 난파선의 돛대가 천천히 흔들린다.\n조사단원이 주인공을 발견하고 달려온다."},{"k":"say","w":"조사단원","t":"\"여행자님! 큰일입니다!\"\n\"바다의 흐름이 거꾸로 뒤틀리면서 라프라스 무리가 해구 안에 갇혀 버렸습니다. 썰물도 밀물도 멈춰 버렸어요!\""},{"k":"say","w":"주인공","t":"\"물이 움직이지 않는다고요?\""},{"k":"say","w":"조사단원","t":"\"네. 게다가 난파선 근처에서는 포켓몬들이 서로를 공격하고 있습니다. 마치 눈앞에 있는 상대를 알아보지 못하는 것처럼요.\""},{"k":"n","t":"도감의 두 번째 빈 페이지가 파란빛으로 반짝인다."},{"k":"say","w":"주인공","t":"\"두 번째 빛이 이곳을 가리키고 있어.\"\n\"숲에서 일어난 일과 관련이 있을지도 몰라. 난파선을 조사해 보겠어요.\""},{"k":"say","w":"조사단원","t":"\"조심하십시오. 안쪽에서는 정체를 알 수 없는 기계음이 계속 들리고 있습니다.\""},{"k":"n","t":"주인공이 부서진 갑판으로 올라선다.\n그때 등 뒤에서 이안의 목소리가 들린다."},{"k":"say","w":"이안","t":"\"이번에도 먼저 도착할 줄 알았는데, 생각보다 느리군.\""},{"k":"say","w":"주인공","t":"\"이안! 너도 왔구나.\""},{"k":"say","w":"이안","t":"\"숲에서 있었던 일은 인정하겠다. 하지만 바다는 다르지. 힘으로 제압할 수 없는 적이라면 더 강한 힘으로 밀어붙이면 된다.\""},{"k":"say","w":"주인공","t":"\"이번에는 바다의 흐름부터 살펴보자.\""},{"k":"say","w":"이안","t":"\"네 방식대로 해 봐. 나는 내 방식대로 움직일 테니까.\""},{"k":"n","t":"두 사람은 서로 다른 방향으로 난파선 안쪽을 향한다."},{"k":"sc","a":"장면 2-2","b":"첫 번째 전투","c":"메마른 해변의 집게발"},{"k":"bg","t":"물이 빠져나간 해변.\n크고 작은 돌 웅덩이 사이로 게 포켓몬들이 움직이고 있다. 그중 한 마리의 집게발에 검은 금속 조각이 끼어 있다."},{"k":"say","w":"크랩","t":"\"크라아아!\""},{"k":"n","t":"크랩이 주인공을 향해 달려든다.\n집게발이 돌을 내리칠 때마다 바닥에서 파란빛의 파동이 퍼져 나간다. 파동이 지나간 곳에서는 물웅덩이가 순식간에 말라 버린다."},{"k":"say","w":"주인공","t":"\"바닷물이 사라지는 현상과 같은 빛이야!\"\n\"저 포켓몬이 일부러 물을 말리고 있는 건 아닌 것 같아. 집게발에 낀 조각이 영향을 주는 걸지도 몰라.\""},{"k":"bt","kind":"wild","idx":1,"label":"일반 포켓몬 1/4 — 크랩","who":"크랩"},{"k":"n","t":"크랩이 집게발을 내려놓는다.\n주인공이 조심스럽게 금속 조각을 떼어 내자, 조각은 검은 연기로 변해 사라진다."},{"k":"say","w":"크랩","t":"\"크라브…….\""},{"k":"say","w":"주인공","t":"\"이제 괜찮아. 바다가 왜 멈췄는지는 아직 모르겠지만, 적어도 네가 원인은 아니었던 것 같아.\""},{"k":"n","t":"크랩이 바닥에 남은 물방울을 집게발로 가리킨다.\n물방울이 아주 천천히 움직이며 바다 쪽으로 흘러간다."},{"k":"sys","t":"\"크랩의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"크랩"},{"k":"say","w":"주인공","t":"\"작지만 중요한 변화야.\"\n\"바다의 흐름이 완전히 멈춘 건 아니야. 어딘가에서 다시 움직일 수 있는 힘이 남아 있어.\""},{"k":"sc","a":"장면 2-3","b":"두 번째 전투","c":"물거품 속의 그림자"},{"k":"bg","t":"난파선으로 이어지는 얕은 바닷길.\n물은 허리 아래에도 미치지 않을 만큼 얕지만, 바닥은 이상한 푸른 안개로 덮여 있다.\n안개 속에서 독침이 날아온다.\n주인공이 몸을 숙이자 촉수 여러 개가 물 위로 솟구친다."},{"k":"say","w":"왕눈해","t":"\"테에엥!\""},{"k":"n","t":"왕눈해가 물거품 속에서 모습을 드러낸다.\n왕눈해는 주인공을 바라보지만 시선이 제대로 맞지 않는다. 움직일 때마다 자기 그림자와 부딪치며 같은 자리를 맴돈다."},{"k":"say","w":"주인공","t":"\"왕눈해까지 이 흐름에 휘말린 거야?\""},{"k":"fx","s":"촤아아악!","t":"왕눈해가 물을 끌어당기자 주변의 바닷물이 공중으로 떠오른다."},{"k":"say","w":"주인공","t":"\"조심해! 물이 한곳에 모이고 있어!\""},{"k":"bt","kind":"wild","idx":2,"label":"일반 포켓몬 2/4 — 왕눈해","who":"왕눈해"},{"k":"n","t":"왕눈해의 촉수가 힘없이 내려온다.\n공중에 떠 있던 바닷물이 빗방울처럼 떨어지고, 물거품 속에 가려져 있던 해저 바위들이 모습을 드러낸다."},{"k":"say","w":"주인공","t":"\"바다는 없어지지 않았어. 물이 한곳으로 쏠리고 있었던 거야.\""},{"k":"n","t":"왕눈해는 잠시 주인공을 바라보다가 부드럽게 몸을 흔든다."},{"k":"sys","t":"\"왕눈해의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"왕눈해"},{"k":"n","t":"도감의 파란빛이 더욱 선명해진다.\n멀리 난파선 안쪽에서 붉은 불빛이 깜빡인다."},{"k":"sc","a":"장면 2-4","b":"세 번째 전투","c":"돌아오지 않는 날갯짓"},{"k":"bg","t":"난파선의 갑판.\n부러진 돛대 위에 갈매기 포켓몬 한 마리가 앉아 있다. 날개에는 오래된 밧줄이 감겨 있고, 그 아래에는 파란빛의 결정이 매달려 있다.\n주인공이 갑판에 올라서는 순간, 갈매기 포켓몬이 날아오른다."},{"k":"say","w":"갈모매","t":"\"끼이이익!\""},{"k":"n","t":"갈모매는 하늘을 향해 날아가지만, 어느 높이에 이르면 몸이 갑자기 멈추고 갑판으로 돌아온다. 그 뒤 다시 날아오르기를 반복한다."},{"k":"say","w":"주인공","t":"\"숲의 포켓몬들처럼 같은 행동을 되풀이하고 있어.\"\n\"네가 하늘로 올라가지 못하게 하는 건 저 결정이구나.\""},{"k":"n","t":"주인공이 결정을 떼어 내려 하자 갈모매가 격렬하게 날개를 퍼덕인다."},{"k":"say","w":"주인공","t":"\"네가 소중히 지키던 물건일지도 모르겠어. 하지만 지금은 너를 괴롭히고 있어.\"\n\"걱정하지 마. 함께 이 굴레를 끊어 보자.\""},{"k":"bt","kind":"wild","idx":3,"label":"일반 포켓몬 3/4 — 갈모매","who":"갈모매"},{"k":"n","t":"갈모매가 갑판에 내려앉는다.\n주인공이 결정을 건드리자 결정은 순식간에 모래처럼 부서진다.\n갈모매는 몇 차례 날개를 펴더니 이번에는 막힘없이 하늘로 날아오른다."},{"k":"sys","t":"\"갈모매의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"갈모매"},{"k":"say","w":"주인공","t":"\"저 멀리 바다도 움직이기 시작했어.\"\n(난파선 안쪽의 문을 바라본다.)\n\"이제 남은 건 이 난파선 안쪽이야.\""},{"k":"sc","a":"장면 2-5","b":"네 번째 전투","c":"해구에 갇힌 노래"},{"k":"bg","t":"난파선의 하부 갑판.\n부서진 창문 밖으로 깊고 어두운 바다가 보인다. 멀리 해구를 따라 푸른빛이 흐르지만, 그 흐름은 마치 거대한 벽에 막힌 것처럼 한곳에서 맴돌고 있다.\n주인공이 유리창에 손을 대는 순간, 낮고 슬픈 울음소리가 들려온다."},{"k":"say","w":"라프라스","t":"\"라프우우…….\""},{"k":"n","t":"해구에 갇힌 라프라스 한 마리가 난파선 가까이 다가온다.\n라프라스는 등을 내밀어 주인공에게 도움을 요청하는 것 같지만, 몸에 감긴 빛의 고리가 갑자기 조여 오면서 격렬하게 몸부림친다."},{"k":"say","w":"주인공","t":"\"라프라스! 괜찮아?\""},{"k":"say","w":"라프라스","t":"\"라프우우우!\""},{"k":"say","w":"주인공","t":"\"빛의 고리가 네 몸을 조이고 있어. 네가 움직일수록 더 강하게 묶이는 거야!\""},{"k":"n","t":"라프라스가 괴로움에 몸을 뒤틀면서 파도가 솟아오른다. 좁은 갑판이 기울어지고, 주인공은 난간을 붙잡는다."},{"k":"say","w":"주인공","t":"\"지금 풀어 주지 않으면 더 위험해질 거야.\"\n\"라프라스, 잠깐만 나를 믿어 줘!\""},{"k":"bt","kind":"wild","idx":4,"label":"일반 포켓몬 4/4 — 라프라스","who":"라프라스"},{"k":"n","t":"라프라스는 자신을 묶고 있는 힘을 끊어 내기 위해 거센 파도를 일으킨다.\n주인공은 무작정 공격을 반복하는 대신, 라프라스의 등 주위에서 깜빡이는 푸른 고리를 관찰한다."},{"k":"say","w":"주인공","t":"\"저 고리가 빛날 때마다 파도의 방향이 바뀌고 있어!\"\n\"라프라스! 조금만 더 버텨 줘!\""},{"k":"n","t":"마지막 고리가 끊어지며 거대한 파도가 잦아든다.\n라프라스는 바닷속으로 천천히 내려갔다가 다시 수면 위로 올라온다.\n그 눈에는 조금 전까지의 공포 대신 안도감이 어려 있다."},{"k":"say","w":"라프라스","t":"\"라프우우…….\""},{"k":"n","t":"라프라스가 주인공을 향해 고개를 숙인다.\n도감이 펼쳐지며 라프라스의 기록이 새겨진다."},{"k":"sys","t":"\"라프라스의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"라프라스"},{"k":"say","w":"주인공","t":"\"네가 계속 노래할 수 있도록 바다를 되돌려 놓을게.\""},{"k":"n","t":"라프라스가 갑판 아래를 바라본다.\n그 아래에서 금속을 긁는 듯한 소리가 들려온다.\n끼이이이익……!\n난파선 전체가 흔들린다."},{"k":"sc","a":"장면 2-6","b":"다섯 번째 전투","c":"난파선을 붙잡은 닻"},{"k":"bg","t":"난파선의 화물 보관실.\n바닥에는 오래된 장치들이 산산조각 난 채 흩어져 있다. 중앙에는 거대한 닻이 떠 있고, 닻의 사슬은 바다 깊은 곳까지 끝없이 이어진다.\n그 사슬을 타고 정체를 알 수 없는 포켓몬이 모습을 드러낸다."},{"k":"bg","t":"대왕끼리동처럼 크고 위협적인 금속 몸체. 여러 해초와 쇠사슬이 한데 얽혀 있다.\n닻에 매달려 있던 포켓몬, 대왕끼리동이 아니라 타타륜이다."},{"k":"say","w":"타타륜","t":"\"끼이이이이익!\""},{"k":"n","t":"타타륜이 몸을 돌리자 모든 사슬이 동시에 팽팽해진다.\n난파선이 기울고, 바깥 바다의 물결이 반대 방향으로 휘몰아친다."},{"k":"say","w":"주인공","t":"\"저 포켓몬이 사슬을 붙잡고 있어!\"\n\"하지만 저렇게 스스로 바다를 뒤틀고 있는 게 아니야. 사슬과 몸이 하나로 엉켜 버렸어!\""},{"k":"n","t":"이안이 보관실로 뛰어 들어온다."},{"k":"say","w":"이안","t":"\"저 정도 크기라면 힘으로 사슬을 끊어 내면 되겠군!\""},{"k":"say","w":"주인공","t":"\"잠깐, 무작정 끊어 버리면 바다의 흐름이 한꺼번에 뒤집힐 수도 있어!\""},{"k":"say","w":"이안","t":"\"그럼 어떻게 하라는 거지?\""},{"k":"say","w":"주인공","t":"\"타타륜이 사슬을 당기는 순간을 노려야 해. 사슬의 힘이 가장 약해지는 순간에 중심을 공격하는 거야!\""},{"k":"say","w":"이안","t":"\"……이번 한 번만 네 판단에 맞춰 주지.\""},{"k":"bt","kind":"boss","idx":5,"label":"보스 포켓몬 — 타타륜","who":"타타륜"},{"k":"n","t":"타타륜이 거대한 닻을 휘두른다. 공격이 빗나간 자리의 바닥이 부서지고 물이 역류한다.\n주인공은 타타륜이 사슬을 당기는 순간을 기다린다."},{"k":"say","w":"주인공","t":"\"지금이야! 사슬이 느슨해졌어!\""},{"k":"n","t":"주인공의 포켓몬이 타타륜의 중심부를 향해 강력한 공격을 날린다.\n이안도 자신의 포켓몬에게 정확한 순간을 맞춰 공격하도록 지시한다.\n사슬 하나가 끊어진다.\n이어 다른 사슬들이 차례대로 풀려 나간다.\n마지막으로 거대한 닻이 바닥에 떨어진다."},{"k":"fx","s":"쿠우우웅!","t":""},{"k":"n","t":"타타륜의 몸을 감싸던 검은 금속 조각들이 하나씩 떨어진다.\n타타륜은 거친 울음소리를 내다가 천천히 몸을 가라앉힌다."},{"k":"say","w":"타타륜","t":"\"타아아…….\""},{"k":"n","t":"난파선 밖에서 물이 움직이기 시작한다.\n멈춰 있던 바닷물이 해안으로 밀려온다. 해구에 갇혀 있던 라프라스 무리가 자유롭게 헤엄치기 시작한다."},{"k":"sys","t":"\"타타륜의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"타타륜"},{"k":"n","t":"도감의 두 번째 빈 페이지가 푸른빛으로 채워진다.\n캐터피와 이상해씨의 기록이 있는 첫 번째 페이지와 달리, 두 번째 페이지에는 끝없이 흐르는 물결이 그려진다.\n그 중심에 문장이 새겨진다."},{"k":"vow","t":"두 번째 맹세: 포켓몬의 힘을 통제하는 것과 그들의 선택을 이해하는 것은 다르다.","final":0},{"k":"say","w":"주인공","t":"\"힘을 억지로 멈추게 하는 것만으로는 아무것도 해결되지 않아.\"\n\"그 포켓몬이 왜 움직이고, 무엇을 지키려 하는지 알아야 해.\""},{"k":"say","w":"이안","t":"\"……단순한 힘의 제압이 아니라, 흐름을 읽는 전략이라고?\"\n(주먹을 쥔다.)\n\"말도 안 돼. 승리는 가장 강한 힘으로 상대를 압도하는 것이라고!\""},{"k":"say","w":"주인공","t":"\"그렇다면 왜 네 방식대로 한 번에 해결되지 않았을까?\""},{"k":"say","w":"이안","t":"\"……!\""},{"k":"n","t":"이안은 대답하지 않는다.\n그는 바다를 바라보다가 고개를 돌린다."},{"k":"say","w":"이안","t":"\"다음에는 반드시 네 방식보다 효율적인 전략을 찾아내겠어.\""},{"k":"say","w":"주인공","t":"\"그래. 나도 계속 배울 거야.\""},{"k":"n","t":"두 사람은 나란히 난파선을 빠져나온다.\n등 뒤로 바다가 다시 움직이기 시작한다."},{"k":"clr","r":2,"n":["크랩","왕눈해","갈모매","라프라스"],"b":["타타륜"],"f":false,"notes":["두 번째 맹세 해금"]},{"k":"sc","a":"시나리오 덱 편성","b":"해안의 등대","c":"","deckScene":1},{"k":"bg","t":"해안의 오래된 등대.\n주인공은 등대 위에서 멀리 보이는 화산을 바라본다."},{"k":"deck","t":"시나리오 전용 덱 편성 화면이 열린다.\n현재 보유한 포켓몬 카드 중에서 원하는 카드를 선택해 덱을 변경할 수 있다."},{"k":"say","w":"주인공","t":"\"숲에서는 포켓몬의 성장을 배웠고, 바다에서는 힘과 선택의 차이를 배웠어.\"\n\"다음에는 어떤 일이 기다리고 있을까?\""},{"k":"n","t":"도감의 세 번째 빛이 주황색으로 반짝인다.\n바람을 타고 뜨거운 화산재가 등대 안으로 흘러 들어온다."},{"k":"next","t":"흑요고원의 불꽃"}]},{"id":"ch3","title":"흑요고원의 불꽃","sub":"세 번째 맹세","pages":[{"k":"ttl","a":"제3장","b":"흑요고원의 불꽃","c":"세 번째 맹세"},{"k":"sc","a":"장면 3-1","b":"무너진 길","c":""},{"k":"bg","t":"붉은 용암이 흐르는 흑요고원.\n하늘에는 화산재가 가득하고, 산허리에서는 거대한 연기가 솟아오른다. 바위 틈마다 뜨거운 불꽃이 튀어 오른다.\n주인공은 화산 입구에서 이안을 다시 만난다."},{"k":"say","w":"이안","t":"\"늦었군.\""},{"k":"say","w":"주인공","t":"\"이안! 여기도 시간이 뒤틀린 거야?\""},{"k":"say","w":"이안","t":"\"이곳에서는 포켓몬의 진화가 이상하게 멈췄다는 보고가 있었다.\"\n(산 정상 쪽을 바라본다.)\n\"진화하지 못한 포켓몬들이 갑자기 난폭해지고, 원래라면 위험하지 않을 화산 주변까지 불길이 번지고 있어.\""},{"k":"say","w":"주인공","t":"\"진화와 성장까지 영향을 받고 있는 거구나.\""},{"k":"say","w":"이안","t":"\"하지만 이번에는 다르다. 내가 먼저 화산의 중심을 장악하겠다.\""},{"k":"n","t":"이안이 몬스터볼을 던진다.\n그의 파트너 포켓몬인 루카리오가 모습을 드러낸다."},{"k":"say","w":"루카리오","t":"\"루카아!\""},{"k":"say","w":"이안","t":"\"루카리오, 바위가 길을 막고 있다. 최대 출력으로 돌파해!\""},{"k":"say","w":"주인공","t":"\"잠깐! 저 바위 아래에 마그마가 흐르고 있어!\""},{"k":"fx","s":"콰과과광!","t":"루카리오의 공격으로 바위가 무너지지만, 내부에 고여 있던 뜨거운 용암이 폭발하듯 솟구친다.\n루카리오가 충격을 받아 바닥에 쓰러진다."},{"k":"say","w":"이안","t":"\"루카리오!\""},{"k":"n","t":"이안이 서둘러 루카리오를 부축한다.\n루카리오의 다리에 작은 상처가 생겨 있다."},{"k":"say","w":"이안","t":"\"왜…… 왜 피하지 못한 거야!\""},{"k":"say","w":"주인공","t":"\"이안, 지금은 루카리오부터 살펴보자.\""},{"k":"say","w":"이안","t":"\"내가 무리하게 지시했기 때문이야. 알고 있었어. 그런데도……!\""},{"k":"n","t":"그는 말을 잇지 못한다.\n주인공은 가방에서 응급처치 도구를 꺼내 루카리오의 상처를 살핀다."},{"k":"say","w":"주인공","t":"\"괜찮아. 다행히 큰 상처는 아니야. 조금 쉬면 걸을 수 있을 거야.\""},{"k":"say","w":"이안","t":"\"……왜 나를 탓하지 않는 거냐?\""},{"k":"say","w":"주인공","t":"\"지금은 누군가를 탓할 때가 아니니까.\""},{"k":"n","t":"이안은 고개를 숙인다.\n주인공은 먼저 화산 안쪽으로 걸어간다."},{"k":"sc","a":"장면 3-2","b":"첫 번째 전투","c":"바위의 분노"},{"k":"bg","t":"화산 초입의 무너진 협곡.\n길을 가로막은 거대한 바위들이 혼자 움직이듯 흔들린다.\n그중 하나가 갑자기 갈라지며 바위 포켓몬이 튀어나온다."},{"k":"say","w":"꼬마돌","t":"\"꼬오오!\""},{"k":"n","t":"꼬마돌이 양팔을 휘두르며 달려든다.\n뒤쪽에는 아직 무너지지 않은 바위벽이 위태롭게 서 있다."},{"k":"say","w":"주인공","t":"\"공격이 바위벽을 향하고 있어!\"\n\"그대로 싸우면 협곡 전체가 무너질 수도 있겠어.\""},{"k":"bt","kind":"wild","idx":1,"label":"일반 포켓몬 1/4 — 꼬마돌","who":"꼬마돌"},{"k":"n","t":"꼬마돌이 바닥에 주저앉는다.\n주인공이 주변을 살피자 꼬마돌의 몸에 검은 광석 조각이 박혀 있다. 광석에서 불규칙한 빛이 뿜어져 나온다."},{"k":"say","w":"주인공","t":"\"네가 화가 나서 공격하는 게 아니었구나. 몸 안의 광석이 계속 힘을 폭주시킨 거야.\""},{"k":"n","t":"광석 조각이 빛을 잃으며 부서진다.\n꼬마돌은 자신의 몸을 살피다가 주인공을 향해 작게 고개를 끄덕인다."},{"k":"sys","t":"\"꼬마돌의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"꼬마돌"},{"k":"n","t":"무너질 듯 흔들리던 바위벽이 멈춘다."},{"k":"sc","a":"장면 3-3","b":"두 번째 전투","c":"뜨거운 숨결"},{"k":"bg","t":"용암이 흐르는 낮은 분지.\n붉은 땅 위로 열기가 피어오른다. 분지 한가운데에서 둥근 몸의 포켓몬이 느릿하게 움직이고 있다."},{"k":"say","w":"둔타","t":"\"둔타아……!\""},{"k":"n","t":"둔타가 발을 굴리자 바닥의 용암이 튀어 오른다.\n주인공이 옆으로 피하는 순간, 둔타는 아무 일도 없었다는 듯 같은 방향으로 다시 걷기 시작한다."},{"k":"say","w":"주인공","t":"\"저 포켓몬은 공격하려는 게 아니라 같은 길을 계속 따라 걷고 있어.\""},{"k":"n","t":"둔타가 용암을 건널 때마다 바닥에 불꽃의 흔적이 남는다.\n이 흔적들은 같은 자리에서 겹쳐지고, 마침내 길 전체에 불이 붙는다."},{"k":"say","w":"주인공","t":"\"반복되는 움직임이 화산의 열기를 더 크게 만들고 있어!\"\n\"둔타, 이 길에서 벗어날 수 있도록 도와줄게!\""},{"k":"bt","kind":"wild","idx":2,"label":"일반 포켓몬 2/4 — 둔타","who":"둔타"},{"k":"n","t":"둔타가 멈춰 선다.\n주인공이 도감의 힘으로 둔타 주변의 붉은 고리를 풀어 내자 용암의 흐름이 조금씩 안정된다."},{"k":"say","w":"둔타","t":"\"둔타아.\""},{"k":"sys","t":"\"둔타의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"둔타"},{"k":"say","w":"주인공","t":"\"이곳의 불꽃도 원래는 자연스러운 흐름이었을 거야.\"\n\"누군가 그 흐름을 비틀고 있어.\""},{"k":"sc","a":"장면 3-4","b":"세 번째 전투","c":"진화가 멈춘 불꽃"},{"k":"bg","t":"화산 내부의 용암 동굴.\n벽면의 붉은 광석이 살아 있는 심장처럼 깜빡인다.\n그 앞을 뜨거운 불꽃을 내뿜는 마그마그가 가로막는다."},{"k":"say","w":"마그마그","t":"\"마그마아!\""},{"k":"n","t":"마그마그가 몸에서 불꽃을 뿜어낸다.\n하지만 불꽃은 정상적으로 타오르지 않는다. 몇 초 동안 공중에 머무르다가 다시 몸 안으로 빨려 들어가고, 같은 불꽃이 반복해서 터져 나온다."},{"k":"say","w":"주인공","t":"\"불꽃이 밖으로 나왔다가 다시 되돌아가고 있어.\"\n\"이곳의 시간은 앞으로도 뒤로도 제대로 흐르지 못하는 거야.\""},{"k":"bt","kind":"wild","idx":3,"label":"일반 포켓몬 3/4 — 마그마그","who":"마그마그"},{"k":"n","t":"마그마그의 몸에서 불꽃이 잦아든다.\n주인공이 다가가자 마그마그는 움츠러들지만 공격하지 않는다."},{"k":"say","w":"주인공","t":"\"괜찮아. 네가 잘못한 게 아니야.\"\n\"네 불꽃이 제 모습을 찾을 수 있도록, 조금만 더 함께 가 보자.\""},{"k":"sys","t":"\"마그마그의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"마그마그"},{"k":"n","t":"동굴의 안쪽이 열리며 작은 통로가 나타난다.\n그곳에서 희미한 울음소리가 들려온다."},{"k":"sc","a":"장면 3-5","b":"네 번째 전투","c":"겁에 질린 파이리"},{"k":"bg","t":"화산 내부의 작은 동굴.\n바위 틈에 파이리 한 마리가 몸을 웅크리고 있다. 꼬리의 불꽃이 작게 흔들리고 있으며, 온몸에는 검은 재가 묻어 있다."},{"k":"say","w":"주인공","t":"\"파이리……!\""},{"k":"n","t":"파이리가 놀라 고개를 든다.\n그 순간 천장 위의 검은 결정이 깜빡인다. 파이리의 꼬리 불꽃이 갑자기 커지고, 눈동자가 붉게 변한다."},{"k":"say","w":"파이리","t":"\"파이이이!\""},{"k":"say","w":"주인공","t":"\"안 돼! 불꽃을 억지로 키우고 있어!\""},{"k":"n","t":"파이리는 주인공을 향해 불꽃을 뿜는다.\n하지만 공격이 끝나자 곧바로 몸을 웅크린다. 두려움에 떠는 파이리는 자신이 무엇을 하고 있는지도 모르는 듯하다."},{"k":"say","w":"주인공","t":"\"무서운 거구나.\"\n\"자신의 힘을 조절할 수 없어서…… 누군가를 다치게 할까 봐 두려운 거야.\"\n(천공의 도감을 들어 올린다.)\n\"괜찮아, 파이리. 내가 네 곁에 있을게.\""},{"k":"bt","kind":"wild","idx":4,"label":"일반 포켓몬 4/4 — 폭주한 파이리","who":"폭주한 파이리"},{"k":"n","t":"파이리의 꼬리에서 거대한 불꽃이 솟구친다.\n주인공은 파이리의 공격을 피하면서도 무리하게 몰아붙이지 않는다. 불꽃이 작아지는 순간마다 도감의 빛을 보내 파이리를 진정시킨다."},{"k":"say","w":"주인공","t":"\"조금만 더 버텨 줘!\"\n\"불꽃은 네가 원하는 대로 타오를 수 있어!\""},{"k":"n","t":"파이리의 불꽃이 작아진다.\n파이리는 지친 듯 주저앉은 뒤 주인공을 바라본다."},{"k":"say","w":"파이리","t":"\"파이……리.\""},{"k":"n","t":"주인공은 천천히 손을 내민다."},{"k":"say","w":"주인공","t":"\"이제 괜찮아.\""},{"k":"n","t":"파이리가 조심스럽게 다가와 주인공의 손에 머리를 기댄다.\n도감이 열리며 파이리의 기록을 새긴다."},{"k":"sys","t":"\"파이리의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"파이리"},{"k":"n","t":"주인공이 파이리를 바라보는 순간, 뒤쪽에서 돌이 부서지는 소리가 들린다.\n이안이 루카리오를 부축한 채 동굴 입구에 도착한다."},{"k":"say","w":"이안","t":"\"정말…… 여기까지 왔군.\""},{"k":"say","w":"주인공","t":"\"루카리오는 괜찮아?\""},{"k":"say","w":"이안","t":"\"응. 아직 움직임은 조심해야 하지만…… 괜찮다.\""},{"k":"n","t":"그는 파이리를 바라본다."},{"k":"say","w":"이안","t":"\"그 포켓몬도 네가 구한 건가?\""},{"k":"say","w":"주인공","t":"\"구했다고 말하기는 어려워. 파이리가 두려워하는 이유를 알아보고, 함께 견뎠을 뿐이야.\""},{"k":"say","w":"이안","t":"\"…….\""},{"k":"n","t":"그는 손에 쥔 몬스터볼을 한참 동안 바라본다."},{"k":"say","w":"이안","t":"\"나도…… 내 포켓몬이 다칠까 봐 두려웠던 걸까.\""},{"k":"say","w":"주인공","t":"\"이안?\""},{"k":"say","w":"이안","t":"\"아무것도 아니야. 아직 끝나지 않았잖아.\""},{"k":"sc","a":"장면 3-6","b":"다섯 번째 전투","c":"화산의 폭군"},{"k":"bg","t":"화산 중심부.\n붉은 용암이 거대한 원형 분지를 따라 흐르고 있다. 그 한가운데에는 거대한 마그마번이 서 있다.\n마그마번의 몸은 붉은빛과 검은빛으로 갈라져 있고, 두 팔에서는 불꽃이 쉴 새 없이 터져 나온다."},{"k":"n","t":"마그마번이 몸을 흔들 때마다 용암이 솟구친다.\n화산의 분화구가 비정상적으로 밝아지고, 주변의 암석이 차례대로 녹아내린다."},{"k":"say","w":"이안","t":"\"저 포켓몬…… 진화의 흐름이 완전히 뒤틀려 있어.\""},{"k":"say","w":"주인공","t":"\"마그마번도 자신의 불꽃을 조절하지 못하고 있어.\""},{"k":"say","w":"이안","t":"\"그럼 이번에도 무조건 버티고 기다릴 건가?\""},{"k":"say","w":"주인공","t":"\"아니. 네 도움이 필요해.\""},{"k":"say","w":"이안","t":"\"……뭐라고?\""},{"k":"say","w":"주인공","t":"\"마그마번의 공격은 강하지만, 공격한 다음에는 불꽃의 흐름이 잠깐씩 끊겨. 내가 그 틈을 만들게. 그 순간에 네가 공격해 줘.\""},{"k":"n","t":"이안은 잠시 주인공을 바라본다."},{"k":"say","w":"이안","t":"\"……좋아.\"\n(루카리오를 돌아본다.)\n\"루카리오. 이번에는 무리하지 마. 네 상태를 살피면서 움직이자.\""},{"k":"say","w":"루카리오","t":"\"루카아!\""},{"k":"n","t":"주인공과 이안이 나란히 선다.\n두 사람은 처음으로 서로의 포켓몬이 움직이는 방향을 살피고, 공격을 주고받는 순간을 맞춘다."},{"k":"bt","kind":"boss","idx":5,"label":"보스 포켓몬 — 폭주한 마그마번","who":"폭주한 마그마번"},{"k":"n","t":"마그마번의 공격으로 용암이 폭발한다. 주인공의 포켓몬들이 뒤로 밀려나고 이안의 루카리오도 잠시 휘청인다."},{"k":"say","w":"이안","t":"\"루카리오, 무리하지 마! 뒤로 물러나!\""},{"k":"n","t":"루카리오가 지시를 따르자, 이전과 달리 더 이상 위험한 공격을 받지 않는다.\n이안은 놀란 듯 자신의 포켓몬을 바라본다."},{"k":"say","w":"주인공","t":"\"이안! 마그마번의 불꽃이 작아졌어!\""},{"k":"say","w":"이안","t":"\"알고 있다!\"\n(숨을 고른다.)\n\"이번에는…… 네가 움직일 때까지 기다리겠다.\""},{"k":"n","t":"주인공이 마그마번의 공격을 유도한다.\n마그마번이 마지막 불꽃을 내뿜은 순간, 주인공의 포켓몬이 중심을 공격한다."},{"k":"say","w":"이안","t":"\"지금이다, 루카리오!\""},{"k":"n","t":"루카리오가 강력한 공격을 날린다.\n두 포켓몬의 공격이 동시에 마그마번에게 닿는다."},{"k":"fx","s":"콰아아아앙!","t":""},{"k":"n","t":"마그마번의 양팔에서 불꽃이 잦아든다.\n화산 전체를 뒤덮던 붉은 빛이 서서히 가라앉는다. 검게 변했던 암석이 원래의 색을 되찾고, 용암은 안정된 길을 따라 천천히 흐르기 시작한다."},{"k":"say","w":"마그마번","t":"\"마그마…….\""},{"k":"n","t":"마그마번은 한쪽 무릎을 꿇고 이마를 땅에 댄다.\n주인공과 이안이 동시에 다가간다."},{"k":"sys","t":"\"마그마번의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"마그마번"},{"k":"n","t":"도감의 세 번째 페이지가 주황빛으로 물든다.\n페이지 위에는 파이리와 마그마그, 둔타, 꼬마돌의 기록이 별빛처럼 떠오른다.\n그 위로 세 번째 문장이 새겨진다."},{"k":"vow","t":"세 번째 맹세: 강함은 두려움이 없는 상태가 아니라, 두려움 속에서도 나아가는 선택이다.","final":0},{"k":"say","w":"주인공","t":"\"강함은 무조건 이기는 게 아니야.\"\n\"두렵더라도 포기하지 않고, 누군가를 믿고 함께 나아가는 거야.\""},{"k":"n","t":"이안은 한참 동안 대답하지 않는다.\n그러다 천천히 고개를 숙인다."},{"k":"say","w":"이안","t":"\"……사실 무서웠어.\""},{"k":"say","w":"주인공","t":"\"이안?\""},{"k":"say","w":"이안","t":"\"내가 약해지면…… 내가 패배하면…… 나를 믿어 준 파트너들이 날 버리거나, 내가 녀석들을 지켜 주지 못하게 될까 봐.\"\n(주먹을 꽉 쥔다.)\n\"그래서 무조건 이겨야 한다고 생각했어. 누구보다 강해져야만 한다고.\""},{"k":"say","w":"주인공","t":"\"…….\""},{"k":"say","w":"이안","t":"\"그런데 내가 지키려고 했던 포켓몬을, 정작 내 지시로 다치게 했어.\""},{"k":"n","t":"그는 루카리오를 바라본다."},{"k":"say","w":"이안","t":"\"미안하다, 루카리오.\""},{"k":"n","t":"루카리오는 이안에게 다가와 손을 가볍게 붙잡는다."},{"k":"say","w":"루카리오","t":"\"루카아.\""},{"k":"n","t":"이안의 눈가가 흔들린다."},{"k":"say","w":"이안","t":"\"……고맙다.\""},{"k":"say","w":"주인공","t":"\"이안, 우리 아직 갈 길이 멀어. 앞으로는 서로의 방식에서 배워 가자.\""},{"k":"say","w":"이안","t":"\"그래.\"\n(주인공을 바라본다.)\n\"이번에는 네게 빚을 졌다. 하지만 다음번에는 반드시 내가 먼저 길을 찾아내겠어.\""},{"k":"say","w":"주인공","t":"\"기대할게.\""},{"k":"n","t":"두 사람은 화산의 출구를 향해 걸어간다.\n뒤쪽에서는 파이리가 꼬리의 불꽃을 밝게 피우며 따라온다."},{"k":"clr","r":3,"n":["꼬마돌","둔타","마그마그","파이리"],"b":["마그마번"],"f":false,"notes":["세 번째 맹세 해금"]},{"k":"sc","a":"시나리오 덱 편성","b":"화산 기슭의 야영지","c":"","deckScene":1},{"k":"deck","t":"플레이어는 획득한 포켓몬을 바탕으로 시나리오 덱을 다시 편성할 수 있다."},{"k":"say","w":"주인공","t":"\"이번에는 혼자 강해지는 것보다 함께 움직이는 방법을 배웠어.\"\n\"앞으로 만날 포켓몬과도, 이안과도…… 서로를 믿을 수 있도록.\""},{"k":"n","t":"도감의 네 번째 빛이 차가운 은색으로 바뀐다.\n멀리 회색빛 도시가 모습을 드러낸다.\n도시의 하늘에는 구름 한 점 없지만, 어딘가 숨 막히는 정적이 감돌고 있다."},{"k":"next","t":"이름을 잃은 도시"}]},{"id":"ch4","title":"이름을 잃은 도시","sub":"네 번째 맹세","pages":[{"k":"ttl","a":"제4장","b":"이름을 잃은 도시","c":"네 번째 맹세"},{"k":"sc","a":"장면 4-1","b":"조용한 사람들","c":""},{"k":"bg","t":"거대한 공장과 최첨단 연구소가 늘어선 회색빛 도시.\n도로는 깨끗하고 건물은 완벽하게 정돈되어 있다. 거리 곳곳에는 움직이는 로봇과 자동 운송 장치가 보인다.\n그러나 이상할 정도로 조용하다."},{"k":"bg","t":"사람들은 서로 마주쳐도 인사하지 않는다. 어린아이가 울고 있는데도 어른들은 아무 반응 없이 지나간다.\n포켓몬들도 마찬가지다.\n트레이너가 이름을 불러도 포켓몬은 멍하니 벽만 바라본다."},{"k":"n","t":"주인공이 거리 한가운데 멈춰 선다."},{"k":"say","w":"주인공","t":"\"이곳은…… 너무 조용해.\"\n(길가의 포켓몬에게 다가간다.)\n\"괜찮니? 어디 아픈 곳은 없어?\""},{"k":"n","t":"포켓몬은 아무런 반응도 보이지 않는다.\n그때 도시 관장이 다가온다."},{"k":"say","w":"도시 관장","t":"\"외부에서 온 트레이너로군.\""},{"k":"say","w":"주인공","t":"\"이 도시에서 무슨 일이 일어나고 있는 거죠?\""},{"k":"say","w":"도시 관장","t":"\"무슨 일이라니?\"\n(주변을 둘러본다.)\n\"아무 일도 일어나지 않고 있다. 사고도, 다툼도, 슬픔도 없다. 모두가 질서를 따르며 평온하게 살아가고 있지.\""},{"k":"say","w":"주인공","t":"\"하지만 포켓몬들의 표정이 이상해요. 사람들도 서로에게 아무런 관심이 없어 보여요.\""},{"k":"say","w":"도시 관장","t":"\"그것이야말로 우리가 도달하려는 이상적인 상태다.\""},{"k":"n","t":"관장이 손목의 장치를 작동시킨다.\n건물 중앙에 설치된 거대한 기계가 회색빛을 뿜어낸다."},{"k":"say","w":"도시 관장","t":"\"저것이 영점 장치다.\"\n\"정지 현상으로부터 포켓몬이 상처받거나 슬퍼하지 않도록, 모든 감정과 변수를 0으로 수렴시키는 완벽한 통제 시스템이지.\""},{"k":"say","w":"주인공","t":"\"감정을 없애는 게 포켓몬을 지키는 일이라고요?\""},{"k":"say","w":"도시 관장","t":"\"감정은 고통의 원인이다. 누군가는 패배하고, 누군가는 헤어지고, 누군가는 사랑하는 이를 잃는다.\"\n\"모든 변화가 멈추면 그런 일도 일어나지 않아.\""},{"k":"say","w":"주인공","t":"\"감정도, 성장도, 상처도 없앤다면…… 그건 살아 있는 포켓몬이 아니라 그저 기계일 뿐이에요!\""},{"k":"say","w":"도시 관장","t":"\"아직 세상의 진실을 이해하지 못하는군.\"\n(도시 중앙의 거대한 연구소를 가리킨다.)\n\"네가 이곳의 질서를 이해하게 될 날이 올 것이다.\""},{"k":"n","t":"관장이 건물 안으로 사라진다.\n주인공은 도감을 펼친다.\n도감의 네 번째 빛이 은색으로 강하게 빛난다."},{"k":"sc","a":"장면 4-2","b":"첫 번째 전투","c":"명령만 반복하는 자석"},{"k":"bg","t":"도시 외곽의 전력 공급 시설.\n천장에는 전선이 복잡하게 얽혀 있고, 벽면의 표시등이 규칙적으로 점멸한다.\n자석 포켓몬 한 마리가 전선 사이를 오간다."},{"k":"say","w":"코일","t":"\"코오일!\""},{"k":"n","t":"코일은 주인공을 발견하자마자 공격한다.\n공격이 빗나가면 제자리로 돌아가고, 잠시 후 동일한 각도에서 같은 공격을 반복한다."},{"k":"say","w":"주인공","t":"\"상대가 움직여도 행동을 바꾸지 않아.\"\n\"누군가가 정해 놓은 명령만 반복하고 있는 것 같아.\""},{"k":"bt","kind":"wild","idx":1,"label":"일반 포켓몬 1/4 — 코일","who":"코일"},{"k":"n","t":"코일이 바닥으로 내려온다.\n몸을 감싸고 있던 회색빛이 사라지자, 코일은 주인공 주위를 천천히 한 바퀴 돈다."},{"k":"say","w":"주인공","t":"\"이제 네가 원하는 방향으로 움직일 수 있어.\""},{"k":"n","t":"코일이 전력 시설의 문을 가리킨다."},{"k":"sys","t":"\"코일의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"코일"},{"k":"n","t":"자동으로 닫혀 있던 출입문이 열린다."},{"k":"sc","a":"장면 4-3","b":"두 번째 전투","c":"멈춘 심장"},{"k":"bg","t":"도시의 자동화 광장.\n수많은 작은 구체가 바닥에 굴러다닌다. 그중 하나가 주인공의 발치에서 멈춘다."},{"k":"say","w":"찌리리공","t":"\"찌리이!\""},{"k":"n","t":"찌리리공이 갑자기 폭발하듯 빛을 내며 돌진한다.\n주인공이 피하면 찌리리공은 광장의 끝까지 굴러간 뒤, 같은 궤적을 따라 다시 돌아온다."},{"k":"say","w":"주인공","t":"\"또 같은 움직임이야.\"\n\"이 포켓몬은 자기 힘을 조절하려고 하는 게 아니야. 오직 정해진 명령만 수행하고 있어.\""},{"k":"bt","kind":"wild","idx":2,"label":"일반 포켓몬 2/4 — 찌리리공","who":"찌리리공"},{"k":"n","t":"찌리리공의 몸에서 회색빛이 사라진다.\n한동안 가만히 있던 찌리리공은 스스로 방향을 바꾸어 광장의 가장자리로 굴러간다."},{"k":"say","w":"주인공","t":"\"이제야 자유롭게 움직일 수 있구나.\""},{"k":"sys","t":"\"찌리리공의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"찌리리공"},{"k":"n","t":"광장의 전광판이 잠시 깜빡인다.\n전광판에는 알 수 없는 문장이 나타난다."},{"k":"sign","t":"ZERO PROTOCOL — 042"},{"k":"say","w":"주인공","t":"\"042……?\"\n\"이 번호도 난파선에서 봤던 고대 기록과 같아!\""},{"k":"sc","a":"장면 4-4","b":"세 번째 전투","c":"만들어진 기억"},{"k":"bg","t":"연구소 지하의 데이터 저장실.\n투명한 관 안에 포켓몬의 홀로그램이 떠 있다. 홀로그램은 마치 실제 포켓몬처럼 움직이지만, 눈빛에는 생기가 없다.\n주인공이 관찰 장치를 건드리자 가상의 포켓몬이 화면 밖으로 튀어나온다."},{"k":"say","w":"폴리곤","t":"\"폴리!\""},{"k":"n","t":"폴리곤의 몸이 여러 개의 데이터 조각으로 분리됐다가 다시 합쳐진다.\n주인공이 앞으로 다가가면 폴리곤은 뒤로 물러난다. 그러나 물러난 직후에는 원래 자리로 되돌아온다."},{"k":"say","w":"주인공","t":"\"기계처럼 만들어진 포켓몬이 아니라…… 실제 포켓몬의 행동을 데이터로 묶어 놓은 거야.\""},{"k":"n","t":"폴리곤이 몸을 낮춘다."},{"k":"say","w":"주인공","t":"\"괜찮아. 너를 지우려는 게 아니야.\"\n\"네가 스스로 움직일 수 있도록 풀어 줄게.\""},{"k":"bt","kind":"wild","idx":3,"label":"일반 포켓몬 3/4 — 폴리곤","who":"폴리곤"},{"k":"n","t":"폴리곤의 몸을 이루던 데이터 조각들이 안정적으로 배열된다.\n폴리곤은 더 이상 강제로 원래 위치로 돌아가지 않는다."},{"k":"say","w":"주인공","t":"\"기록은 포켓몬을 이해하기 위해 있는 거야.\"\n\"포켓몬을 기록 안에 가둬 놓기 위해 있는 게 아니야.\""},{"k":"sys","t":"\"폴리곤의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"폴리곤"},{"k":"n","t":"데이터 저장실의 벽면에 숨겨진 문이 나타난다.\n그 너머로 거대한 중앙 서버가 보인다."},{"k":"sc","a":"장면 4-5","b":"네 번째 전투","c":"자유를 잊은 변신"},{"k":"bg","t":"중앙 서버로 이어지는 연결 통로.\n수많은 전선과 데이터 케이블 사이에서 작은 그림자가 빠르게 움직인다."},{"k":"say","w":"로토무","t":"\"로토오!\""},{"k":"n","t":"로토무가 전기 속으로 사라졌다가 다른 기계 안에서 나타난다.\n기계가 갑자기 움직이면서 주인공을 공격한다."},{"k":"say","w":"주인공","t":"\"로토무! 네가 기계 사이를 이동하고 있었구나!\""},{"k":"n","t":"로토무는 잠시 모습을 드러내지만, 곧 회색빛 파동에 휩싸여 다시 기계 속으로 빨려 들어간다."},{"k":"say","w":"주인공","t":"\"이 도시의 시스템이 너를 강제로 움직이고 있어.\"\n\"네가 어디로 가고 싶은지, 무엇을 하고 싶은지는 상관하지 않는 거야.\""},{"k":"bt","kind":"wild","idx":4,"label":"일반 포켓몬 4/4 — 로토무","who":"로토무"},{"k":"n","t":"마지막 기계의 전원이 내려간다.\n로토무가 기계 밖으로 빠져나와 공중에 떠오른다. 주인공 주위를 자유롭게 맴돌며 즐겁게 울음소리를 낸다."},{"k":"say","w":"로토무","t":"\"로토오오!\""},{"k":"sys","t":"\"로토무의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"로토무"},{"k":"n","t":"중앙 서버로 가는 문이 활짝 열린다.\n주인공은 숨을 고르고 문 안으로 들어선다."},{"k":"sc","a":"장면 4-6","b":"다섯 번째 전투","c":"영점 장치의 수호자"},{"k":"bg","t":"영점 장치의 중앙 통제실.\n거대한 기계가 도시 전체를 향해 회색빛을 내뿜는다. 그 아래에는 도시 관장이 기다리고 있다."},{"k":"say","w":"도시 관장","t":"\"결국 여기까지 왔군.\""},{"k":"say","w":"주인공","t":"\"영점 장치를 멈춰야 해요!\""},{"k":"say","w":"도시 관장","t":"\"너는 아직도 변화가 좋은 것이라고 믿는가?\""},{"k":"say","w":"주인공","t":"\"변화가 항상 좋은 결과를 가져오는 건 아니에요.\"\n\"하지만 변화 때문에 상처받는다고 해서, 그 변화 자체를 없애 버릴 수는 없어요.\""},{"k":"say","w":"도시 관장","t":"\"상처받을 자유가 그렇게 중요한가?\""},{"k":"say","w":"주인공","t":"\"상처받지 않으려면 아무것도 사랑하지 않으면 되겠죠. 아무도 믿지 않고, 아무것도 바라지 않으면 잃을 것도 없을 테니까요.\"\n(관장을 똑바로 바라본다.)\n\"하지만 저는 그런 세계에서 살고 싶지 않아요.\""},{"k":"bg","t":"도시 관장은 잠시 침묵한다.\n그러다 천천히 몬스터볼을 들어 올린다."},{"k":"say","w":"도시 관장","t":"\"그렇다면 네가 믿는 변화라는 것이 과연 무엇을 지킬 수 있는지 직접 증명해 보아라.\""},{"k":"n","t":"그가 몬스터볼을 던진다.\n회색빛 데이터가 모여 거대한 강철 포켓몬의 형상을 만들어 낸다.\n메타그로스.\n그러나 네 개의 다리와 얼굴에는 영점 장치의 회로가 연결되어 있다."},{"k":"say","w":"메타그로스","t":"\"메타아아!\""},{"k":"bt","kind":"boss","idx":5,"label":"보스 포켓몬 — 영점 장치의 메타그로스","who":"영점 장치의 메타그로스"},{"k":"n","t":"메타그로스는 기계의 힘을 빌려 강력한 공격을 퍼붓는다.\n공격이 끝날 때마다 통제실의 빛이 밝아지고, 주인공의 움직임까지 느려진다."},{"k":"say","w":"주인공","t":"\"영점 장치가 전투 중에도 우리를 통제하고 있어!\""},{"k":"say","w":"도시 관장","t":"\"변수는 제거해야 한다.\""},{"k":"say","w":"주인공","t":"\"포켓몬은 변수 같은 게 아니에요!\""},{"k":"n","t":"주인공은 메타그로스의 공격을 받아 내면서도 도감으로 회로의 흐름을 살핀다.\n회색빛이 강해질수록 메타그로스의 움직임은 빨라지지만, 공격 이후의 움직임은 점점 불안정해진다."},{"k":"say","w":"주인공","t":"\"메타그로스! 네가 선택해서 움직일 수 있는 순간이 있어!\"\n\"지금이야! 네가 원하는 움직임으로 돌아와!\""},{"k":"n","t":"마지막 공격이 메타그로스의 회로를 끊어 낸다.\n강철 몸체를 감싸던 회색빛이 벗겨지고, 메타그로스는 무릎을 꿇는다."},{"k":"say","w":"메타그로스","t":"\"메타…….\""},{"k":"n","t":"영점 장치가 크게 흔들린다.\n관제실의 회색빛이 약해지고, 도시 곳곳의 포켓몬들이 천천히 고개를 들기 시작한다."},{"k":"sys","t":"\"메타그로스의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"메타그로스"},{"k":"say","w":"주인공","t":"\"끝난 건가요?\""},{"k":"n","t":"도시 관장은 고개를 젓는다."},{"k":"say","w":"도시 관장","t":"\"아니…… 이것은 시작에 불과하다.\""},{"k":"n","t":"관장은 메타그로스를 바라본다."},{"k":"say","w":"도시 관장","t":"\"나는 포켓몬을 지키고 있다고 믿었다. 하지만…… 그들이 스스로 선택할 수 없게 만들었군.\""},{"k":"say","w":"주인공","t":"\"아직 늦지 않았어요. 지금부터라도 되돌릴 수 있어요.\""},{"k":"say","w":"도시 관장","t":"\"이 도시의 영점 장치는 내가 처음 만든 것이 아니다.\"\n(중앙 서버의 잠금 장치를 해제한다.)\n\"이 시스템을 설계한 사람은 이미 오래전에 더 거대한 계획을 시작했다.\""},{"k":"n","t":"중앙 서버의 화면이 켜진다.\n고대 연구 기록과 정지 현상의 발생 위치가 차례대로 나타난다.\n마지막 화면에 한 사람의 이름이 떠오른다.\n라온."},{"k":"say","w":"연구소 AI","t":"\"최초의 영점 장치 개발자 데이터 출력.\"\n\"이름: 라온.\"\n\"과거 챔피언이자 최강의 트레이너.\""},{"k":"say","w":"주인공","t":"\"라온……?\"\n\"정지 현상을 만들어 낸 사람이 한때 최강이라 불렸던 트레이너라고요?\""},{"k":"say","w":"도시 관장","t":"\"그는 오래전부터 변화의 위험성을 주장했다. 그리고 마침내 모든 변화를 멈추는 장치를 만들었다.\""},{"k":"say","w":"주인공","t":"\"그 사람을 만나야겠어요.\""},{"k":"say","w":"도시 관장","t":"\"시간의 흐름이 뒤집힌 곳…… 역천문대에 그가 있다.\""},{"k":"n","t":"도감의 네 번째 페이지가 은색으로 빛난다.\n그 아래에 네 번째 맹세가 새겨진다."},{"k":"vow","t":"네 번째 맹세: 감정을 지운 평온은 평온이 아니라 침묵이다.","final":0},{"k":"say","w":"주인공","t":"\"감정을 없애면 고통도 사라질 거라고 생각했겠죠.\"\n\"하지만 감정을 지우는 건 고통만 지우는 일이 아니야. 기쁨도, 사랑도, 서로를 향한 마음도 함께 사라지는 거야.\""},{"k":"n","t":"도시의 거리에서 아이가 자신의 포켓몬을 껴안는다.\n오랫동안 멈춰 있던 포켓몬이 천천히 아이의 손을 핥는다.\n아이는 눈물을 흘리며 웃는다.\n도시의 회색 하늘에 처음으로 햇빛이 비친다."},{"k":"clr","r":4,"n":["코일","찌리리공","폴리곤","로토무"],"b":["메타그로스"],"f":false,"notes":["네 번째 맹세 해금","라온의 정체 확인"]},{"k":"sc","a":"시나리오 덱 편성","b":"도시 외곽의 전망대","c":"","deckScene":1},{"k":"bg","t":"도시가 내려다보이는 전망대.\n주인공은 회색빛이 걷힌 도시를 바라본다."},{"k":"say","w":"주인공","t":"\"처음 이곳에 왔을 때는 모든 것이 완벽해 보였어.\"\n\"하지만 아무도 웃지 않았고, 포켓몬도 자신의 마음을 표현하지 못했지.\""},{"k":"deck","t":"시나리오 전용 덱 편성 화면이 열린다.\n현재까지 획득한 모든 포켓몬을 확인하고, 다음 지역에 가져갈 덱을 새로 구성할 수 있다."},{"k":"say","w":"주인공","t":"\"이제 정말 중요한 곳으로 가게 될 거야.\"\n\"지금까지 만난 포켓몬과 함께, 라온을 만나러 가자.\""},{"k":"n","t":"도감의 다섯 번째 빛이 보랏빛으로 반짝인다.\n도시 너머의 밤하늘이 일그러진다.\n별들이 거꾸로 움직이며 하늘의 끝으로 빨려 들어간다."},{"k":"next","t":"시간의 역천문대"}]},{"id":"ch5","title":"시간의 역천문대","sub":"다섯 번째 맹세","pages":[{"k":"ttl","a":"제5장","b":"시간의 역천문대","c":"다섯 번째 맹세"},{"k":"sc","a":"장면 5-1","b":"거꾸로 흐르는 별","c":""},{"k":"bg","t":"구름 위에 떠 있는 거대한 역천문대.\n하늘에는 밤과 낮이 동시에 펼쳐져 있다. 별자리들은 과거로 돌아가듯 반대 방향으로 회전하고, 천문대의 거대한 시계는 숫자를 거꾸로 세고 있다.\n주인공이 천문대의 입구에 들어서자 모든 소리가 사라진다.\n발걸음 소리마저 들리지 않는다."},{"k":"n","t":"천문대 중앙의 빛 속에서 한 사람이 걸어 나온다.\n긴 외투와 차분한 눈빛. 그녀는 마치 오래전부터 이곳에서 주인공을 기다리고 있었던 것처럼 자연스럽게 고개를 든다."},{"k":"say","w":"라온","t":"\"어서 와라.\"\n\"천공의 도감을 계승한 아이야.\""},{"k":"say","w":"주인공","t":"\"당신이 라온…….\""},{"k":"say","w":"라온","t":"\"그렇다.\""},{"k":"say","w":"주인공","t":"\"왜 세계의 시간을 멈추려 하는 겁니까?\""},{"k":"n","t":"라온은 잠시 창밖의 별들을 바라본다."},{"k":"say","w":"라온","t":"\"너는 지금까지 여러 포켓몬을 만났겠지. 그들의 두려움도, 분노도, 상처도 보았을 것이다.\""},{"k":"say","w":"주인공","t":"\"네. 하지만 그들은 모두 자신의 의지로 살아갈 수 있는 존재예요.\""},{"k":"say","w":"라온","t":"\"자신의 의지로 살아간다는 것은…… 결국 자신의 의지로 상실을 마주해야 한다는 뜻이기도 하지.\""},{"k":"n","t":"라온의 눈빛이 흔들린다.\n그녀는 손을 들어 오래된 사진 하나를 꺼낸다.\n사진 속에는 젊은 시절의 라온과 푸른빛 포켓몬, 라티오스가 함께 서 있다. 두 존재의 얼굴에는 밝은 웃음이 가득하다."},{"k":"say","w":"라온","t":"\"오래전…… 내게도 가장 소중한 파트너가 있었다.\"\n\"우리는 수많은 모험을 함께했고, 수없이 많은 전투에서 서로를 지켜 주었다.\"\n\"나는 녀석이 세상에서 가장 강한 포켓몬이 되리라 믿었다.\""},{"k":"say","w":"주인공","t":"\"…….\""},{"k":"say","w":"라온","t":"\"하지만 성장과 변화의 과정에서 예기치 못한 사고가 일어났다.\"\n\"나는 아무것도 할 수 없었다. 내가 가진 실력도, 우리가 쌓아 온 유대도…… 아무런 소용이 없었지.\""},{"k":"n","t":"사진 속 라티오스의 형체가 희미하게 흔들린다.\n라온은 사진을 천천히 내려다본다."},{"k":"say","w":"라온","t":"\"내 곁에서 떠나는 순간까지, 나는 녀석을 지킬 수 없었다.\""},{"k":"say","w":"주인공","t":"\"라온…….\""},{"k":"say","w":"라온","t":"\"그날 깨달았다. 변화는 반드시 무언가를 빼앗아 간다는 것을.\"\n\"오늘 건강하던 포켓몬도 내일은 다칠 수 있다. 오늘 함께 웃던 동료도 어느 날 갑자기 떠날 수 있다.\"\n\"아무리 강해도, 아무리 서로를 믿어도…… 미래는 우리를 기다려 주지 않는다.\""},{"k":"say","w":"주인공","t":"\"그래도…….\""},{"k":"say","w":"라온","t":"\"그래서 나는 영점 장치를 만들었다.\""},{"k":"n","t":"라온의 뒤로 거대한 시계의 그림자가 나타난다."},{"k":"say","w":"라온","t":"\"모든 포켓몬의 시간을 정지시키면 누구도 더 이상 늙거나 약해지지 않는다. 누구도 상처받거나 이별하지 않는다.\"\n\"네 포켓몬들도 영원히 지금의 모습 그대로 곁에 남을 수 있겠지.\""},{"k":"n","t":"라온은 주인공을 바라본다."},{"k":"say","w":"라온","t":"\"나와 함께하겠느냐?\"\n\"변화하지 않는 세계에서 너는 영원히 네 동료들과 함께할 수 있다.\""},{"k":"n","t":"긴 침묵이 흐른다.\n주인공은 자신의 도감을 바라본다.\n캐터피가 숲에서 자유롭게 움직이던 순간. 라프라스가 바다에서 다시 노래하던 순간. 파이리가 떨리는 몸으로 손을 잡던 순간.\n그리고 루카리오를 바라보며 미안하다고 말하던 이안의 모습이 떠오른다."},{"k":"say","w":"주인공","t":"\"……아니요.\""},{"k":"say","w":"라온","t":"\"무엇이라고?\""},{"k":"say","w":"주인공","t":"\"확실히 이별은 두렵고, 상처는 아파요. 저도 제가 소중히 여기는 포켓몬을 잃고 싶지 않아요.\"\n\"하지만 우리가 함께 싸우고, 지고, 다시 울면서 일어났던 그 모든 순간이 없었다면…… 지금의 우리와 포켓몬 사이에 있는 유대도 없었을 거예요.\""},{"k":"say","w":"라온","t":"\"…….\""},{"k":"say","w":"주인공","t":"\"포켓몬이 변한다는 건, 우리가 알지 못했던 모습으로 성장할 수 있다는 뜻이기도 해요.\"\n\"언젠가 헤어질 수 있다는 이유로 지금의 만남까지 없애 버릴 수는 없어요.\""},{"k":"n","t":"라온의 표정이 차갑게 굳는다."},{"k":"say","w":"라온","t":"\"안타깝구나.\"\n\"그 어리석음조차…… 정지의 빛 속에서 침묵하게 해 주마.\""},{"k":"n","t":"라온이 뒤로 돌아선다.\n천문대의 거대한 문이 닫히고, 사방에서 네 줄기의 빛이 솟아오른다."},{"k":"say","w":"주인공","t":"\"라온!\""},{"k":"say","w":"라온","t":"\"네가 믿는 미래가 무엇인지, 직접 증명해 보아라.\""},{"k":"sc","a":"장면 5-2","b":"첫 번째 전투","c":"이름 없는 글자들"},{"k":"bg","t":"천문대의 첫 번째 회랑.\n벽면에는 고대 문자처럼 생긴 문양들이 떠다닌다. 문양들은 살아 있는 것처럼 움직이며 길을 가로막는다."},{"k":"say","w":"안농","t":"\"안농…….\""},{"k":"n","t":"수십 개의 안농이 허공에서 나타난다.\n각자의 형태는 조금씩 다르지만, 모두 같은 방향으로 움직이며 하나의 거대한 문양을 만들어 낸다."},{"k":"say","w":"주인공","t":"\"포켓몬의 형상을 한 글자들……?\""},{"k":"n","t":"안농들이 일제히 빛을 내자 통로의 공간이 뒤틀린다. 눈앞의 문이 멀어지고, 뒤쪽에 있던 계단이 갑자기 앞에 나타난다."},{"k":"say","w":"주인공","t":"\"이곳의 시간뿐만 아니라 공간까지 흔들리고 있어!\"\n\"너희가 길을 막고 있는 건…… 라온을 지키기 위해서야?\""},{"k":"bt","kind":"wild","idx":1,"label":"일반 포켓몬 1/4 — 안농","who":"안농"},{"k":"n","t":"안농들이 흩어진다.\n각각의 문양이 원래의 형태를 되찾으며 천천히 주인공 주위에 모인다.\n한 마리의 안농이 도감 위에 내려앉는다."},{"k":"sys","t":"\"안농의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"안농"},{"k":"say","w":"주인공","t":"\"기록은 남아 있어도, 의미는 하나로 정해져 있지 않아.\"\n\"저마다 다른 모양과 의미가 함께 있어야 하나의 이야기가 되는 거야.\""},{"k":"n","t":"회랑 끝의 문이 열린다."},{"k":"sc","a":"장면 5-3","b":"두 번째 전투","c":"종소리가 돌아오는 방"},{"k":"bg","t":"거대한 종이 매달린 원형 방.\n종은 흔들리지 않지만, 일정한 간격으로 울림이 퍼져 나간다.\n한 번 울린 종소리는 사라지지 않고 벽에 부딪쳐 다시 돌아온다."},{"k":"say","w":"동탁군","t":"\"동타아……!\""},{"k":"n","t":"종 아래에 있던 동탁군이 눈을 뜬다.\n종이 울릴 때마다 몸의 문양이 빛나고, 방 안의 모든 움직임이 순간적으로 멈춘다."},{"k":"say","w":"주인공","t":"\"종소리가 울릴 때마다 시간이 잠깐 멈추는 거야!\""},{"k":"n","t":"동탁군이 몸을 회전한다."},{"k":"say","w":"주인공","t":"\"종소리를 이용해 길을 통제하고 있구나.\""},{"k":"bt","kind":"wild","idx":2,"label":"일반 포켓몬 2/4 — 동탁군","who":"동탁군"},{"k":"n","t":"동탁군이 바닥에 내려앉는다.\n종이 마지막으로 한 번 울린 뒤, 방 안에 남아 있던 모든 울림이 사라진다.\n동탁군은 천천히 눈을 감았다가 다시 뜬다."},{"k":"sys","t":"\"동탁군의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"동탁군"},{"k":"say","w":"주인공","t":"\"멈춰 있는 종은 더 이상 소리를 내지 못하지만, 종소리도 영원히 이어질 수는 없어.\"\n\"울림이 사라지기 때문에 다음 소리가 들려오는 거야.\""},{"k":"sc","a":"장면 5-4","b":"세 번째 전투","c":"미래를 보는 눈"},{"k":"bg","t":"수많은 거울이 늘어선 전망 회랑.\n각 거울에는 서로 다른 시간대의 천문대가 비친다. 어떤 거울에는 무너진 천문대가, 다른 거울에는 아직 세워지지 않은 건물이 비친다.\n그 사이에 네이티오가 서 있다."},{"k":"say","w":"네이티오","t":"\"네이이!\""},{"k":"n","t":"네이티오가 날개를 펼치자 거울들이 동시에 빛난다.\n주인공 앞에 수십 개의 미래가 펼쳐진다.\n포켓몬을 지키지 못하는 장면. 영점 장치에 갇히는 장면. 모든 별이 사라지는 장면.\n주인공은 잠시 걸음을 멈춘다."},{"k":"say","w":"주인공","t":"\"이건…… 내가 앞으로 겪게 될 일들이야?\""},{"k":"n","t":"네이티오는 고개를 숙인다."},{"k":"say","w":"주인공","t":"\"미래를 보여 준다고 해서, 그 미래가 반드시 일어나는 건 아니야.\""},{"k":"n","t":"주인공이 도감을 가슴에 품는다."},{"k":"say","w":"주인공","t":"\"어떤 일이 일어날지 알 수 없다면, 내가 할 수 있는 일을 선택하겠어.\""},{"k":"n","t":"네이티오가 날개를 크게 펼치며 공격한다."},{"k":"bt","kind":"wild","idx":3,"label":"일반 포켓몬 3/4 — 네이티오","who":"네이티오"},{"k":"n","t":"거울들이 하나씩 빛을 잃는다.\n마지막 거울에는 주인공과 네이티오가 나란히 서 있는 모습이 비친다.\n네이티오는 거울을 바라보다가 고개를 끄덕인다."},{"k":"sys","t":"\"네이티오의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"네이티오"},{"k":"say","w":"주인공","t":"\"미래가 보인다고 해도, 그 미래를 받아들이기만 해야 하는 건 아니야.\"\n\"우리는 앞으로 나아갈 수 있으니까.\""},{"k":"sc","a":"장면 5-5","b":"네 번째 전투","c":"불길한 경고"},{"k":"bg","t":"천문대의 최상층으로 이어지는 좁은 계단.\n계단 위에는 깜깜한 밤하늘이 보이고, 계단 아래에는 거꾸로 흐르는 시간이 끝없이 펼쳐져 있다.\n그 앞에 앱솔 한 마리가 서 있다."},{"k":"say","w":"앱솔","t":"\"아아아……!\""},{"k":"n","t":"앱솔이 주인공의 길을 막는다."},{"k":"say","w":"주인공","t":"\"왜 나를 막는 거지?\""},{"k":"n","t":"앱솔은 고개를 낮추고 긴 뿔을 들어 올린다."},{"k":"say","w":"주인공","t":"\"나에게 무언가를 경고하려는 거야?\""},{"k":"n","t":"앱솔이 뿔을 움직이는 순간, 하늘의 별 하나가 붉게 변한다.\n그 별은 거대한 붉은 고리로 이어지고, 세계 전체를 집어삼킬 듯 커져 간다."},{"k":"say","w":"주인공","t":"\"저건…… 영점 장치가 폭주한 모습이야?\""},{"k":"n","t":"앱솔이 크게 울부짖는다."},{"k":"say","w":"주인공","t":"\"미래에 닥칠 재앙을 알려 주고 있었구나.\"\n\"하지만 그렇다고 여기서 돌아설 수는 없어. 라온을 막지 않으면 정말로 그런 미래가 찾아올지도 몰라.\""},{"k":"bt","kind":"wild","idx":4,"label":"일반 포켓몬 4/4 — 앱솔","who":"앱솔"},{"k":"n","t":"앱솔이 고개를 든다.\n주인공은 천천히 손을 내민다."},{"k":"say","w":"주인공","t":"\"재앙을 경고하는 건 잘못이 아니야.\"\n\"하지만 경고를 받았다고 해서 반드시 두려움에 굴복해야 하는 건 아니겠지.\""},{"k":"n","t":"앱솔은 주인공을 한참 바라보다가 조용히 길을 비켜 준다."},{"k":"sys","t":"\"앱솔의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"앱솔"},{"k":"n","t":"최상층의 거대한 문이 열린다.\n문 너머에는 눈부신 은빛을 뿜어내는 시계가 떠 있다.\n그 앞에 라온이 서 있다."},{"k":"sc","a":"장면 5-6","b":"다섯 번째 전투","c":"시간의 주인"},{"k":"bg","t":"역천문대의 중심부.\n천장에는 수많은 별이 거꾸로 흐르고, 중앙에는 거대한 시계가 공중에 떠 있다.\n라온이 주인공을 돌아본다."},{"k":"say","w":"라온","t":"\"여기까지 오는 동안 무엇을 보았느냐?\""},{"k":"say","w":"주인공","t":"\"미래를 보는 포켓몬을 만났어요. 수많은 가능성이 보였지만, 어떤 것이 진짜로 일어날지는 알 수 없었어요.\""},{"k":"say","w":"라온","t":"\"그렇기에 미래는 위험한 것이다.\""},{"k":"say","w":"주인공","t":"\"그렇기에 미래를 선택할 수 있는 거예요.\""},{"k":"say","w":"라온","t":"\"…….\""},{"k":"n","t":"라온이 고개를 돌린다.\n그의 앞에서 거대한 푸른빛이 터져 나온다.\n시공간을 지배하는 전설의 포켓몬, 디아루가.\n그러나 디아루가의 몸에는 검은 사슬이 감겨 있고, 가슴의 푸른빛은 붉은빛으로 일그러져 있다."},{"k":"say","w":"라온","t":"\"시간이 무너지고 있다면, 시간을 다스리는 힘으로 바로잡으면 된다.\""},{"k":"say","w":"주인공","t":"\"라온! 디아루가까지 이용하는 거예요?\""},{"k":"say","w":"라온","t":"\"이것은 이용이 아니다. 완벽한 세계를 위한 마지막 조치다.\""},{"k":"n","t":"디아루가가 고개를 들고 울부짖는다."},{"k":"say","w":"디아루가","t":"\"디이이아아아!\""},{"k":"bt","kind":"boss","idx":5,"label":"보스 포켓몬 — 시간에 잠식된 디아루가","who":"시간에 잠식된 디아루가"},{"k":"n","t":"디아루가가 앞발을 내리찍는 순간, 공격의 흔적이 여러 방향으로 분열된다.\n주인공의 포켓몬이 공격을 피하더라도 그 장면이 되돌아오며 다시 같은 공격이 반복된다."},{"k":"say","w":"주인공","t":"\"시간 자체를 되돌리고 있어!\""},{"k":"n","t":"디아루가의 공격이 거세진다.\n주인공의 포켓몬이 밀려나고, 주인공의 손에 들린 도감이 강하게 흔들린다."},{"k":"say","w":"라온","t":"\"보아라. 이것이 시간의 힘이다.\"\n\"패배한 순간도 되돌릴 수 있고, 상처 입은 순간도 지울 수 있다.\""},{"k":"say","w":"주인공","t":"\"아니요……!\"\n(도감을 힘껏 움켜쥔다.)\n\"실패한 순간을 되돌릴 수 있다고 해서, 그 실패를 통해 배운 것까지 없애 버릴 수는 없어요!\""},{"k":"n","t":"도감의 다섯 번째 빛이 강하게 점멸한다.\n주인공은 디아루가가 공격을 반복하는 순간, 이전 공격 이후에 잠깐씩 흔들리는 검은 사슬을 발견한다."},{"k":"say","w":"주인공","t":"\"디아루가! 네가 원하는 움직임은 그게 아니잖아!\"\n\"너도 이 굴레에서 벗어나고 싶을 거야!\""},{"k":"n","t":"마지막 공격이 사슬을 강타한다.\n사슬이 끊어지면서 푸른빛이 되돌아온다.\n디아루가가 큰 울음소리를 내며 고개를 숙인다."},{"k":"say","w":"디아루가","t":"\"디이아…….\""},{"k":"n","t":"천문대의 시계가 천천히 정상 방향으로 움직인다."},{"k":"sys","t":"\"디아루가의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"디아루가"},{"k":"n","t":"라온은 한동안 말을 잇지 못한다."},{"k":"say","w":"라온","t":"\"시간마저…… 내 뜻대로 따르지 않는다는 건가.\""},{"k":"say","w":"주인공","t":"\"라온, 아직 멈출 수 있어요.\"\n\"지금이라면 더 큰 피해 없이 끝낼 수 있어요.\""},{"k":"n","t":"라온은 고개를 젓는다."},{"k":"say","w":"라온","t":"\"이미 너무 멀리 와 버렸다.\""},{"k":"n","t":"라온이 손을 들어 천문대의 가장 깊은 곳을 가리킨다.\n그 너머로 거대한 붉은 고리가 모습을 드러낸다."},{"k":"say","w":"라온","t":"\"영점 장치는 이제 마지막 단계에 들어섰다. 세계 전체의 시간을 멈추는 순간, 누구도 다시는 상처받지 않을 것이다.\""},{"k":"say","w":"주인공","t":"\"그건 평온이 아니에요!\""},{"k":"say","w":"라온","t":"\"그렇다면 네가 믿는 미래로 나아가 보아라.\""},{"k":"n","t":"라온의 모습이 붉은 빛 속으로 사라진다.\n도감의 다섯 번째 페이지가 보랏빛으로 펼쳐진다.\n안농, 동탁군, 네이티오, 앱솔, 디아루가의 기록이 하나씩 나타난다.\n그 아래 다섯 번째 문장이 새겨진다."},{"k":"vow","t":"다섯 번째 맹세: 기억은 아픔을 남기지만, 그 아픔마저 우리가 사랑했다는 증거다.","final":0},{"k":"say","w":"주인공","t":"\"기억하고 있기 때문에 아픈 거야.\"\n\"하지만 기억하고 있기 때문에…… 다시 만난 순간의 기쁨도, 함께했던 시간의 소중함도 알 수 있어.\""},{"k":"n","t":"도감의 여섯 번째 빛이 붉게 타오른다.\n주인공은 천문대의 출구를 향해 달려간다."},{"k":"clr","r":5,"n":["안농","동탁군","네이티오","앱솔"],"b":["디아루가"],"f":false,"notes":["다섯 번째 맹세 해금","라온의 최종 계획 확인"]},{"k":"sc","a":"시나리오 덱 편성","b":"역천문대의 마지막 야영지","c":"","deckScene":1},{"k":"bg","t":"역천문대 아래쪽에 있는 작은 휴식 공간.\n주인공은 도감을 펼쳐 지금까지 기록한 포켓몬들을 살펴본다.\n나무지기와 아차모, 물짱이부터 유리숲의 포켓몬, 바다의 포켓몬, 화산과 도시의 포켓몬, 그리고 디아루가까지."},{"k":"say","w":"주인공","t":"\"처음에는 세 장의 카드뿐이었어.\"\n\"하지만 지금은 이렇게 많은 포켓몬이 함께하고 있어.\"\n\"이제 마지막 전투야. 지금까지 만나 온 동료들과 함께, 반드시 세계를 지켜 내겠어.\""},{"k":"deck","t":"시나리오 전용 덱 편성 화면이 열린다.\n플레이어는 지금까지 획득한 모든 포켓몬을 확인할 수 있다. 원하는 포켓몬으로 덱을 자유롭게 편성한 뒤, 최종 지역으로 출발한다."},{"k":"sys","t":"\"최종 지역 진입이 가능합니다.\"\n\"모든 기록이 마지막 시련을 향해 연결됩니다.\""},{"k":"n","t":"주인공이 덱 편성을 마치자 도감이 강하게 빛난다.\n지라치의 모습이 잠시 나타난다."},{"k":"say","w":"지라치","t":"\"지라……!\""},{"k":"say","w":"주인공","t":"\"지라치…… 너도 나와 함께 가는 거지?\""},{"k":"n","t":"지라치는 말없이 고개를 끄덕인다."},{"k":"next","t":"별이 멈추는 밤"}]},{"id":"ch6","title":"별이 멈추는 밤","sub":"여섯 번째 맹세","pages":[{"k":"ttl","a":"제6장","b":"별이 멈추는 밤","c":"여섯 번째 맹세"},{"k":"sc","a":"장면 6-1","b":"마지막 시간","c":""},{"k":"bg","t":"세계의 모든 하늘이 붉게 물들어 있다.\n구름은 움직이지 않고, 파도는 무너지는 순간에 그대로 얼어붙어 있다. 하늘을 가로지르는 새들은 날개를 편 채 정지해 있고, 나뭇잎들은 바람에 휘날리는 모습 그대로 공중에 멈춰 있다."},{"k":"bg","t":"멀리 역천문대의 상공에는 거대한 붉은 고리가 떠 있다.\n그 고리에서 검은빛의 파동이 세계 전체로 퍼져 나간다."},{"k":"fx","s":"두우우웅…… 두우우웅…….","t":"마치 거대한 심장이 세계의 시간을 멈추려는 것 같은 소리."},{"k":"n","t":"주인공이 절벽 위에 도착한다.\n그 순간, 이안이 달려와 주인공의 앞을 막는다."},{"k":"say","w":"이안","t":"\"주인공!\""},{"k":"say","w":"주인공","t":"\"이안! 여기는 어떻게……?\""},{"k":"say","w":"이안","t":"\"도시에서 영점 장치가 폭주했다는 소식을 듣고 달려왔다. 라온의 부하들이 외부 방어 기지를 장악하고 있더군.\"\n(하늘의 붉은 고리를 바라본다.)\n\"저 장치가 완전히 작동하면 이 세계의 모든 포켓몬이 지금의 모습 그대로 멈춰 버린다는 거지?\""},{"k":"say","w":"주인공","t":"\"그래. 한 번 멈춘 시간은 다시 움직일 수 없을지도 몰라.\""},{"k":"n","t":"이안은 잠시 침묵한다."},{"k":"say","w":"이안","t":"\"그럼 네가 핵심으로 가라.\""},{"k":"say","w":"주인공","t":"\"뭐?\""},{"k":"say","w":"이안","t":"\"외부 방어 기지는 내가 막아 내겠다. 내 포켓몬들과 함께.\""},{"k":"say","w":"주인공","t":"\"하지만 이안, 혼자서는 위험해!\""},{"k":"n","t":"이안은 작게 웃는다."},{"k":"say","w":"이안","t":"\"혼자라고?\"\n(옆에 선 루카리오와 자신의 포켓몬들을 바라본다.)\n\"이 녀석들이 있는데, 내가 왜 혼자지?\""},{"k":"n","t":"루카리오가 이안의 어깨에 손을 올린다."},{"k":"say","w":"이안","t":"\"예전에는 포켓몬의 힘만 믿으면 모든 걸 해결할 수 있다고 생각했다.\"\n\"하지만 지금은 알고 있어. 함께 싸운다는 건, 서로의 약함까지 믿어 주는 일이라는 걸.\""},{"k":"say","w":"주인공","t":"\"이안…….\""},{"k":"say","w":"이안","t":"\"망설이지 마!\"\n\"너와 나, 그리고 포켓몬들이 함께 걸어온 시간이 틀리지 않았다는 걸 증명해!\""},{"k":"n","t":"주인공은 고개를 끄덕인다."},{"k":"say","w":"주인공","t":"\"꼭 돌아올게!\""},{"k":"n","t":"두 사람은 서로 다른 방향으로 달려간다.\n이안과 그의 포켓몬들은 방어 기지를 향하고, 주인공은 붉은빛이 쏟아지는 역천문대의 중심부로 향한다."},{"k":"sc","a":"장면 6-2","b":"첫 번째 전투","c":"달빛의 파수꾼"},{"k":"bg","t":"역천문대로 이어지는 하늘다리.\n다리 아래에는 시간이 멈춘 세계가 펼쳐져 있다. 다리 위에는 은빛 달을 닮은 포켓몬이 떠 있다."},{"k":"say","w":"루나톤","t":"\"루나아…….\""},{"k":"n","t":"루나톤이 몸을 회전하자 하늘의 별들이 한곳에 모인다.\n별빛은 거대한 방패를 만들고 주인공의 길을 가로막는다."},{"k":"say","w":"주인공","t":"\"이 포켓몬도 붉은 고리의 영향을 받고 있어.\""},{"k":"n","t":"루나톤은 대답하지 않는다. 대신 달빛을 모아 공격한다."},{"k":"say","w":"주인공","t":"\"미안해. 하지만 나는 반드시 저 장치에 도착해야 해!\""},{"k":"bt","kind":"wild","idx":1,"label":"일반 포켓몬 1/4 — 루나톤","who":"루나톤"},{"k":"n","t":"루나톤의 빛이 부드럽게 잦아든다.\n하늘을 막고 있던 달빛의 방패가 흩어지고, 별들이 원래 자리로 돌아간다."},{"k":"sys","t":"\"루나톤의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"루나톤"},{"k":"say","w":"주인공","t":"\"달빛도 별빛도…… 모두 제자리에 돌아가야 해.\""},{"k":"n","t":"하늘다리의 다음 구간이 열린다."},{"k":"sc","a":"장면 6-3","b":"두 번째 전투","c":"태양을 붙잡은 포켓몬"},{"k":"bg","t":"하늘다리의 두 번째 구간.\n붉은 태양이 하늘 한가운데 걸려 있다. 낮도 밤도 아닌 빛이 주변을 가득 채운다.\n태양을 닮은 포켓몬이 공중에 떠 있다."},{"k":"say","w":"솔록","t":"\"솔로오!\""},{"k":"n","t":"솔록이 몸을 회전하자 주변의 시간이 급격히 빨라진다.\n바닥에 놓인 바위가 순식간에 낡고, 작은 식물이 자랐다가 시들어 버린다. 그러나 마지막에는 모든 것이 처음 모습으로 되돌아간다."},{"k":"say","w":"주인공","t":"\"시간이 흐르는 것처럼 보이지만, 결국 아무것도 남지 않아.\"\n\"태어나고 성장하고 사라지는 과정이 모두 지워지고 있어.\""},{"k":"bt","kind":"wild","idx":2,"label":"일반 포켓몬 2/4 — 솔록","who":"솔록"},{"k":"n","t":"솔록의 빛이 잦아든다.\n태양이 다시 정상적인 빛을 내고, 바닥에 있던 작은 식물 하나가 천천히 잎을 펼친다."},{"k":"say","w":"주인공","t":"\"다시 자라기 시작했어.\"\n\"조금씩 변해 간다는 건…… 살아 있다는 뜻이야.\""},{"k":"sys","t":"\"솔록의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"솔록"},{"k":"sc","a":"장면 6-4","b":"세 번째 전투","c":"떨어지지 못한 별"},{"k":"bg","t":"하늘다리의 세 번째 구간.\n수많은 빛 조각이 공중에 떠 있다. 자세히 보면 그 빛들은 작은 운석 포켓몬들의 무리다."},{"k":"say","w":"메테노","t":"\"미이니이!\""},{"k":"n","t":"메테노 한 마리가 주인공 가까이 다가온다.\n그러나 몸 주위의 빛이 갑자기 붉게 변하면서 다른 메테노들과 충돌한다."},{"k":"say","w":"주인공","t":"\"저 포켓몬들은 하늘을 떠돌다가 땅으로 내려오는 별과 같아.\"\n\"그런데 별이 떨어지는 순간마저 멈춰 버렸어.\""},{"k":"bt","kind":"wild","idx":3,"label":"일반 포켓몬 3/4 — 메테노","who":"메테노"},{"k":"n","t":"메테노를 감싸던 붉은빛이 사라진다.\n하늘에 떠 있던 다른 메테노들도 하나씩 빛을 되찾는다.\n한 마리가 주인공 주변을 빙글빙글 돌다가 다시 하늘 위로 날아간다."},{"k":"sys","t":"\"메테노의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"메테노"},{"k":"say","w":"주인공","t":"\"별이 어디로 떨어질지는 알 수 없어.\"\n\"하지만 그렇기 때문에…… 별이 떨어지는 순간도 아름다운 거겠지.\""},{"k":"n","t":"하늘에 짧은 별똥별이 나타난다.\n시간이 멈춘 이후 처음으로 별이 하늘을 가로질러 움직인다."},{"k":"sc","a":"장면 6-5","b":"네 번째 전투","c":"미래를 빼앗는 자"},{"k":"bg","t":"역천문대 최종 관문.\n거대한 붉은 고리가 바로 앞에 보인다. 그 앞에서 포켓몬 하나가 빛을 모으고 있다."},{"k":"say","w":"벰크","t":"\"벰에에!\""},{"k":"n","t":"벰크가 두 팔을 들어 올리자 주인공의 주변에 환영이 나타난다.\n주인공은 자신이 라온에게 패배하는 장면을 본다. 이어서 세계의 시간이 멈추고, 모든 포켓몬의 모습이 사라지는 장면이 반복된다."},{"k":"say","w":"주인공","t":"\"이건 환상이야!\""},{"k":"n","t":"벰크는 주인공의 움직임을 읽듯 공격을 계속한다. 주인공이 한쪽으로 피하면 같은 방향으로 공격이 따라온다."},{"k":"say","w":"주인공","t":"\"내가 두려워하는 미래를 보여 주는 거야…….\"\n(도감을 가슴에 품는다.)\n\"하지만 그 미래를 두려워한다고 해서, 내가 선택할 수 있는 것까지 사라지는 건 아니야!\""},{"k":"bt","kind":"wild","idx":4,"label":"일반 포켓몬 4/4 — 벰크","who":"벰크"},{"k":"n","t":"환영은 계속해서 주인공의 패배를 보여 준다.\n라온의 목소리가 환영 속에서 들려온다."},{"k":"say","w":"라온의 목소리","t":"\"네가 아끼는 포켓몬을 지킬 수 없게 된다면?\"\n\"네가 아무리 노력해도 결국 모든 것을 잃게 된다면?\""},{"k":"n","t":"주인공은 잠시 눈을 감는다."},{"k":"say","w":"주인공","t":"\"그래도…… 나는 멈추지 않을 거야.\"\n\"함께했던 시간을 후회하지 않을 거야.\""},{"k":"n","t":"주인공의 도감에서 여섯 개의 빛이 하나씩 나타난다.\n환영이 갈라지며 벰크의 시야를 가로막던 검은빛이 사라진다.\n벰크가 마지막 공격을 시도하지만 주인공의 포켓몬이 이를 막아 낸다."},{"k":"n","t":"벰크는 천천히 손을 내린다.\n잠시 후, 자신의 의지로 고개를 끄덕인다."},{"k":"sys","t":"\"벰크의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"벰크"},{"k":"say","w":"주인공","t":"\"두려움이 사라져야만 용감해지는 건 아니야.\"\n\"두려워도 앞으로 나아갈 수 있다면…… 그걸로 충분해.\""},{"k":"n","t":"최종 관문이 열린다.\n붉은 고리의 중심에서 라온이 주인공을 기다리고 있다."},{"k":"sc","a":"장면 6-6","b":"다섯 번째 전투","c":"별이 멈추는 밤"},{"k":"bg","t":"역천문대의 핵심 장치.\n하늘과 땅의 경계가 사라져 있다. 주변에는 별과 바위, 나무, 물결이 뒤섞인 채 공중에 떠 있다.\n세계의 모든 시간이 이 한곳으로 모여들고 있다.\n붉은 고리의 중심에는 거대한 검은 균열이 열려 있다.\n라온은 균열 앞에 서 있다."},{"k":"say","w":"라온","t":"\"마침내 도착했구나.\""},{"k":"say","w":"주인공","t":"\"라온! 이제 그만둬요!\""},{"k":"say","w":"라온","t":"\"지금 이 순간에도 세계의 시간은 무너지고 있다. 포켓몬들은 더 이상 고통받지 않을 것이다.\""},{"k":"say","w":"주인공","t":"\"하지만 그들은 더 이상 살아갈 수 없어요!\""},{"k":"say","w":"라온","t":"\"살아간다는 것은 결국 무언가를 잃는다는 뜻이다!\""},{"k":"say","w":"주인공","t":"\"잃을 수 있다는 이유로 모든 것을 멈춰 버리는 건…… 살아가는 게 아니에요!\""},{"k":"bg","t":"라온은 두 눈을 감는다."},{"k":"say","w":"라온","t":"\"나는 더 이상 아무도 잃고 싶지 않다.\""},{"k":"say","w":"주인공","t":"\"당신이 잃은 포켓몬은 당신이 그 포켓몬을 사랑하지 않았기 때문에 떠난 게 아니에요.\""},{"k":"bg","t":"라온의 눈이 흔들린다."},{"k":"say","w":"라온","t":"\"그만해라.\""},{"k":"say","w":"주인공","t":"\"함께했던 시간이 소중했기 때문에 지금도 기억하는 거잖아요!\""},{"k":"say","w":"라온","t":"\"그만하라고 했다!\""},{"k":"n","t":"라온이 손을 치켜든다.\n붉은 고리가 폭발하듯 빛나며 거대한 검은 포켓몬이 모습을 드러낸다.\n기라티나.\n그러나 기라티나의 몸에는 영점 장치의 사슬이 깊숙이 박혀 있고, 날개처럼 펼쳐진 검은 형체는 시간의 균열과 하나로 뒤엉켜 있다."},{"k":"say","w":"라온","t":"\"영점 장치 가동!\"\n\"모든 진화와 성장의 궤적을 소멸시켜라!\""},{"k":"say","w":"기라티나","t":"\"기라아아아아!\""},{"k":"n","t":"세계의 별들이 한순간 모두 멈춘다.\n주인공의 도감에서 여섯 개의 빈 페이지가 동시에 펼쳐진다."},{"k":"bgm","t":"웅장하고 비장한 오케스트라 사운드.\n현악기가 급격히 고조되고, 깊은 북소리가 심장 박동처럼 울려 퍼진다."},{"k":"bt","kind":"final","idx":5,"label":"최종 보스 포켓몬 — 영점 장치와 융합한 기라티나","who":"영점 장치와 융합한 기라티나","phase":1,"ph":"페이즈 1. 멈춘 세계"},{"k":"n","t":"기라티나가 날개를 펼친다.\n주변의 시간과 공간이 뒤틀리고, 주인공의 포켓몬들은 공격을 시도할 때마다 이전 위치로 되돌아간다.\n기라티나가 울부짖을 때마다 검은 고리가 넓어진다."},{"k":"say","w":"라온","t":"\"보아라! 어떠한 노력도, 어떠한 유대도 시간 앞에서는 무력하다!\""},{"k":"say","w":"주인공","t":"\"아니……!\""},{"k":"n","t":"주인공은 지금까지 획득한 포켓몬들의 기록을 도감에서 확인한다.\n유리숲에서 해방된 포켓몬들.\n바다의 흐름을 되찾은 포켓몬들.\n자신의 힘을 두려워하던 파이리.\n스스로 움직일 수 있게 된 도시의 포켓몬들.\n그리고 미래를 경고했던 포켓몬들."},{"k":"say","w":"주인공","t":"\"우리가 함께 겪었던 일들은 사라지지 않았어!\"\n\"함께 이곳까지 왔다는 사실은…… 아무리 시간을 되돌려도 사라지지 않아!\""},{"k":"n","t":"도감의 첫 번째 빛이 기라티나에게 날아간다.\n기라티나의 몸에 박힌 검은 사슬 하나가 흔들린다."},{"k":"say","w":"주인공","t":"\"지금이야! 포켓몬들이 쌓아 온 힘을 하나로 모아!\""},{"k":"n","t":"주인공의 포켓몬들이 기라티나를 향해 연속으로 공격한다.\n기라티나가 강력한 파동을 방출하지만, 주인공은 여러 동료와 함께 공격을 이어 나간다.\n마침내 검은 사슬 하나가 끊어진다."},{"k":"ph","t":"페이즈 2. 무너지는 영점 장치"},{"k":"n","t":"기라티나가 크게 울부짖는다.\n기계와 융합한 몸체가 거대한 빛을 내뿜는다. 사방의 균열이 넓어지고, 영점 장치의 일부가 떨어져 나간다."},{"k":"say","w":"라온","t":"\"안 돼……! 아직 끝나지 않았다!\"\n\"영점 장치, 출력 최대로!\""},{"k":"fx","s":"쿠구구구구궁!","t":"기계의 힘이 기라티나의 몸을 다시 감싼다.\n검은 사슬이 끊어진 자리를 대신해 새로운 회로가 뻗어 나온다."},{"k":"say","w":"주인공","t":"\"라온! 기라티나도 더 이상 견디지 못하고 있어!\""},{"k":"say","w":"라온","t":"\"기라티나는 세계의 시간을 멈추기 위한 수단이다!\""},{"k":"say","w":"주인공","t":"\"아니요. 기라티나도 자신의 의지로 살아가는 포켓몬이에요!\""},{"k":"n","t":"주인공의 도감이 강하게 진동한다.\n여섯 개의 별 문양이 페이지에서 떠올라 공중에 모인다.\n첫 번째 초록빛.\n두 번째 푸른빛.\n세 번째 주황빛.\n네 번째 은빛.\n다섯 번째 보랏빛.\n마지막 여섯 번째 빛."},{"k":"say","w":"주인공","t":"\"우리가 만난 포켓몬들이 모두 다른 마음을 가지고 있었던 것처럼……!\"\n\"누구도 똑같은 모습으로 멈춰 있을 필요는 없어!\""},{"k":"bt","kind":"final","idx":5,"phase":2,"label":"최종 보스 포켓몬 — 영점 장치와 융합한 기라티나","who":"영점 장치와 융합한 기라티나","ph":"페이즈 2. 무너지는 영점 장치"},{"k":"n","t":"주인공의 포켓몬들이 힘을 모아 기라티나의 가슴에 박힌 핵심 장치를 공격한다.\n기라티나는 마지막으로 거대한 파동을 일으키지만, 여섯 개의 빛이 보호막을 형성하며 공격을 막아 낸다."},{"k":"fx","s":"콰아아아앙!","t":"핵심 장치가 부서진다."},{"k":"ph","t":"페이즈 3. 마지막 선택"},{"k":"bg","t":"붉은 고리가 무너지기 시작한다.\n영점 장치의 회로는 불꽃처럼 흩어지고, 검은 균열 사이로 수많은 포켓몬의 기록이 빛으로 나타난다.\n기라티나는 힘없이 바닥에 내려앉는다."},{"k":"say","w":"라온","t":"\"……어째서.\"\n\"왜…… 끝까지 멈추지 못한 거지?\""},{"k":"bg","t":"주인공은 기라티나를 바라본다."},{"k":"say","w":"주인공","t":"\"이제 그만해도 돼, 라온.\""},{"k":"say","w":"라온","t":"\"내가 여기서 멈춘다면…… 모든 것을 잃은 그날의 일이 다시 떠오를 것이다.\""},{"k":"say","w":"주인공","t":"\"잊지 않아도 돼요.\""},{"k":"say","w":"라온","t":"\"……뭐라고?\""},{"k":"say","w":"주인공","t":"\"소중한 포켓몬을 잃은 기억을 억지로 지울 필요는 없어요. 슬퍼해도 되고, 그리워해도 돼요.\"\n\"하지만 그 기억 때문에 다른 포켓몬들의 미래까지 빼앗아서는 안 돼요.\""},{"k":"n","t":"주인공의 도감에서 마지막 남은 빛이 터져 나온다.\n지라치가 공중에 모습을 드러낸다."},{"k":"say","w":"지라치","t":"\"지라아아아아!\""},{"k":"fx","s":"우우우우웅……!","t":"여섯 개의 빛이 하나로 모인다.\n초록, 파랑, 주황, 은색, 보라, 그리고 무지갯빛.\n하나로 합쳐진 빛이 영점 장치의 마지막 회로를 향해 쏟아진다."},{"k":"say","w":"주인공","t":"\"우리의 선택은…… 미래로 나아가는 거야!\"\n\"가라, 모두들!\""},{"k":"n","t":"주인공의 포켓몬들이 마지막 공격을 가한다.\n무지갯빛 광선이 기라티나의 몸을 감싸며 영점 장치와 기라티나를 분리한다.\n기계의 마지막 핵이 부서진다."},{"k":"fx","s":"콰아아아아앙!","t":""},{"k":"n","t":"거대한 붉은 고리가 산산이 부서진다.\n세계의 시간이 다시 흐르기 시작한다.\n멈춰 있던 파도가 하얀 물보라를 일으키며 해안으로 밀려온다. 하늘의 새들이 날개를 움직이고, 바람이 나뭇잎을 흔든다.\n기라티나의 몸에서 검은 사슬이 모두 사라진다."},{"k":"say","w":"기라티나","t":"\"기라…….\""},{"k":"sys","t":"\"기라티나의 기록이 등록되었습니다.\"\n\"시나리오 보유 카드에 추가되었습니다.\"","m":"기라티나"},{"k":"n","t":"여섯 개의 빛이 천공의 도감으로 돌아간다.\n도감의 마지막 빈 페이지가 환하게 펼쳐진다.\n그 순간, 영점 장치의 잔해에서 작은 빛 하나가 떠오른다.\n라온이 숨을 멈춘다."},{"k":"say","w":"라온","t":"\"저 빛은…….\""},{"k":"n","t":"빛이 천천히 포켓몬의 형상으로 바뀐다.\n푸른 몸체와 붉은 눈동자. 날개를 펼친 모습은 오래된 사진 속 모습과 똑같다.\n라티오스.\n라온의 옛 파트너가 남긴 기억의 환영이다.\n라티오스는 조용히 라온에게 다가간다."},{"k":"say","w":"라온","t":"\"아…….\"\n(무릎을 꿇는다.)\n\"너는…….\""},{"k":"n","t":"라티오스가 라온의 어깨에 머리를 부드럽게 기댄다.\n라온은 떨리는 손으로 라티오스의 몸을 쓰다듬는다."},{"k":"say","w":"라온","t":"\"나는 네가 떠난 뒤…… 너와 함께했던 모든 시간을 되돌리고 싶었다.\"\n\"다시는 상처받지 않도록, 다시는 잃어버리지 않도록…… 모든 것을 멈추려고 했어.\""},{"k":"n","t":"라티오스는 조용히 눈을 감는다."},{"k":"say","w":"라온","t":"\"하지만 너는…… 나를 원망하고 있었던 게 아니었구나.\"\n\"그저…… 나와 함께 보냈던 그 찬란했던 시간들을 기억해 주길 바랐던 것뿐이었어.\""},{"k":"n","t":"라온의 눈에서 눈물이 떨어진다."},{"k":"say","w":"라온","t":"\"내가 틀렸었다…….\"\n(라티오스를 끌어안는다.)\n\"미안하다. 정말…… 미안하다.\""},{"k":"n","t":"라티오스의 환영이 천천히 빛으로 변한다.\n마지막 순간, 라티오스는 라온을 향해 환한 미소를 짓는다.\n그리고 별빛처럼 흩어져 도감 속으로 스며든다.\n라온은 눈을 감은 채 오랫동안 그 자리에 앉아 있다.\n주인공은 말없이 그 모습을 지켜본다."},{"k":"bgm","t":"웅장한 오케스트라가 잦아들고, 따뜻한 피아노 선율이 다시 흐른다."},{"k":"n","t":"천공의 도감에 마지막 문장이 나타난다."},{"k":"vow","t":"여섯 번째 맹세: 미래는 보장할 수 없지만, 그렇기에 우리는 선택할 수 있다.","final":0},{"k":"say","w":"주인공","t":"\"미래가 어떻게 될지는 아무도 몰라요.\"\n\"하지만 그렇기 때문에…… 우리는 지금 어떤 사람이 될지, 어떤 선택을 할지 결정할 수 있어요.\""},{"k":"n","t":"도감의 여섯 페이지가 동시에 빛난다.\n여섯 개의 맹세가 하나의 거대한 별 문양으로 연결된다.\n지라치가 주인공의 어깨에 살며시 내려앉는다."},{"k":"say","w":"지라치","t":"\"지라…….\""},{"k":"say","w":"주인공","t":"\"응. 끝났어.\"\n(하늘을 올려다본다.)\n\"이제 다시 움직이기 시작했어.\""},{"k":"clr","r":6,"n":["루나톤","솔록","메테노","벰크"],"b":["기라티나"],"f":true,"notes":["여섯 번째 맹세 해금","영점 장치 파괴","세계의 시간 정상화","라온의 집착과 상실에 얽힌 진실 해소"]}]},{"id":"epilogue","title":"에필로그","sub":"다음 페이지","pages":[{"k":"ttl","a":"에필로그","b":"다음 페이지","c":""},{"k":"sc","a":"장면 E-1","b":"다시 움직이는 세계","c":""},{"k":"bg","t":"화창한 아침.\n하늘에는 푸른빛이 가득하고, 구름은 느긋하게 흘러간다. 새들은 하늘을 날고, 나무에서는 작은 열매가 익어 간다.\n유리숲에서는 포켓몬들이 자유롭게 뛰놀고 있다.\n바다에서는 라프라스 무리가 노래하며 헤엄친다."},{"k":"bg","t":"화산의 용암은 안정적으로 흐르고, 이름을 잃은 도시에는 다시 사람들의 웃음소리가 울려 퍼진다."},{"k":"n","t":"주인공은 언덕 위에서 천천히 주변을 둘러본다."},{"k":"say","w":"주인공","t":"\"모든 것이…… 다시 움직이고 있어.\""},{"k":"n","t":"나무지기와 아차모, 물짱이가 주인공의 곁에 나타난다.\n이상해씨와 파이리도 뒤따라온다.\n도감 안에 기록된 포켓몬들의 빛이 하나씩 반짝인다."},{"k":"say","w":"주인공","t":"\"고마워, 모두들.\"\n\"우리가 함께한 시간이…… 이 세계를 다시 움직이게 했어.\""},{"k":"n","t":"멀리서 발소리가 들린다.\n이안이 몬스터볼을 손에 쥔 채 언덕 위로 올라온다."},{"k":"say","w":"이안","t":"\"주인공.\""},{"k":"say","w":"주인공","t":"\"이안!\""},{"k":"n","t":"이안은 한 손을 허리에 얹으며 활짝 웃는다."},{"k":"say","w":"이안","t":"\"세계도 구했으니…… 이제 진짜 승부를 낼 때다!\""},{"k":"say","w":"주인공","t":"\"뭐야, 지금까지의 전투는 진짜 승부가 아니었다는 거야?\""},{"k":"say","w":"이안","t":"\"당연하지. 라온을 막아야 했으니 어쩔 수 없이 협력했을 뿐이다.\""},{"k":"say","w":"주인공","t":"\"그래? 그렇다면 이번에는 봐주지 않을 거야!\""},{"k":"say","w":"이안","t":"\"흥. 그 말, 후회하지 마라.\""},{"k":"n","t":"두 사람이 몬스터볼을 들어 올린다.\n이안의 루카리오가 자신의 트레이너 곁에 선다.\n주인공의 포켓몬들도 힘차게 울음소리를 낸다."},{"k":"bgm","t":"밝고 경쾌한 모험 테마."},{"k":"say","w":"주인공","t":"\"준비됐지?\""},{"k":"say","w":"이안","t":"\"언제든지!“"},{"k":"n","t":"이안과 주인공의 배틀이 시작된다."},{"k":"bt","kind":"duel","idx":0,"label":"배틀 리그 — 트레이너 이안","who":"이안"},{"k":"bgm","t":"전투가 종료된 후, 주인공의 천공의 도감이 가볍게 진동한다."},{"k":"fx","s":"띠링.","t":""},{"k":"say","w":"주인공","t":"\"어……?\""},{"k":"n","t":"도감이 저절로 펼쳐진다.\n여섯 개의 맹세가 새겨진 페이지 아래에서 새로운 빛의 문장이 떠오른다."},{"k":"sys","t":"\"기록 완료.\"\n\"여섯 개의 맹세가 정상적으로 연결되었습니다.\"\n\"그러나 모든 기록이 완성된 것은 아닙니다.\""},{"k":"n","t":"페이지가 저절로 넘어간다.\n그 너머에는 지금까지 한 번도 본 적 없는 새로운 대륙의 지도가 펼쳐져 있다.\n거대한 숲과 끝없는 사막, 하늘에 떠 있는 섬, 얼어붙은 바다와 이름 모를 고대 유적들이 지도 위에 희미하게 나타난다."},{"k":"say","w":"주인공","t":"\"이곳은……?\""},{"k":"vow","t":"모든 포켓몬의 기록은 완성될 수 없다. 살아 있는 한, 새로운 기록은 계속 태어나기 때문이다.","final":1},{"k":"vow","t":"아직 기록되지 않은 포켓몬들이 미지의 대륙에서 당신을 기다리고 있다.","final":1},{"k":"n","t":"주인공은 미지의 대륙을 한참 동안 바라본다.\n이안이 옆에서 고개를 내민다."},{"k":"say","w":"이안","t":"\"뭐야? 또 무슨 일이 생긴 거지?\""},{"k":"say","w":"주인공","t":"\"응. 새로운 대륙이 발견됐어.\""},{"k":"say","w":"이안","t":"\"……뭐라고?\""},{"k":"say","w":"주인공","t":"\"아직 기록되지 않은 포켓몬들이 있대.\""},{"k":"n","t":"이안은 잠시 지도를 바라보다가 천천히 미소 짓는다."},{"k":"say","w":"이안","t":"\"하…….\"\n(몬스터볼을 다시 쥔다.)\n\"그럼 네가 또 먼저 가겠군.\""},{"k":"say","w":"주인공","t":"\"이번에는 같이 가는 거야.\""},{"k":"say","w":"이안","t":"\"뭐?\""},{"k":"say","w":"주인공","t":"\"우리가 함께 싸울 수 있다는 걸 알게 됐잖아. 앞으로도 그럴 수 있어.\""},{"k":"n","t":"이안은 잠시 말이 없다가 고개를 끄덕인다."},{"k":"say","w":"이안","t":"\"……좋아. 이번에는 처음부터 함께 가도록 하지.\""},{"k":"n","t":"두 사람은 나란히 언덕을 내려간다.\n뒤쪽의 도감에서는 여섯 개의 별 문양이 조용히 빛난다.\n지라치는 하늘을 바라보다가 주인공의 뒤를 따라 날아간다."},{"k":"bgm","t":"메인 테마가 다시 흐른다."},{"k":"n","t":"푸른 하늘 위로 카메라가 천천히 올라간다.\n구름 너머로 새로운 대륙의 윤곽이 드러난다.\n그곳 어딘가에서 정체를 알 수 없는 포켓몬의 울음소리가 들려온다."},{"k":"end","t":"포켓몬: 별의 종언과 여섯 개의 맹세"},{"k":"end","t":"FIN"},{"k":"end","t":"그리고 새로운 모험으로……","later":1}]}];

 if(!S.meta.settings.bgm){scStopMusic();if(AU.musicTimer){clearInterval(AU.musicTimer);AU.musicTimer=null;}AU.musicMode='';if(AU.musicGain&&AU.ctx)AU.musicGain.gain.setTargetAtTime(.0001,AU.ctx.currentTime,.1);return;}

 AU.musicMode='scenario';AU.musicStep=0;SC_BGM.region=region;SC_BGM.step=0;bus.gain.cancelScheduledValues(c.currentTime);bus.gain.setTargetAtTime(.22,c.currentTime,.16);

  {tempo:148,mel:[73,77,80,85,80,77,73,72,73,77,82,85,82,80,77,73],bass:[37,37,44,44,41,41,36,36],ch:[[61,65,68],[56,60,63],[58,61,65],[53,56,60]],type:'square'},
  {tempo:188,mel:[74,78,81,86,81,78,74,73,74,78,83,86,83,81,78,74],bass:[42,42,49,49,45,45,40,40],ch:[[62,66,69],[57,61,64],[59,62,66],[54,57,61]],type:'sine'},
  {tempo:138,mel:[62,65,70,74,73,70,65,62,65,70,74,77,74,70,65,61],bass:[34,34,41,41,38,38,33,33],ch:[[50,53,58],[46,50,53],[48,51,55],[45,49,52]],type:'sawtooth'}
 ];
 const t=tracks[region],stepMs=t.tempo;
 SC_BGM.timer=setInterval(()=>{if(!AU.ctx||AU.ctx.state!=='running'||!S.meta.settings.bgm)return;const k=SC_BGM.step,mel=t.mel[Math.floor(k/2)%t.mel.length];if(k%2===0)musicNote(midiHz(mel),region===2?.17:.25,t.type,region===3?.023:.038);if(k%4===0){const bn=t.bass[Math.floor(k/4)%t.bass.length];musicNote(midiHz(bn),.38,'sine',.048);}if(k%16===0){const ch=t.ch[Math.floor(k/16)%t.ch.length];for(const n of ch)musicNote(midiHz(n),.75,region===3?'triangle':'sine',.014);}if(region===5&&k%8===0)musicNote(midiHz(26),.6,'sine',.018);SC_BGM.step=(k+1)%64;},stepMs);

// ===== 시나리오 연출: 등장 포켓몬 · 효과음 이펙트 · 여섯 별 문양 =====
// (1) 장면에 등장하는 포켓몬을 큰 그림으로 보여줘요. 이야기에 이름이 나오면 등장하고, 같은 장면에서 잠깐 더 머물러요.
const SC_CAST_KINDS={n:1,bg:1,say:1,sys:1,fx:1};
const SC_CAST_HINTS=[{id:385,re:/하얀 빛으로 이루어진 몸|머리 양옆으로 늘어진 긴 부적/}]; // 이름 없이 모습만 나오는 등장 장면
let _scNameList=null;
function scNameList(){if(!_scNameList){const m=scN2I();_scNameList=Object.keys(m).map(n=>({n,id:m[n]})).sort((a,b)=>b.n.length-a.n.length);}return _scNameList;}
function scMonsIn(q){const t=String(q.t||'')+' '+String(q.w||'')+' '+String(q.m||''),found=[];let rest=t;
 for(const it of scNameList()){if(rest.indexOf(it.n)>=0){found.push(it.id);rest=rest.split(it.n).join(' ');}}
 SC_CAST_HINTS.forEach(h=>{if(h.re.test(t)&&found.indexOf(h.id)<0)found.push(h.id);});
 return found.sort((a,b)=>t.indexOf(MON[a]?MON[a].name:'')-t.indexOf(MON[b]?MON[b].name:''));}
function scCastAt(u,pos){const pages=scPages(u);if(!SC_CAST_KINDS[pages[pos].k])return[];
 let st=0;for(let i=pos;i>=0;i--){if(pages[i].k==='sc'||pages[i].k==='ttl'){st=i;break;}}
 const last={},first={};
 for(let i=st;i<=pos;i++){const q=pages[i];if(!SC_CAST_KINDS[q.k])continue;scMonsIn(q).forEach((id,k)=>{if(last[id]==null||i-last[id]>3)first[id]=i;last[id]=i+k*.01;});}
 const out=Object.keys(last).map(Number).filter(id=>pos-Math.floor(last[id])<=2).sort((a,b)=>last[b]-last[a]).slice(0,3);
 return out.map(id=>({id,fresh:first[id]===pos&&Math.floor(last[id])===pos,talk:pages[pos].k==='say'&&scMonId(pages[pos].w)===id}));}
function scCastHTML(u,pos){const c=scCastAt(u,pos);if(!c.length)return '';
 return `<div class="scv-cast n${c.length}">${c.map(x=>`<figure class="scv-cm${x.fresh?' fresh':''}${x.talk?' talk':''}" title="${esc(scMonName(x.id))}"><img src="${spriteURL(x.id,'art')}" data-id="${x.id}" data-k="art" alt="${esc(scMonName(x.id))}" draggable="false" onerror="imgFail(this)"><i class="sh"></i><figcaption>${esc(scMonName(x.id))}</figcaption></figure>`).join('')}</div>`;}

function scFxKind(s){s=String(s||'');
 if(/두우|심장/.test(s))return 'beat';
 if(/쿠|쿵|우르/.test(s))return 'quake';
 if(/콰|쾅|펑/.test(s))return 'blast';
 if(/촤|철썩|쏴/.test(s))return 'splash';
 if(/끼이|삐걱/.test(s))return 'creak';
 if(/^\s*탁|뚜벅|다다/.test(s))return 'step';
 if(/띠링|딩/.test(s))return 'chime';
 return 'hum';}
function scFxOverlay(kind){const R=scRng(kind.length*131+7);let h='';const n=(c,f)=>{for(let i=0;i<c;i++)h+=f(i);};
 if(kind==='quake'){h+='<i class="fxo-dim"></i>';n(34,i=>`<i class="fxo-dust" style="left:${R()*100}%;--s:${3+R()*9}px;--t:${.9+R()*1.1}s;--d:${R()*.7}s"></i>`);n(9,i=>`<i class="fxo-rock" style="left:${6+R()*88}%;--s:${8+R()*16}px;--t:${.7+R()*.6}s;--d:${R()*.9}s"></i>`);h+='<i class="fxo-crack"></i>';}
 else if(kind==='blast'){h+='<i class="fxo-flash"></i><i class="fxo-ring"></i><i class="fxo-ring r2"></i>';n(22,i=>{const a=R()*6.283,d=22+R()*30;return `<i class="fxo-spark" style="--dx:${Math.cos(a)*d}vmin;--dy:${Math.sin(a)*d}vmin;--d:${R()*.15}s"></i>`;});n(16,i=>`<i class="fxo-dust" style="left:${R()*100}%;--s:${4+R()*10}px;--t:${1+R()*1}s;--d:${R()*.5}s"></i>`);}
 else if(kind==='hum'){h+='<i class="fxo-glow"></i>';n(5,i=>`<i class="fxo-wave" style="--d:${i*.42}s"></i>`);n(18,i=>`<i class="fxo-mote" style="left:${R()*100}%;top:${R()*100}%;--d:${R()*1.5}s"></i>`);}
 else if(kind==='splash'){h+='<i class="fxo-surge"></i>';n(30,i=>`<i class="fxo-drop" style="left:${8+R()*84}%;--s:${5+R()*10}px;--t:${.9+R()*.8}s;--d:${R()*.6}s"></i>`);}
 else if(kind==='creak'){n(14,i=>`<i class="fxo-dust" style="left:${R()*100}%;--s:${2+R()*5}px;--t:${2+R()*1.5}s;--d:${R()*1.4}s;opacity:.6"></i>`);h+='<i class="fxo-sway"></i>';}
 else if(kind==='step'){n(4,i=>`<i class="fxo-puff" style="left:${14+i*22}%;--d:${i*.28}s"></i>`);}
 else if(kind==='chime'){n(22,i=>`<i class="fxo-twinkle" style="left:${R()*100}%;top:${R()*100}%;--d:${R()*1.2}s;--s:${8+R()*16}px"></i>`);}
 else if(kind==='beat'){h+='<i class="fxo-beat"></i><i class="fxo-beat b2"></i>';}
 return `<div class="scv-fxlay fxl-${kind}" aria-hidden="true">${h}</div>`;}
function scFxHTML(pg){const k=scFxKind(pg.s),chars=[...String(pg.s||'')].map((c,i)=>c.trim()?`<span style="--i:${i}">${esc(c)}</span>`:'&nbsp;').join('');
 return `<div class="scv-fx fxk-${k}"><b class="scv-fxtxt">${chars}</b>${pg.t?`<div>${scLines(pg.t)}</div>`:''}</div>`+scFxOverlay(k);}
function scFxRun(pg){const lay=$('.scv-fxlay');if(S.meta.settings.lowfx){if(lay)lay.remove();return;}const k=scFxKind(pg.s),st=$('#scStage');if(!st)return;
 const cls='fxs-'+k;st.classList.add(cls);setTimeout(()=>{if(st)st.classList.remove(cls);},1900);
 if(lay){document.body.appendChild(lay);setTimeout(()=>{if(lay.parentNode)lay.remove();},3200);}
 try{if(k==='quake'||k==='beat')noise(.7,.16,170);else if(k==='blast')noise(.5,.2,320);else if(k==='splash')noise(.5,.1,1400);else if(k==='creak')noise(.4,.06,420);else if(k==='step')noise(.12,.1,260);else if(k==='chime')sfx('level');else noise(.5,.08,520);}catch(e){}}

const SC_STAR_COL=['#5df08c','#5aa8ff','#ff9a4a','#e4e9f6','#b58cff','url(#scEmRb)'];
const SC_STAR_GLOW=['#3dff7a','#3b8bff','#ff7a1f','#cfd8f0','#9a6bff','#ff8ad8'];
function scStarPts(cx,cy,R,r){let p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;p.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1));}return p.join(' ');}
function scEmblemHTML(mode){ // mode: seq(하나씩) first(첫 번째만) all(모두) join(연결) 
 const lit=mode==='first'?[0]:[0,1,2,3,4,5],joined=mode==='join',fk=mode==='first'?2.3:1.5;
 let g='',lines='';const pts=[];
 for(let k=0;k<6;k++){const a=-Math.PI/2+k*Math.PI/3;pts.push([200+Math.cos(a)*128,200+Math.sin(a)*128]);}
 if(joined)for(let k=0;k<6;k++){const a=pts[k],b=pts[(k+2)%6];lines+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" class="scEmLn" style="--d:${.4+k*.15}s"/>`;}
 else lines=`<polygon points="${[0,2,4].map(k=>pts[k].join(',')).join(' ')}" class="scEmTri"/><polygon points="${[1,3,5].map(k=>pts[k].join(',')).join(' ')}" class="scEmTri"/>`;
 for(let k=0;k<6;k++){const [x,y]=pts[k],on=lit.indexOf(k)>=0,d=mode==='first'?.5:(mode==='seq'?.3+k*.55:.3+k*.12);
  g+=`<g class="scEmSt${on?' on':''}" style="--d:${d}s;--gc:${SC_STAR_GLOW[k]}">`+
   `<polygon points="${scStarPts(x,y,30,13)}" class="dim"/>`+
   (on?`<circle cx="${x}" cy="${y}" r="46" fill="${SC_STAR_GLOW[k]}" class="halo"/><polygon points="${scStarPts(x,y,30,13)}" fill="${SC_STAR_COL[k]}" class="lit"/>`+
   `<g transform="translate(${x} ${y-16}) scale(${fk})"><g class="flameNone"><path d="M0 0C-17 -8 -15 -30 -3 -52C-1 -36 14 -30 13 -12C12 -2 6 2 0 0z" fill="${SC_STAR_GLOW[k]}" opacity=".85"/><path d="M0 0C-9 -5 -8 -20 -1 -34C2 -22 9 -18 8 -8C7 -2 3 1 0 0z" fill="#fff" opacity=".85"/></g></g><g transform="translate(${x-14*fk/1.5} ${y-10}) scale(${fk*.6})"><g class="flame f2"><path d="M0 0C-17 -8 -15 -30 -3 -52C-1 -36 14 -30 13 -12C12 -2 6 2 0 0z" fill="${SC_STAR_GLOW[k]}" opacity=".7"/></g></g><g transform="translate(${x+14*fk/1.5} ${y-10}) scale(${fk*.6})"><g class="flame f3"><path d="M0 0C-17 -8 -15 -30 -3 -52C-1 -36 14 -30 13 -12C12 -2 6 2 0 0z" fill="${SC_STAR_GLOW[k]}" opacity=".7"/></g></g>`:'')+`</g>`;}
 return `<div class="scv-emblem em-${mode}"><svg viewBox="0 0 400 400" role="img" aria-label="여섯 개의 별 문양"><defs><linearGradient id="scEmRb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff6b6b"/><stop offset=".25" stop-color="#ffd24a"/><stop offset=".5" stop-color="#5df08c"/><stop offset=".75" stop-color="#5aa8ff"/><stop offset="1" stop-color="#c77dff"/></linearGradient><radialGradient id="scEmBg"><stop offset="0" stop-color="#2a3a8a" stop-opacity=".85"/><stop offset="1" stop-color="#0a1030" stop-opacity=".9"/></radialGradient><filter id="scEmBl"><feGaussianBlur stdDeviation="9"/></filter></defs>
 <circle cx="200" cy="200" r="190" fill="url(#scEmBg)" stroke="#c9d3ff" stroke-width="3" opacity=".95"/><circle cx="200" cy="200" r="172" fill="none" stroke="#8fa0ff" stroke-width="1.5" stroke-dasharray="3 9" class="scEmSpin"/><circle cx="200" cy="200" r="64" fill="none" stroke="#8fa0ff" stroke-width="1.5" opacity=".6"/><circle cx="200" cy="200" r="128" fill="none" stroke="#6f7fe0" stroke-width="1.2" opacity=".5"/>${lines}${g}</svg></div>`;}
function scEmblemMode(t){t=String(t||'');if(/하나씩 점등/.test(t)||/떠올라 공중에 모인다/.test(t))return 'seq';if(/하나의 거대한 별 문양으로 연결/.test(t))return 'join';if(/첫 번째 별이/.test(t))return 'first';if(/별 문양/.test(t))return 'all';return '';}
// 장면 한 장면의 화면 조립
function scStageHTML(u,pos,pg,grant){
 let pre='';const k=pg.k;
