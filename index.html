 const cards=SC_UNITS.map((un,u)=>{const done=!!p.done[u],open=u<=p.unlocked,act=u===cur&&!done,inprog=!done&&(p.pos[u]||0)>0;
  const st=done?'완료':open?(act?(inprog?'진행 중':'진행 가능'):'열림'):'잠김';
  return `<button class="sc-stage ${done?'done':''} ${act?'next':''}" data-u="${u}" ${open?'':'disabled'}><div class="sc-stage-art"><span class="sc-stage-number">${u===0?'PROLOGUE':u===7?'EPILOGUE':'CHAPTER '+String(u).padStart(2,'0')}</span><span class="sc-stage-status">${st}</span><img class="scv-thumb" src="${scBgSVG(scUnitBgKey(u),'')}" alt=""></div><div class="sc-stage-info"><b>${un.icon} ${esc(un.name)}</b><span>${esc(u>=1&&u<=6?SC_REGIONS[u-1].short:un.sub)}</span><small>${done?'✓ 이야기 완료 · 다시 보기':open?(inprog?'▶ 이어하기 가능':'▶ 시작할 수 있어요'):'🔒 앞 이야기를 먼저 마쳐요'}</small></div></button>`;}).join('');
 $('#view').innerHTML=`<div class="sc-page scv"><div class="scv-bar"><button class="btn ghost sm" id="scHubBack">트레이너 방</button><h2>별의 종언과 여섯 개의 맹세</h2><button class="btn ${S.meta.settings.bgm?'blue':'ghost'} sm" id="scMusic">${S.meta.settings.bgm?'♪ ON':'♪ OFF'}</button></div>
 <div class="scv-card scv-mapintro"><div class="scv-mapintro-top"><div><span class="sc-tag">✦ 시나리오 모드</span><h3>${esc(SC_UNITS[cur].icon)} ${esc(SC_UNITS[cur].name)}</h3><p class="sc-note">${cur>=1&&cur<=6?esc(SC_REGIONS[cur-1].theme):esc(SC_UNITS[cur].sub)}</p></div><button class="btn gold big" id="scCta">${ctaTxt}</button></div>
 <div class="sc-progress" style="margin:10px 0 8px"><i style="width:${prog}%"></i></div>
 <div class="sc-reward-list" style="margin-top:6px"><div class="sc-reward"><strong>${doneN}/${SC_UNITS.length}</strong>이야기</div><div class="sc-reward"><strong>${p.vows.length}/6</strong>여섯 개의 맹세</div><div class="sc-reward"><strong>${own}/33</strong>시나리오 보유 카드</div><div class="sc-reward"><strong>${p.ianWin?'승리':'-'}</strong>이안과의 배틀</div></div>
 <div class="mbtns"><button class="btn blue" id="scMapDeck">🃏 시나리오 덱 편성</button><button class="btn purple" id="scMapDex">📘 천공의 도감</button></div>
 <p class="sc-note" style="margin-top:8px">시나리오에서는 <b>처음 받은 스타팅 포켓몬 3장</b>(나무지기·아차모·물짱이)으로 시작해요. 각 지역에서 일반 포켓몬 4마리와 보스를 쓰러뜨릴 때마다 시나리오 전용 보유 카드가 늘어나고, 지역을 마치면 덱을 다시 짤 수 있어요. 전투 중 수학 문제는 평소 좌삼몬과 같은 학년·학기 범위에서 나와요.</p></div>
 <div class="sc-map-grid">${cards}</div>
 <div class="nextFeat">진행 상황은 자동 저장돼요. 이야기 도중에 지도로 나가도 그 장면부터 이어서 볼 수 있어요. <button class="btn ghost sm" id="scReset" style="margin-left:6px">시나리오 처음부터 다시 시작</button></div></div>`;
 $('#scHubBack').onclick=()=>{sfx('tap');scBackToHub();};
 $('#scMusic').onclick=()=>{sfx('tap');S.meta.settings.bgm=!S.meta.settings.bgm;autoSave();startBgm();scRenderMap();};
 $('#scCta').onclick=()=>{sfx('tap');if(doneN===SC_UNITS.length)scEnterUnit(0,true);else scEnterUnit(cur,false);};
 $('#scMapDeck').onclick=()=>{sfx('tap');scRenderDeck(()=>scRenderMap());};
 $('#scMapDex').onclick=()=>{sfx('tap');scRenderDex();};
 $('#scReset').onclick=async()=>{if(await confirmBox('시나리오 진행 기록(보유 카드·덱·진행 위치)을 모두 지우고 처음부터 시작할까요? 일반 게임 기록은 그대로 남아요.','처음부터','취소')){S.meta.scenario=scFresh(scState());autoSave();toast('시나리오를 처음 상태로 되돌렸어요');scRenderMap();}};
 $('#view').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{const u=+b.dataset.u;if(u>scState().unlocked)return;sfx('tap');const pp=scState();
  if(!pp.done[u]&&(pp.pos[u]||0)>0){M(`<h2>${esc(SC_UNITS[u].name)}</h2><p style="line-height:1.7">저장된 장면이 있어요. 어디서부터 볼까요?</p><div class="mbtns"><button class="btn gold big" data-a="c">이어서 보기</button><button class="btn ghost" data-a="s">처음부터</button></div>`,{c:()=>{closeM();scEnterUnit(u,false);},s:()=>{closeM();scEnterUnit(u,true);},_close:()=>closeM()});}
  else scEnterUnit(u,true);});
}
function scRenderDex(){
 const p=scState();S.screen='scenarioDex';SC.index=SC.index>=0?SC.index:0;SC.bgKey=undefined;SC.bgVar='';scApplyBackdrop(SC.index);
 const slot=(id,boss)=>{const on=!!p.col[id];return `<div class="scv-slot ${on?'on':''} ${boss?'boss':''}" data-id="${id}"><div>${monImg(id,'front')}</div><span>${on?esc(scMonName(id)):'???'}</span><small>${boss?'보스':'일반'}</small></div>`;};
 const regs=SC_REGIONS.map((reg,r)=>{const ids=scRegionIds(r),vow=p.vows.indexOf(r+1)>=0;return `<div class="scv-card scv-dexreg" style="--ac:${reg.accent}"><div class="row" style="align-items:center"><b class="scv-dexname">${reg.icon} ${esc(reg.name)}</b><span class="hudSp"></span><span class="sc-tag">${ids.filter(id=>p.col[id]).length}/5</span></div><div class="scv-slots">${ids.map((id,i)=>slot(id,i===4)).join('')}</div><div class="scv-dexvow ${vow?'on':''}">${vow?`「${ORD[r]} 번째 맹세: ${esc(scVowText(r+1))}」`:`${ORD[r]} 번째 맹세는 아직 새겨지지 않았어요`}</div></div></div>`;}).join('');
 $('#view').innerHTML=`<div class="sc-page scv"><div class="scv-bar"><button class="btn ghost sm" id="scDexBack">← 지도</button><h2>천공의 도감</h2><span class="sc-tag">${scOwned().length} / 33장</span></div><div class="scv-card"><b class="scv-dexname">✦ 처음 함께한 동료</b><div class="scv-slots three">${[252,255,258].map(id=>slot(id,false)).join('')}</div><p class="sc-note">여섯 개의 빈 페이지에는 지역에서 만난 포켓몬의 기록과 함께 깨달은 맹세가 하나씩 새겨져요.</p></div>${regs}</div>`;
 $('#scDexBack').onclick=()=>{sfx('tap');scRenderMap();};
 $('#view').querySelectorAll('.scv-slot.on[data-id]').forEach(s=>s.onclick=()=>{sfx('tap');const id=+s.dataset.id;M(`<div style="text-align:center"><div style="display:flex;justify-content:center"><div style="width:190px">${cardHTML(id,{size:'lg'})}</div></div><p class="mut" style="font-size:13px;margin-top:8px">${esc(scMonName(id))}${SC_ALIAS_SHOW[id]?` (게임 카드 이름: ${esc(MON[id].name)})`:''}</p><div class="mbtns"><button class="btn gold" data-a="x">닫기</button></div></div>`,{x:()=>closeM(),_close:()=>closeM()});});
}
function scRenderDeck(back){
 if(back)SC.deckBack=back;const p=scState();S.screen='scenarioDeck';scEnsureDeck(!!back);scMusicStart(SC.index);SC.bgKey=undefined;SC.bgVar='camp';scApplyBackdrop(SC.index,false,undefined,'camp');
 const counts={};p.deck.forEach(id=>counts[id]=(counts[id]||0)+1);
 const curve=[1,2,3,4,5,6].map(c=>p.deck.filter(id=>MON[id].cost===c).length),owned=scOwned().sort((a,b)=>MON[a].cost-MON[b].cost||a-b);
 $('#view').innerHTML=`<div class="sc-page scv"><div class="scv-bar"><button class="btn gold sm" id="scDeckDone">✔ 편성 완료</button><h2>시나리오 덱 편성</h2><span class="sc-tag">${p.deck.length} / ${DECK_N}</span></div><div class="scv-card"><div class="row" style="align-items:center"><h3 style="margin:0">${I('cards')} 내 시나리오 덱</h3><span class="hudSp"></span><button class="btn blue sm" id="scDAuto">자동으로 짜기</button></div><p class="sc-note" style="margin:6px 0">덱 카드를 누르면 빠지고, 아래 카드를 누르면 들어가요. 시나리오 덱은 <b>시나리오에서 기록한 포켓몬</b>만 쓸 수 있어요. 같은 카드는 많이 모은 일반 카드는 최대 3~4장, 희귀 카드는 적게 넣을 수 있어요. 비용이 낮은 카드가 많아야 처음부터 싸울 수 있어요.</p><div class="row" style="align-items:flex-end;gap:16px;margin-bottom:18px"><div><div class="mut" style="font-size:12px">비용별 장수</div><div class="curve">${curve.map((n,i)=>`<div style="height:${n*8+2}px"><span>${i+1}</span></div>`).join('')}</div></div></div><div class="deckBar" id="scDeckBar">${p.deck.map((id,i)=>cardHTML(id,{size:'deck'}).replace('class="card','data-di="'+i+'" class="card')).join('')}</div><h3>시나리오 보유 카드 (${owned.length}종)</h3><div class="colGrid" id="scColGrid">${owned.map(id=>{const inD=counts[id]||0,lim=scLim(id);return `<div class="scv-own">${cardHTML(id,{size:'deck',cls:inD>=lim?'locked':''})}<small>${inD}/${lim}</small></div>`;}).join('')}</div></div></div>`;
 $('#scDeckDone').onclick=()=>{sfx('tap');if(p.deck.length<DECK_N){scEnsureDeck();toast('덱이 '+DECK_N+'장이 아니라서 빈 자리는 자동으로 채웠어요');}autoSave();const b=SC.deckBack||scRenderMap;b();};
 $('#scDAuto').onclick=()=>{sfx('tap');p.deck=scAutoDeck();autoSave();scRenderDeck();};
 $('#scDeckBar').querySelectorAll('.card').forEach(c=>c.onclick=()=>{sfx('tap');p.deck.splice(+c.dataset.di,1);autoSave();const y=$('#view').scrollTop;scRenderDeck();$('#view').scrollTop=y;});
 $('#scColGrid').querySelectorAll('.card').forEach(c=>c.onclick=()=>{const id=+c.dataset.id,inD=p.deck.filter(x=>x===id).length;if(p.deck.length>=DECK_N){toast('덱이 꽉 찼어요. 위에서 한 장을 빼 주세요');return;}if(inD>=scLim(id)){toast(`${scMonName(id)}은(는) 최대 ${scLim(id)}장까지 넣을 수 있어요`);return;}sfx('tap');p.deck.push(id);autoSave();const y=$('#view').scrollTop;scRenderDeck();$('#view').scrollTop=y;});
}
function scRenderEnding(){
 const p=scState(),m=S.meta;S.screen='scenarioEpilogue';SC.index=5;SC.bgKey='dawn';SC.bgVar='';scMusicStart(0);scApplyBackdrop(0,false,'dawn','');
 const ji=385;
 $('#view').innerHTML=`<div class="sc-page scv"><div class="scv-bar"><button class="btn ghost sm" id="scEndMap">지도</button><h2>별의 종언과 여섯 개의 맹세 · 완주</h2></div><div class="scv-stage"><div class="scv-card" style="text-align:center"><span class="sc-tag">THE END · 그리고 새로운 모험으로</span><h3 style="margin-top:10px;font-size:26px">세계는 다시 움직이기 시작했다</h3><div style="display:flex;justify-content:center;margin:12px 0"><div style="width:120px">${cardHTML(ji)}</div></div><p class="sc-line" style="text-align:left">${scE('주인공과 이안, 그리고 함께한 포켓몬들이 여섯 개의 맹세를 지켜 냈다. 천공의 도감의 마지막 페이지 너머에는 아직 기록되지 않은 새로운 대륙이 기다리고 있다.')}</p><div class="sc-reward-list"><div class="sc-reward"><strong>${p.vows.length}/6</strong>여섯 개의 맹세</div><div class="sc-reward"><strong>${scOwned().length}장</strong>시나리오 보유 카드</div><div class="sc-reward"><strong>${p.ianWin?'승리':'도전'}</strong>이안과의 배틀</div><div class="sc-reward"><strong>${m.packs}</strong>남은 카드팩</div></div><div class="mbtns"><button class="btn gold big" id="scEndDex">📘 천공의 도감 보기</button><button class="btn blue" id="scEndAgain">이야기 다시 보기</button><button class="btn ghost" id="scEndHome">트레이너 방으로</button></div></div></div></div>`;
 $('#scEndMap').onclick=()=>scRenderMap();$('#scEndDex').onclick=()=>scRenderDex();$('#scEndAgain').onclick=()=>scEnterUnit(0,true);$('#scEndHome').onclick=()=>scBackToHub();
}
// 메인 타이틀과 트레이너 방 양쪽에 시나리오 버튼을 추가합니다.
const __scRenderTitleOriginal=renderTitle;
renderTitle=function(){scStopMusic();__scRenderTitleOriginal();const menu=$('.menuCol');if(menu&&!$('#tScenario')){const b=document.createElement('button');b.id='tScenario';b.className='btn purple big';b.textContent='✦ 시나리오 모드';menu.insertBefore(b,$('#tSave'));b.onclick=()=>{sfx('tap');ac();scLaunch();};}startBgm();};
const __scRenderHubOriginal=renderHub;
renderHub=function(){__scRenderHubOriginal.apply(this,arguments);const grid=$('#view .tiles');if(grid&&!$('#scHubTile')){const b=document.createElement('button');b.id='scHubTile';b.className='tile main';b.style.background='linear-gradient(120deg,#edf0ff,#f4e7ff)';b.style.borderColor='#c7c4ff';b.style.boxShadow='0 5px 0 #c7c4ff';b.innerHTML='<span class="ti" style="font-size:48px;display:flex;align-items:center;justify-content:center">🌌</span><span><span class=tn>시나리오 모드</span><br><span class=td>별의 종언과 여섯 개의 맹세 · 이야기 · 포켓몬 해방 · 전용 덱</span></span>';grid.insertBefore(b,grid.firstChild);b.onclick=()=>{sfx('tap');ac();scLaunch();};}startBgm();};
const __scStartBgmOriginal=startBgm;
startBgm=function(mode){if(scIsScreen()){if(!S.meta.settings.bgm){scMusicStart(SC.index>=0?SC.index:0);return;}scSetWorldMusic();return;}scStopMusic();__scStartBgmOriginal(mode);};
Object.assign(BGMAP,{scenarioMap:'town',scenarioStory:'town',scenarioDeck:'town',scenarioDex:'town',scenarioBattle:'town',scenarioEpilogue:'town'});

init();
if(S.screen==='title')renderTitle();
</script><div style="position: fixed; left: 0px; top: 0px; width: 100%; height: 100%; pointer-events: none; visibility: hidden; z-index: -5;"></div>


</body></html>
