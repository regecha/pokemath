<!DOCTYPE html>
<!-- saved from url=(0039)https://lo4lolo.github.io/pokemon-math/ -->
<html lang="ko" style="--vt: 0px; --vh: 948px;"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="robots" content="noindex,nofollow,noarchive,noimageindex">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>포켓몬 수학</title>
<link rel="preconnect" href="https://fonts.googleapis.com/">
<link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
<link href="./포켓몬 수학_files/css2" rel="stylesheet">
<style>
:root{
 --ink:#3a2e3f;--mut:#8a7d8f;--line:#eadfce;--paper:#fffaf1;--paper2:#fff3df;--sky1:#bfe6ff;--sky2:#e9f7ff;
 --red:#ff5a5f;--red2:#d9393f;--gold:#ffc93c;--gold2:#e0a400;--green:#3cc47c;--blue:#4d9cff;--purple:#9a6bff;
 --vt:0px;--vh:100vh;--sb:0px;
 --r1:#a7b0bd;--r2:#3cc47c;--r3:#4d9cff;--r4:#b46bff;--r5:#ffb321;
}
html.safe{--sb:30px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overscroll-behavior:none;height:100%;overflow:hidden;color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#d9f0ff}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
.hidden{display:none!important}
.jua,h1,h2,h3,h4{font-family:'Jua',sans-serif;font-weight:400}
.mut{color:var(--mut)}
/* 배경 — 하늘·구름·언덕 (CSS만으로, 가벼움) */
#bg{position:fixed;inset:0;z-index:0;background:linear-gradient(180deg,#a9dcff 0%,#d9f0ff 55%,#eafbe9 56%,#c6f0b8 100%);overflow:hidden}
#bg i{position:absolute;border-radius:50%;background:#fff;opacity:.85}
#bg .hill{position:absolute;bottom:-30vh;width:90vw;height:70vh;border-radius:50%;background:#a5e39a}
#bg .hill.b{left:-20vw;background:#b7eaa9}#bg .hill.c{right:-30vw;background:#9adb8d;bottom:-38vh}
#bg .ballDeco{position:absolute;right:6vw;top:10vh;width:120px;height:120px;border-radius:50%;opacity:.13;background:linear-gradient(#ff5a5f 0 46%,#3a2e3f 46% 54%,#fff 54%)}
html.dim #bg{filter:saturate(.7) brightness(.92)}
#bgImg{position:fixed;inset:0;z-index:1;background-size:cover;background-position:center bottom;image-rendering:pixelated;opacity:0;transition:opacity .4s}
#bgImg.on{opacity:1}
img.ic.px{image-rendering:pixelated;object-fit:contain}
#battle.art{background-size:cover;background-position:center;image-rendering:pixelated}
/* 화면 */
#view{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);z-index:2;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-bottom:calc(20px + var(--sb))}
.wrap{width:min(980px,100%);margin:0 auto;padding:14px 14px 30px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--paper);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 rgba(150,120,90,.18),0 12px 30px rgba(60,80,120,.12);padding:16px}
.btn{font-family:'Jua',sans-serif;font-size:17px;color:#fff;background:#7a86a8;border-radius:14px;padding:10px 16px;box-shadow:0 4px 0 rgba(0,0,0,.18);transition:transform .08s,filter .15s;white-space:nowrap;line-height:1.2;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.btn:disabled{opacity:.4;pointer-events:none;filter:grayscale(.6)}
.btn.red{background:var(--red)}.btn.gold{background:var(--gold);color:#5a3b00}.btn.green{background:var(--green)}.btn.blue{background:var(--blue)}.btn.purple{background:var(--purple)}
.btn.ghost{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.big{font-size:22px;padding:14px 22px;border-radius:18px}.btn.sm{font-size:14px;padding:7px 11px;border-radius:11px}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>.btn{flex:1}
.ic{display:inline-block;width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
.inp{background:#fff;border:3px solid var(--line);border-radius:14px;padding:11px 14px;font-size:18px;outline:none;width:100%}
.inp:focus{border-color:var(--gold)}
textarea.inp.code{font-family:monospace;font-size:12px;height:76px;margin-top:8px;resize:vertical;word-break:break-all}
h2{font-size:26px;margin-bottom:8px}h3{font-size:19px;margin:12px 0 6px}
/* 머리띠(HUD) */
.hud{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:rgba(255,250,241,.92);border-bottom:3px solid var(--line);backdrop-filter:blur(4px)}
.pill{background:#fff;border:2px solid var(--line);padding:4px 10px;border-radius:999px;font-family:'Jua';font-size:16px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.hudSp{flex:1}
.lvBox{display:flex;align-items:center;gap:8px;min-width:150px}
.lvNum{font-family:'Black Han Sans';font-size:20px;color:var(--red2)}
.xpBar{flex:1;height:12px;background:#f1e6d6;border-radius:9px;overflow:hidden;min-width:70px}
.xpBar i{display:block;height:100%;background:linear-gradient(90deg,#ffcf4a,#ff8a3d);border-radius:9px;transition:width .6s}
.gsTag{background:var(--red);color:#fff;font-family:'Jua';padding:4px 10px;border-radius:10px;font-size:15px}
/* 타이틀·관문 */
.title{min-height:calc(var(--vh) - 40px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:16px}
.logo{font-family:'Black Han Sans';font-size:clamp(44px,12vw,84px);line-height:1;color:#ffd23f;-webkit-text-stroke:3px #2f5aa8;paint-order:stroke fill;text-shadow:0 6px 0 #2f5aa8,0 10px 20px rgba(0,0,0,.2);letter-spacing:2px}
.logo small{display:block;font-family:'Jua';font-size:clamp(16px,4vw,22px);-webkit-text-stroke:0;color:#2f5aa8;text-shadow:none;letter-spacing:6px;margin-top:6px}
.peek{display:flex;gap:4px;justify-content:center;align-items:flex-end;height:100px}
.peek img{width:96px;height:96px;image-rendering:pixelated;animation:hop 2.4s ease-in-out infinite}
.peek img:nth-child(2){animation-delay:.3s;width:110px;height:110px}.peek img:nth-child(3){animation-delay:.6s}
@keyframes hop{0%,100%{transform:translateY(0)}45%{transform:translateY(-10px)}}
.menuCol{display:flex;flex-direction:column;gap:10px;width:min(360px,100%)}
.notice{font-size:12px;color:var(--mut);line-height:1.5;max-width:520px}
.codeIn{font-family:'Black Han Sans';font-size:28px;letter-spacing:4px;text-align:center;text-transform:uppercase}
/* 허브 타일 */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;background:#fff;border:3px solid var(--line);border-radius:20px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 5px 0 var(--line);transition:transform .12s;text-align:center;min-height:128px}
.tile:hover{transform:translateY(-3px)}.tile:active{transform:translateY(2px)}
.tile .ti{width:52px;height:52px}.tile .tn{font-family:'Jua';font-size:19px}.tile .td{font-size:12px;color:var(--mut);line-height:1.35}
.tile.main{grid-column:1/-1;flex-direction:row;justify-content:flex-start;gap:16px;padding:16px 18px;text-align:left;background:linear-gradient(120deg,#fff6d9,#ffe3ea);border-color:#ffc2cf;box-shadow:0 5px 0 #ffc2cf;min-height:0}
.tile.main .ti{width:72px;height:72px}.tile.main .tn{font-size:24px}
.tile.done{opacity:.85}
.newTag{position:absolute;top:-9px;right:-6px;background:#ff5a8a;color:#fff;font-style:normal;font-family:'Jua';font-size:12px;line-height:1;padding:4px 7px;border-radius:9px;box-shadow:0 2px 0 #c43a66;animation:unB 1s infinite}
@keyframes unB{50%{transform:translateY(-3px)}}
.badgeDot{position:absolute;top:8px;left:10px;background:var(--red);color:#fff;font-family:'Jua';font-size:13px;border-radius:999px;padding:1px 8px}
.nextFeat{font-size:13px;color:#5a4e60;text-align:center;background:rgba(255,250,241,.88);border-radius:12px;padding:4px 12px;align-self:center;max-width:100%}
/* 성장 */
.growGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.growGrid{grid-template-columns:1fr}}
.week{display:flex;align-items:flex-end;gap:6px;height:120px;padding:6px 2px 0}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;font-size:11px;color:var(--mut)}
.week .d b{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(#7fd3ff,#4d9cff);min-height:3px}
.week .d.today b{background:linear-gradient(#ffd56b,#ff8a3d)}
.week .d span{font-family:'Jua';font-size:13px;color:var(--ink)}
.cmp{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;text-align:center}
.cmp .me{background:#fff3c4;border-radius:14px;padding:8px}.cmp .yd{background:#eef3ff;border-radius:14px;padding:8px}
.cmp b{font-family:'Black Han Sans';font-size:26px;display:block}
.up{color:#1f9d55;font-weight:900}.dn{color:#d9393f;font-weight:900}
.skList{display:flex;flex-direction:column;gap:6px}
.skRow{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 10px;font-size:14px}
.skRow .sn{flex:1}.stars{color:#ffb321;letter-spacing:1px;font-size:15px;white-space:nowrap}.stars i{color:#e5dccd;font-style:normal}
.unitHead{font-family:'Jua';font-size:17px;margin:10px 0 4px;display:flex;align-items:center;gap:6px}
.uBadge{width:26px;height:26px}
/* 문제 */
.qWrap{width:min(720px,100%);margin:0 auto;padding:12px 14px 30px;display:flex;flex-direction:column;gap:12px}
.qTop{display:flex;align-items:center;gap:10px}
.prog{flex:1;position:relative;height:22px;background:#fff;border:3px solid var(--line);border-radius:14px;overflow:visible}
.prog .me{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ffd56b,#ff8a3d);border-radius:10px;transition:width .4s}
.prog .gh{position:absolute;top:-14px;width:30px;height:30px;margin-left:-15px;transition:left .5s linear;opacity:.75}
.prog .gh img{width:30px;height:30px;image-rendering:pixelated;filter:grayscale(1) brightness(1.2)}
.prog .gl{position:absolute;top:24px;font-size:10px;color:var(--mut);white-space:nowrap;transform:translateX(-50%)}
.qCard{background:#fff;border:3px solid var(--line);border-radius:24px;padding:18px 16px;text-align:center;box-shadow:0 6px 0 var(--line);position:relative}
.qSk{font-size:12px;color:var(--mut);margin-bottom:6px}
.qText{font-family:'Jua';font-size:clamp(24px,6vw,34px);line-height:1.35;word-break:keep-all}
.qText small{font-family:'Noto Sans KR';font-size:14px;color:var(--mut)}
.qPic{margin-top:10px;display:flex;justify-content:center;flex-wrap:wrap;gap:8px}
.mdl{width:100%;height:auto;display:block;margin:0 auto}
.mdl2{display:flex;flex-direction:column;gap:6px;align-items:center;width:100%}
.ptab{border-collapse:collapse;margin:6px auto;font-family:'Jua';font-size:20px}
.ptab th,.ptab td{border:2px solid #c9b48a;padding:4px 12px;background:#fff}.ptab th{background:#fff3df;font-size:14px}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choices.two{grid-template-columns:1fr 1fr}
.ch{font-family:'Jua';font-size:clamp(22px,5.5vw,30px);background:#fff;border:3px solid #d8e6ff;border-radius:18px;padding:14px 8px;box-shadow:0 5px 0 #d8e6ff;min-height:70px;display:flex;align-items:center;justify-content:center;transition:transform .08s}
.ch:active{transform:translateY(3px);box-shadow:0 2px 0 #d8e6ff}
.ch.ok{background:#dcffe9;border-color:#3cc47c;box-shadow:0 5px 0 #3cc47c}
.ch.no{background:#ffe1e3;border-color:#ff5a5f;box-shadow:0 5px 0 #ff5a5f;animation:shk .3s}
.ch.dim{opacity:.45}
.ch.wait{opacity:.55;filter:grayscale(.4);cursor:wait}
.thinkBar{position:relative;height:26px;background:#fff;border:2px solid var(--line);border-radius:12px;overflow:hidden;text-align:center;font-family:'Jua';font-size:14px;line-height:22px;color:#8a6a3c}
.thinkBar i{position:absolute;left:0;top:0;bottom:0;background:#ffe9a8;animation:thinkFill linear forwards;width:0}.thinkBar span{position:relative}
@keyframes thinkFill{to{width:100%}}
@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1;font-size:.82em;margin:0 2px}
.fr i{font-style:normal;padding:1px 3px}.fr i:first-child{border-bottom:2px solid currentColor}
.mx{white-space:nowrap}
.explain{background:#fff7e0;border:3px dashed #ffcf6b;border-radius:18px;padding:12px 14px;line-height:1.55;font-size:16px}
.explain b{color:#d9393f}
.explain .mdlBox{margin-top:8px}
.buddy{display:flex;align-items:flex-end;gap:6px;justify-content:center;margin:-4px 0 -6px;position:relative}.buddy .bimg{width:76px;height:76px;display:flex;align-items:flex-end;justify-content:center;position:relative;transform-origin:50% 100%}
.bimg.yay{animation:bYay .7s cubic-bezier(.3,1.6,.5,1)}.bimg.party{animation:bParty 1s ease}.bimg.hug{animation:bHug 1.1s ease}
@keyframes bYay{30%{transform:translateY(-22px) scale(1.08)}60%{transform:translateY(0) scale(1.1,.9)}100%{transform:none}}
@keyframes bParty{20%{transform:translateY(-18px) rotate(-12deg)}40%{transform:translateY(0) rotate(0)}60%{transform:translateY(-18px) rotate(12deg)}80%{transform:translateY(0)}}
@keyframes bHug{20%{transform:rotate(-8deg) scale(1.04)}40%{transform:rotate(8deg) scale(1.04)}60%{transform:rotate(-5deg)}80%{transform:scale(1.06,.94)}100%{transform:none}}
.bfx{position:absolute;width:22px;height:22px;pointer-events:none;animation:bFx 1.1s ease-out forwards;z-index:5}.bfx .ic{width:22px;height:22px}
@keyframes bFx{0%{opacity:0;transform:translate(0,0) scale(.4)}20%{opacity:1;transform:translate(calc(var(--dx)*.3),-14px) scale(1.1)}100%{opacity:0;transform:translate(var(--dx),-58px) scale(.9)}}.buddy .bimg img{max-width:100%;max-height:100%;image-rendering:pixelated;transform:scale(1.3);transform-origin:50% 100%}
.bubble{position:relative;background:#fff;border:3px solid var(--line);border-radius:14px;padding:5px 12px;font-family:'Jua';font-size:16px;margin-bottom:22px;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:'';position:absolute;left:-10px;bottom:8px;border:7px solid transparent;border-right-color:var(--line)}
.bubble.pop{animation:popIn .3s}
.stonePanel{background:rgba(255,250,241,.82);padding:10px 14px}
.stoneHead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.stoneHead b{font-size:20px}.motto{font-family:'Jua';color:#8a6a3c;background:#fff3c4;border-radius:10px;padding:2px 10px;font-size:15px}
.stoneBox{display:flex;justify-content:center;cursor:pointer}.stoneSvg{width:min(100%,420px);height:auto;max-height:240px;overflow:visible}
.stoneTop{width:68px;height:64px;display:flex;align-items:flex-end;justify-content:center}.stoneTop img{max-width:100%;max-height:100%;image-rendering:pixelated;transform:scale(1.2);transform-origin:50% 100%}
.sdrop{animation:sDrop .55s cubic-bezier(.3,1.5,.5,1) both}@keyframes sDrop{from{transform:translateY(-60px);opacity:0}}
.stoneLeg{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:12px;color:#5a4e60}.stoneLeg i{display:inline-block;width:12px;height:9px;border-radius:3px;border:1.5px solid #5a4a3a;margin-right:3px;vertical-align:-1px}
#pxGrid i{display:block;border:1px solid rgba(0,0,0,.05);cursor:crosshair}
/* 포켓몬 숨쉬기: 아래를 기준으로 살짝 커졌다 작아졌다(2.6초, 모든 기기에서 같은 빠르기) */
img.idle{animation:idleBreath 2.6s ease-in-out infinite;animation-delay:var(--d,0s);transform-origin:50% 100%}
@keyframes idleBreath{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-3%) scale(1.02,.98)}}
.unit .sp img.idle{animation-name:idleBreathU}@keyframes idleBreathU{0%,100%{transform:scale(1.38)}50%{transform:scale(1.38,1.33) translateY(-2%)}}
.buddy .bimg img.idle{animation-name:idleBreathB}@keyframes idleBreathB{0%,100%{transform:scale(1.3)}50%{transform:scale(1.3,1.25) translateY(-3%)}}
html.lowfx img.idle{animation:none}
/* ===== 배틀: 상성 표시 · 카드 정보 · 타격감 ===== */
.tbadge{position:absolute;left:50%;top:-14px;transform:translateX(-50%);z-index:6;display:flex;gap:3px;white-space:nowrap;pointer-events:none}
.tbadge b{font-family:'Jua';font-weight:400;font-size:13px;line-height:1;padding:4px 7px;border-radius:9px;border:2px solid #1d2b5a;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tbadge .adv{background:#3cc47c;color:#fff}.tbadge .dis{background:#a7b0bd;color:#fff}.tbadge .dmgp{background:#fff;color:#d9393f}.tbadge .ko{background:#ffd23f;color:#1d2b5a}
.unit .tdots{display:flex;gap:2px;justify-content:center;margin-top:1px}.unit .tdots i{width:9px;height:9px;border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
#bInfo{position:fixed;left:0;right:0;bottom:0;z-index:45;display:none;padding:0 8px calc(8px + var(--sb))}
#bInfo.on{display:block;animation:sheetUp .2s ease-out}
#bInfo .sheet{width:min(640px,100%);margin:0 auto;background:#fffdf6;border:3px solid var(--line);border-radius:22px;padding:10px;box-shadow:0 -6px 30px rgba(0,0,0,.25);display:flex;gap:12px;align-items:flex-start;max-height:calc(var(--vh) * .62);overflow-y:auto}
#bInfo .card{width:150px;flex:none}
#bInfo .itx{flex:1;min-width:0;font-size:14px;line-height:1.5}
#bInfo .itx h3{margin:0 0 4px;font-size:20px}
#bInfo .kwbox{background:#eef6ff;border:2px solid #9fc3ff;border-radius:12px;padding:6px 8px;margin:6px 0}
#bInfo .mrow{display:flex;flex-wrap:wrap;gap:4px;margin:3px 0}
#bInfo .mrow .tchip{font-size:12px;line-height:18px;padding:0 6px}
#bInfo .vs{display:flex;align-items:center;gap:6px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:3px 8px;margin:3px 0;font-family:'Jua'}
#bInfo .vs img{width:30px;height:30px;image-rendering:pixelated}
@media(max-width:520px){#bInfo .card{width:112px}#bInfo .itx{font-size:13px}}
.hitflash{position:absolute;inset:0;border-radius:14px;background:#fff;pointer-events:none;animation:hitFlash .28s ease-out forwards;z-index:7}
@keyframes hitFlash{0%{opacity:.9}100%{opacity:0}}
.pcl{position:fixed;width:9px;height:9px;z-index:165;pointer-events:none;border-radius:2px;animation:pcl .55s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes pcl{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
.hring{position:fixed;z-index:164;pointer-events:none;border:5px solid #fff;border-radius:50%;width:20px;height:20px;margin:-10px 0 0 -10px;animation:hring .38s ease-out forwards}
@keyframes hring{to{transform:scale(6);opacity:0;border-width:1px}}
/* ===== 스킬 이펙트 (공격 타입별 기술 연출) ===== */
.skx{position:fixed;z-index:162;pointer-events:none;will-change:transform,opacity}
.sk-orb{border-radius:50%}
.sk-leaf{border-radius:0 80% 0 80%}
.sk-shard{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.sk-star{clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.sk-spike{clip-path:polygon(50% 0,58% 38%,100% 50%,58% 62%,50% 100%,42% 62%,0 50%,42% 38%)}
.sk-rock{clip-path:polygon(20% 0,80% 8%,100% 55%,70% 100%,15% 90%,0 40%)}
.sk-ring{border-radius:50%;background:none!important;border:8px solid #fff}
.sk-moon{border-radius:50%;background:none!important;border:10px solid transparent;border-top-color:#fff}
.sk-bar{border-radius:6px}
.sk-glow{border-radius:50%;filter:blur(2px)}

/* 포켓몬 카드 */
.card{--tc:#a7b0bd;--tc2:#e9edf2;position:relative;width:150px;aspect-ratio:63/88;border-radius:12px;background:linear-gradient(160deg,var(--tc) 0%,var(--tc2) 100%);padding:6px;box-shadow:0 4px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.12);display:flex;flex-direction:column;font-family:'Jua';color:#2b2340;flex:none;overflow:hidden;transform-style:preserve-3d}

.card .cName{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .cost{width:22px;height:22px;border-radius:50%;background:#3d7bff;color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Black Han Sans';font-size:14px;box-shadow:0 2px 0 #1f4fbf;flex:none}

.card .types{display:flex;gap:3px;justify-content:center;margin-bottom:2px}
.tchip{font-size:10px;font-family:'Noto Sans KR';font-weight:900;color:#fff;border-radius:6px;padding:0 5px;line-height:15px;text-shadow:0 1px 0 rgba(0,0,0,.25)}
.card .kw{font-size:10.5px;font-family:'Noto Sans KR';font-weight:700;background:rgba(255,255,255,.75);border-radius:6px;padding:2px 4px;line-height:1.25;min-height:28px;text-align:center}
.card .stats{display:flex;justify-content:space-between;align-items:center;margin-top:3px;padding:0 1px}
.st{display:inline-flex;align-items:center;justify-content:center;min-width:28px;height:26px;border-radius:8px;font-family:'Black Han Sans';font-size:17px;color:#fff;padding:0 5px;gap:1px}
.st.atk{background:#ff8a3d;box-shadow:0 2px 0 #c9601b}.st.hp{background:#ff5a7a;box-shadow:0 2px 0 #c43a56}
.card .rar{font-size:11px;letter-spacing:-1px;color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.4)}
.card.r4,.card.r5{box-shadow:0 0 0 3px #fff,0 0 16px 3px rgba(190,120,255,.55),0 6px 14px rgba(0,0,0,.15)}
.card.r5{box-shadow:0 0 0 3px #fff7c9,0 0 20px 5px rgba(255,190,40,.7),0 6px 14px rgba(0,0,0,.15)}
.card .holo{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(115deg,transparent 25%,rgba(120,240,255,.45) 40%,rgba(255,140,250,.45) 50%,rgba(255,240,120,.4) 60%,transparent 75%);background-size:260% 260%;background-position:var(--mx,30%) var(--my,30%);mix-blend-mode:screen;opacity:.55;animation:holoMove 4s ease-in-out infinite}

.card.lg{width:min(300px,78vw);padding:10px;border-radius:18px}.card.lg .cTop{font-size:20px;min-height:30px}.card.lg .cost{width:32px;height:32px;font-size:20px}.card.lg .kw{font-size:14px;min-height:44px;padding:5px}.card.lg .st{min-width:44px;height:36px;font-size:24px}.card.lg .tchip{font-size:13px;line-height:19px;padding:0 8px}.card.lg .rar{font-size:16px}

/* 배틀 전용 특수 카드: 랜덤 볼과 돌 아이템 */

.stoneOrb{width:48px;height:54px;display:flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,88% 18%,100% 62%,70% 100%,25% 94%,0 52%,18% 15%);border:0;color:#fff;font-size:25px;text-shadow:0 2px 3px #30284588;filter:drop-shadow(0 3px 2px #30284566)}

.stoneOrb.moon{background:linear-gradient(135deg,#fff5ff,#bba0ff 48%,#5940ad)}

.endWildImg{display:flex;align-items:center;justify-content:center;overflow:hidden}.endWildImg img{width:100%;height:100%;object-fit:contain;image-rendering:auto}.endWildParty{display:grid;grid-template-columns:repeat(auto-fit,minmax(98px,1fr));gap:7px}.endWildAlly{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px;text-align:center;min-width:0}.endWildAlly.down{opacity:.45;filter:grayscale(.8)}.endWildHp{height:8px;background:#f0e6da;border-radius:99px;overflow:hidden;margin:4px 0}.endWildHp i{display:block;height:100%;background:linear-gradient(90deg,#3cc47c,#8be08b);transition:width .25s}.endWildHp i.low{background:linear-gradient(90deg,#ff5a5f,#ffb321)}
.wildTop{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.9);border:3px solid #ffcc77;border-radius:16px;padding:5px 8px;position:relative}.wildRoster{display:flex;align-items:center;gap:8px;flex-wrap:wrap;width:100%}.wildEntry{flex:1 1 220px;min-width:0;display:flex;align-items:center;gap:7px;background:rgba(255,255,255,.86);border-radius:12px;padding:4px 6px}.wildEntry .av{width:38px;height:38px;flex:none;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:50%}.wildTop .wtInfo{flex:1;min-width:70px}.wildTop .wtName{font-family:Jua;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wildTop .wtHp{font-family:"Black Han Sans";font-size:16px;color:#e8434f;white-space:nowrap}.wildTop .endWildHp{width:100%;margin:2px 0}.wildTop .btn{flex:none}.wildLane{gap:clamp(8px,2vw,24px);padding-left:4px;padding-right:4px}.wildLane .slot{width:min(35.2vw,300px);min-width:100px;aspect-ratio:1/1.25;border:0;background:transparent;max-height:100%;overflow:visible}.wildLane .unit{overflow:visible}.wildLane .unit .sp img{max-width:72%;max-height:72%;transform:scale(1.38)}@media(max-width:560px){.wildTop{gap:4px;padding:4px}.wildEntry{flex-basis:190px;gap:5px;padding:3px}.wildTop .wtName{font-size:13px}.wildTop .wtHp{font-size:13px}.wildTop .btn{font-size:12px;padding:5px 7px}}
.shieldBadge{display:inline-flex;align-items:center;gap:1px;background:#d8f2ff;border:1px solid #5aabec;border-radius:7px;padding:0 3px;font:700 10px 'Noto Sans KR';color:#155a9a;line-height:16px}

.shardCard .art img{filter:brightness(.15) saturate(0);opacity:.55}.shardMask{position:absolute;inset:0;background:conic-gradient(rgba(154,107,255,.55) calc(var(--p)*360deg),transparent 0);mix-blend-mode:multiply;border-radius:6px}

/* 도감 */
.dexGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}

/* 팩 */
#pack{position:fixed;inset:0;z-index:150;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;background:radial-gradient(circle at 50% 45%,rgba(110,130,200,.96),rgba(28,28,60,.97) 72%);top:var(--vt);height:var(--vh)}

.pkBag{width:180px;height:240px;border-radius:20px;background:linear-gradient(160deg,#ff6b6b,#ff9f43 50%,#ffd23f);box-shadow:0 10px 0 #b7473a,0 20px 40px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;position:relative;cursor:pointer;animation:bagIdle 1.6s ease-in-out infinite}
.pkBag::before{content:'';position:absolute;inset:14px;border:4px dashed rgba(255,255,255,.6);border-radius:14px}
.pkBag .bl{width:90px;height:90px;border-radius:50%;background:linear-gradient(#ff5a5f 0 45%,#3a2e3f 45% 55%,#fff 55%);border:5px solid #3a2e3f;position:relative}

.pkRow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:860px;padding:0 10px}

/* 축하 효과: 방사형 빛줄기(일장기를 떠올리게 하는 무늬)는 쓰지 않고, 부드러운 금빛과 반짝이는 별만 */
.rays{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,rgba(255,236,160,.45),rgba(255,236,160,0) 55%)}
.rays::before,.rays::after{content:'';position:absolute;inset:0;background-image:radial-gradient(circle,#fff 0 2px,transparent 3px),radial-gradient(circle,#ffe680 0 3px,transparent 4px),radial-gradient(circle,#c6e4ff 0 2px,transparent 3px);background-size:140px 160px,210px 190px,170px 230px;background-position:20px 30px,90px 110px,50px 170px;animation:twinkle 1.6s ease-in-out infinite alternate}

@keyframes dmgUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}15%{opacity:1;transform:translate(-50%,-60%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
.shake{animation:bShake .25s}
@keyframes bShake{25%{transform:translate(4px,-3px)}50%{transform:translate(-4px,2px)}75%{transform:translate(2px,3px)}}
#bq{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;padding:0 10px calc(10px + var(--sb))}
#bq.on{display:block;animation:sheetUp .25s ease-out}
@keyframes sheetUp{from{transform:translateY(60%);opacity:0}}
#bq .sheet{width:min(640px,100%);margin:0 auto;background:var(--paper);border:3px solid var(--line);border-radius:22px 22px 18px 18px;padding:12px;box-shadow:0 -6px 30px rgba(0,0,0,.2);max-height:calc(var(--vh) * .72);overflow-y:auto}
/* 방어 문제는 공격 문제와 구분되도록 푸른 색 계열로 표시 */
#bq .sheet.defense{background:#edf6ff;border-color:#8fc5ff;box-shadow:0 -6px 30px rgba(47,98,181,.22)}
#bq .sheet.defense .qCard{background:#dceeff;border-color:#74b6f4;box-shadow:0 6px 0 #a8d4ff}
#bq .sheet.defense .bqHead .who{background:#dceeff}
#bq .qText{font-size:clamp(22px,5.4vw,30px)}
#bq .ch{min-height:58px;font-size:clamp(20px,5vw,26px);padding:10px 6px}
.bqHead{display:flex;align-items:center;gap:8px;font-family:'Jua';font-size:15px;margin-bottom:6px}
.bqHead .who{display:flex;align-items:center;gap:4px;background:#fff;border-radius:10px;padding:2px 8px}
.bqHead img{width:28px;height:28px;image-rendering:pixelated}
/* 리그 */
.gyms{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.gym{background:#fff;border:3px solid var(--line);border-radius:20px;padding:12px;display:flex;gap:10px;align-items:center;cursor:pointer;box-shadow:0 5px 0 var(--line);position:relative}
.gym .gi{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}
.gym .gi img{width:60px;height:60px;image-rendering:pixelated}
.gym .gn{font-family:'Jua';font-size:18px}.gym .gd{font-size:12px;color:var(--mut);line-height:1.35}
.gym.lock{opacity:.5;filter:grayscale(.8);cursor:default}
.gym.won::after{content:'';position:absolute;right:10px;top:10px;width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0 30%,#ffc93c 31% 100%);box-shadow:0 0 0 3px #e0a400}
/* 덱 */
.deckBar{display:flex;gap:6px;flex-wrap:wrap;min-height:70px;background:#fff;border:3px dashed var(--line);border-radius:16px;padding:8px}
.deckBar .card{cursor:pointer}
.colGrid{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.colGrid .card{cursor:pointer}
.curve{display:flex;gap:4px;align-items:flex-end;height:44px}
.curve div{width:18px;background:#4d9cff;border-radius:4px 4px 0 0;position:relative}
.curve div span{position:absolute;bottom:-16px;left:0;right:0;text-align:center;font-size:11px}
/* 창·토스트·배너 */
.modal{position:fixed;left:0;right:0;top:var(--vt);height:var(--vh);z-index:100;display:none;align-items:center;justify-content:center;padding:14px 12px calc(14px + var(--sb));background:rgba(40,40,70,.45);overscroll-behavior:contain}
.modal.on{display:flex}
#modal2{z-index:110}
.mbox{width:min(560px,100%);max-height:100%;overflow-y:auto;overscroll-behavior:contain;animation:popIn .22s cubic-bezier(.3,1.5,.5,1)}
.mbox.wide{width:min(820px,100%)}
@keyframes popIn{from{transform:scale(.9);opacity:0}}
.mbtns{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
#toast{position:fixed;left:50%;top:calc(var(--vt) + 12px);transform:translateX(-50%);z-index:300;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none;width:min(520px,94vw)}
.tst{background:#3a2e3f;color:#fff;padding:9px 16px;border-radius:14px;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:popIn .25s;text-align:center}
#banner{position:fixed;left:50%;top:calc(var(--vt) + var(--vh) * .38);transform:translate(-50%,-50%) scale(.6);z-index:250;pointer-events:none;opacity:0;text-align:center;white-space:nowrap}
#banner.on{animation:bnr 2.2s ease forwards}
#banner .b1{font-family:'Black Han Sans';font-size:clamp(34px,9vw,60px);color:#ffd23f;-webkit-text-stroke:3px #2f5aa8;paint-order:stroke fill;text-shadow:0 5px 0 #2f5aa8}
#banner .b2{font-family:'Jua';font-size:20px;color:#2f5aa8;background:#fff;border-radius:12px;padding:4px 14px;display:inline-block;margin-top:6px}
@keyframes bnr{0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}12%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}20%{transform:translate(-50%,-50%) scale(1)}85%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%) scale(1)}}
.confetti{position:fixed;width:10px;height:14px;z-index:260;pointer-events:none;animation:cf 1.6s ease-out forwards;border-radius:2px}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rr));opacity:0}}
/* 코치 안내 */
#coach{position:fixed;inset:0;z-index:200;display:none;touch-action:none}#coach.on{display:block}
#coHole{position:fixed;border-radius:16px;box-shadow:0 0 0 220vmax rgba(30,30,56,.72);transition:left .35s,top .35s,width .35s,height .35s;pointer-events:none}
#coHole:not(.none)::after{content:'';position:absolute;inset:-4px;border:3px solid #ffe27a;border-radius:inherit;animation:coP 1.1s ease-in-out infinite}
@keyframes coP{50%{transform:scale(1.04);opacity:.6}}
#coBub{position:fixed;left:50%;width:min(440px,92vw);background:#fffaf1;border:3px solid #ffd166;border-radius:18px;padding:12px 14px;box-shadow:0 6px 0 #e0a83a,0 16px 40px rgba(0,0,0,.35)}
#coBub.pop{animation:popIn .3s cubic-bezier(.3,1.6,.5,1)}
.coHead{display:flex;align-items:center;gap:6px;font-family:'Jua';font-size:19px}.coHead .coN{margin-left:auto;font-size:13px;color:var(--mut)}
.coHead img,.coHead svg{width:34px;height:34px;image-rendering:pixelated}
.coT{font-size:16px;line-height:1.55;margin:6px 0 10px}
.coBtns{display:flex;justify-content:space-between;align-items:center}
/* 기능 열림 연출 */
#unlock{position:fixed;inset:0;z-index:190;display:none;align-items:center;justify-content:center;background:rgba(30,30,56,.7);flex-direction:column;gap:14px;text-align:center;color:#fff}
#unlock.on{display:flex}
#unlock .uIc{width:120px;height:120px;animation:unPop .7s cubic-bezier(.3,1.7,.5,1)}
@keyframes unPop{from{transform:scale(.2) rotate(-30deg);opacity:0}}
#unlock h2{font-size:34px;text-shadow:0 3px 0 rgba(0,0,0,.4)}
#unlock p{font-size:16px;max-width:400px;line-height:1.5}
/* 교사 */
.tcode{font-family:'Black Han Sans';font-size:34px;letter-spacing:3px;color:#2f5aa8;background:#fff;border:3px dashed #9fb7ea;border-radius:14px;padding:8px 14px;display:inline-block;user-select:all;-webkit-user-select:all}
table.rep{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.rep th,table.rep td{border:1px solid var(--line);padding:5px 6px;text-align:center}table.rep th{background:#fff3df}
.saveStatus{background:#eafbe9;border:2px solid #9be0a2;border-radius:12px;padding:8px 10px;font-size:14px;line-height:1.5}
.saveStatus.bad{background:#fff0f0;border-color:#ffb3b3}
.slot2{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:12px;padding:8px;margin-bottom:6px}
.slot2 .sl1{flex:1;font-size:14px}.slot2 .sl2{display:flex;gap:6px}
.setRow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{font-family:'Jua';font-size:14px;background:#fff;border:2px solid var(--line);border-radius:10px;padding:5px 10px}
.seg button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
/* 낮은 화면 */
html.short .tile{min-height:104px;padding:10px 8px}.html.short .tile .ti{width:42px;height:42px}
html.short .hand{min-height:100px}
html.short .card.sm{width:84px}
html.safe .hand{padding-left:72px}
html.safe .bBot{padding-left:72px}
@media(max-width:560px){.bTop,.bBot{flex-wrap:wrap;gap:5px;padding:4px 8px}.mana i{width:11px;height:11px;border-width:1.5px}.mana b{font-size:13px}.hero .av{width:36px;height:36px}.hero .av img{width:32px;height:32px}.hero{padding:2px 8px 2px 2px;gap:5px}.hero .hhp{font-size:18px}.hero .hn{font-size:13px}#bPower{font-size:12px;padding:6px 8px}.bTop .pill,.bBot .pill{font-size:13px;padding:2px 7px}.mid{min-height:28px}.mid .msg{font-size:14px}}
@media(max-width:520px){.card.sm{width:76px}.hand{gap:4px}.slot{width:clamp(56px,18.2vw,104px)}.unit .un{font-size:10.5px;padding:0 4px}.unit .st{min-width:20px;height:19px;font-size:12.5px;padding:0 3px}.unit .kwI .ic{width:14px;height:14px}.unit .tdots i{width:7px;height:7px}.tbadge b{font-size:11px;padding:3px 5px}.tiles{grid-template-columns:repeat(2,1fr)}.tile.main{flex-direction:column;text-align:center}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>

function mkRng(seed){let a=seed|0;return function(){a=(a+0x6D2B79F5)|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

function hasJong(w){const ch=w.charCodeAt(w.length-1);if(ch>=0xAC00&&ch<=0xD7A3)return(ch-0xAC00)%28>0;if(/[0-9]$/.test(w))return '013678'.includes(w.slice(-1));return false;}
function josa(w,p){const j=hasJong(w);switch(p){case '이가':return w+(j?'이':'가');case '은는':return w+(j?'은':'는');case '을를':return w+(j?'을':'를');case '아야':return w+(j?'아':'야');case '와과':return w+(j?'과':'와');case '이로':{const c=w.charCodeAt(w.length-1);const rieul=(c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28===8)||/[178]$/.test(w);return w+(j&&!rieul?'으로':'로');}}return w;}

function ensureMusicBus(c){if(!AU.musicGain){AU.musicGain=c.createGain();AU.musicGain.gain.value=0;AU.musicGain.connect(c.destination);}return AU.musicGain;}
function musicNote(freq,dur,type='triangle',vol=.08){const c=AU.ctx;if(!c||!AU.musicGain)return;const t=c.currentTime+.012,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol),t+.025);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(AU.musicGain);o.start(t);o.stop(t+dur+.035);o.onended=()=>{try{o.disconnect();g.disconnect();}catch(e){}};}
function midiHz(n){return 440*Math.pow(2,(n-69)/12);}
function startBgm(mode){
 if(window.__sim)return;
 if(!S.meta.settings.bgm){if(AU.musicTimer){clearInterval(AU.musicTimer);AU.musicTimer=null;}AU.musicMode='';return;}

function stopBgm(){if(AU.musicTimer){clearInterval(AU.musicTimer);AU.musicTimer=null;}AU.musicMode='';if(AU.ctx&&AU.musicGain){const c=AU.ctx;AU.musicGain.gain.cancelScheduledValues(c.currentTime);AU.musicGain.gain.setTargetAtTime(.0001,c.currentTime,.06);}}
function tone(f,d=.1,type='sine',v=.1,delay=0,f2=0){const c=ac();if(!c)return;const t=c.currentTime+delay;const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.01);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(c.destination);o.start(t);o.stop(t+d+.03);}
function noise(d=.08,v=.1,freq=1200,delay=0){const c=ac();if(!c)return;const t=c.currentTime+delay;const len=Math.floor(c.sampleRate*d);const buf=c.createBuffer(1,len,c.sampleRate);const ch=buf.getChannelData(0);for(let i=0;i<len;i++)ch[i]=(Math.random()*2-1)*(1-i/len);const s=c.createBufferSource();s.buffer=buf;const f=c.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;const g=c.createGain();g.gain.value=v;s.connect(f).connect(g).connect(c.destination);s.start(t);}

let CO=null;

 else{const below=r.top+r.height+pad+12,above=vh-(r.top-pad-12);const preferBelow=r.top+r.height/2<vh*.5;

function ub64u(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const b=atob(t);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}

(function(){let sx=0,sy=0;window.__edge={top:true,bot:true};
 const canScroll=(el,dx,dy)=>{for(;el&&el!==document.documentElement;el=el.parentElement){if(!(el instanceof Element))continue;const cs=getComputedStyle(el);
  if(Math.abs(dy)>=Math.abs(dx)){if(/(auto|scroll)/.test(cs.overflowY)&&el.scrollHeight>el.clientHeight+1){if(dy>0&&el.scrollTop>0)return true;if(dy<0&&el.scrollTop+el.clientHeight<el.scrollHeight-1)return true;}}
  else if(/(auto|scroll)/.test(cs.overflowX)&&el.scrollWidth>el.clientWidth+1)return true;}return false;};
 addEventListener('touchstart',e=>{if(e.touches.length===1){sx=e.touches[0].clientX;sy=e.touches[0].clientY;}},{passive:true});
 addEventListener('touchmove',e=>{if(e.touches.length!==1)return;const t=e.touches[0];const dx=t.clientX-sx,dy=t.clientY-sy;const tg=e.target;if(tg&&(tg.tagName==='TEXTAREA'||tg.tagName==='INPUT'))return;
  if(canScroll(tg,dx,dy))return;const E=window.__edge;if(Math.abs(dy)>Math.abs(dx)&&((dy>0&&!E.top)||(dy<0&&!E.bot)))return;if(e.cancelable)e.preventDefault();},{passive:false});})();

const FIT={top:0,h:0,z:1};
function uiZoom(h,w){const st=S.meta.settings.zoom||'auto';if(st!=='auto')return +st||1;let z=1;if(h<560)z=Math.max(.62,h/560);if(w/z<340)z=Math.max(.55,w/340);return Math.round(z*100)/100;}
function applyFit(top,h){const de=document.documentElement,ds=de.style;const z=uiZoom(h,innerWidth);ds.zoom=z===1?'':String(z);FIT.z=z;
 ds.setProperty('--vt',top/z+'px');ds.setProperty('--vh',h/z+'px');de.classList.toggle('short',h/z<680);}
const fitMode=()=>S.meta.settings.fit||'auto';
function refit(){applyFit(fitMode()==='off'?0:FIT.top,fitMode()==='off'||!FIT.h?innerHeight:Math.min(FIT.h,innerHeight));}
function initFit(){applyFit(0,innerHeight);addEventListener('resize',()=>applyFit(FIT.top,FIT.h>0?Math.min(FIT.h,innerHeight):innerHeight));
 if(!('IntersectionObserver' in window))return;const el=document.createElement('div');el.style.cssText='position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;visibility:hidden;z-index:-5';document.body.appendChild(el);
 const th=[];for(let i=0;i<=200;i++)th.push(i/200);
 new IntersectionObserver(es=>{const e=es[es.length-1],r=e.intersectionRect,H=innerHeight;let top=0,h=H;
  const bh=e.boundingClientRect.height,k=bh>0&&Math.abs(bh/H-1)>.03?bh/H:1;const rt=r.top/k,rh=r.height/k;
  if(fitMode()!=='off'&&e.isIntersecting&&rh>=260&&rt>=-1&&rt+rh<=H+2&&rh<H-6){top=Math.max(0,Math.round(rt));h=Math.round(rh);}
  window.__edge={top:!e.isIntersecting||r.top<=1,bot:!e.isIntersecting||r.top+r.height>=H-1};if(top===FIT.top&&h===FIT.h)return;FIT.top=top;FIT.h=h;applyFit(top,h);},{threshold:th}).observe(el);}

// ---- 원리 모델 그림 (SVG) : 같은 전체는 늘 같은 크기로 그려요(오개념 방지) ----
const MODEL={
 dots(n,col='#ff8a3d'){ // 10칸 틀(5×2)에 점. 10개 넘으면 틀을 여러 개
  const frames=Math.max(1,Math.ceil(n/10));let s='';const W=5*22+8;
  for(let f=0;f<frames;f++){const ox=f*(W+10);s+=`<rect x="${ox}" y="0" width="${W}" height="52" rx="6" fill="#fff" stroke="#c9b48a" stroke-width="2"/>`;
   for(let i=0;i<10;i++){const x=ox+4+(i%5)*22,y=4+Math.floor(i/5)*22;s+=`<rect x="${x}" y="${y}" width="22" height="22" fill="none" stroke="#e7d8b5"/>`;if(f*10+i<n)s+=`<circle cx="${x+11}" cy="${y+11}" r="8" fill="${col}"/>`;}}
  return `<svg viewBox="-2 -2 ${frames*(W+10)} 56" class="mdl" style="max-width:${Math.min(100,frames*45)}%">${s}</svg>`;},
 blocks(h,t,o){ // 수 모형: 백(판) 십(막대) 일(낱개)
  let s='',x=0;const u=7;
  for(let i=0;i<h;i++){s+=`<rect x="${x}" y="0" width="${u*5}" height="${u*5}" fill="#7fb4ff" stroke="#2f62b5"/>`;for(let k=1;k<5;k++)s+=`<line x1="${x+k*u}" y1="0" x2="${x+k*u}" y2="${u*5}" stroke="#2f62b5" stroke-width=".5"/><line x1="${x}" y1="${k*u}" x2="${x+u*5}" y2="${k*u}" stroke="#2f62b5" stroke-width=".5"/>`;x+=u*5+6;}
  for(let i=0;i<t;i++){s+=`<rect x="${x}" y="0" width="${u}" height="${u*5}" fill="#8be08b" stroke="#2f8a3a"/>`;x+=u+4;}
  for(let i=0;i<o;i++){s+=`<rect x="${x}" y="${u*4}" width="${u}" height="${u}" fill="#ffd36b" stroke="#b07d00"/>`;x+=u+3;}
  return `<svg viewBox="-2 -2 ${x+4} ${u*5+4}" class="mdl" style="max-width:${Math.min(100,x/2.4)}%">${s}</svg>`;},
 groups(g,each,col='#ff6f91'){ // 묶음(곱셈·나눗셈): g묶음, 묶음마다 each개
  let s='';const cw=Math.ceil(Math.sqrt(each)),bw=cw*14+10;
  for(let i=0;i<g;i++){const ox=i*(bw+8);s+=`<rect x="${ox}" y="0" width="${bw}" height="${Math.ceil(each/cw)*14+10}" rx="9" fill="#fff6e9" stroke="#e0b884" stroke-width="2"/>`;
   for(let k=0;k<each;k++)s+=`<circle cx="${ox+12+(k%cw)*14}" cy="${12+Math.floor(k/cw)*14}" r="5.5" fill="${col}"/>`;}
  const H=Math.ceil(each/cw)*14+10;return `<svg viewBox="-2 -2 ${g*(bw+8)} ${H+4}" class="mdl" style="max-width:${Math.min(100,g*(bw+8)/2.6)}%">${s}</svg>`;},
 bar(n,d,label=true,col='#ff9f43'){ // 분수 띠: 전체 길이는 언제나 같아요
  const W=300;let s=`<rect x="0" y="0" width="${W}" height="34" fill="#fff" stroke="#6b5a3c" stroke-width="2"/>`;
  const whole=Math.max(1,Math.ceil(n/d));
  if(n>d){ // 1보다 큰 분수: 같은 크기의 띠를 여러 개
   let o='';for(let w=0;w<whole;w++){const y=w*42;o+=`<rect x="0" y="${y}" width="${W}" height="34" fill="#fff" stroke="#6b5a3c" stroke-width="2"/>`;for(let i=0;i<d;i++){const k=w*d+i;o+=`<rect x="${i*W/d}" y="${y}" width="${W/d}" height="34" fill="${k<n?col:'#fff'}" stroke="#6b5a3c"/>`;}}
   return `<svg viewBox="-2 -2 ${W+4} ${whole*42}" class="mdl" style="max-width:300px">${o}</svg>`;}
  for(let i=0;i<d;i++)s+=`<rect x="${i*W/d}" y="0" width="${W/d}" height="34" fill="${i<n?col:'#fff'}" stroke="#6b5a3c"/>`;
  return `<svg viewBox="-2 -2 ${W+4} 40" class="mdl" style="max-width:300px">${s}</svg>`;},
 bars2(a,b,c,d){ // 두 분수를 같은 전체 길이로 위아래 비교
  return `<div class="mdl2">${MODEL.bar(a,b,true,'#ff9f43')}${MODEL.bar(c,d,true,'#4dabf7')}</div>`;},
 line(min,max,step,mark,labels){ // 수직선
  const W=300,n=Math.round((max-min)/step);let s=`<line x1="0" y1="20" x2="${W}" y2="20" stroke="#4a3b2a" stroke-width="2"/>`;
  for(let i=0;i<=n;i++){const x=i*W/n;const big=labels&&labels(i);s+=`<line x1="${x}" y1="${big?10:14}" x2="${x}" y2="${big?30:26}" stroke="#4a3b2a" stroke-width="${big?2:1}"/>`;if(big)s+=`<text x="${x}" y="46" font-size="12" text-anchor="middle" fill="#4a3b2a">${big}</text>`;}
  if(mark!=null){const x=(mark-min)/(max-min)*W;s+=`<path d="M${x} 18 l-7 -14 h14z" fill="#ff4d6d"/>`;}
  return `<svg viewBox="-12 0 ${W+24} 52" class="mdl" style="max-width:320px">${s}</svg>`;},
 clock(h,m){
  let s=`<circle cx="50" cy="50" r="46" fill="#fff" stroke="#4a3b2a" stroke-width="4"/>`;
  for(let i=1;i<=12;i++){const a=i/12*Math.PI*2;s+=`<text x="${50+Math.sin(a)*36}" y="${54+-Math.cos(a)*36}" font-size="11" text-anchor="middle" fill="#4a3b2a" font-weight="700">${i}</text>`;}
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,r1=i%5?43:41;s+=`<line x1="${50+Math.sin(a)*r1}" y1="${50-Math.cos(a)*r1}" x2="${50+Math.sin(a)*45}" y2="${50-Math.cos(a)*45}" stroke="#4a3b2a" stroke-width="${i%5?.6:1.4}"/>`;}
  const ha=((h%12)+m/60)/12*Math.PI*2,ma=m/60*Math.PI*2;
  s+=`<line x1="50" y1="50" x2="${50+Math.sin(ha)*22}" y2="${50-Math.cos(ha)*22}" stroke="#2b2340" stroke-width="5" stroke-linecap="round"/>`;
  s+=`<line x1="50" y1="50" x2="${50+Math.sin(ma)*34}" y2="${50-Math.cos(ma)*34}" stroke="#e8434f" stroke-width="3" stroke-linecap="round"/><circle cx="50" cy="50" r="3.5" fill="#2b2340"/>`;
  return `<svg viewBox="0 0 100 100" class="mdl" style="max-width:150px">${s}</svg>`;},
 angleTri(a,b){ // 밑변 고정, 두 각으로 꼭짓점 계산(그림이 각의 크기와 맞게)
  const A=a*Math.PI/180,B=b*Math.PI/180,base=170,L=base*Math.sin(B)/Math.sin(A+B);const px=L*Math.cos(A),py=L*Math.sin(A);
  const k=Math.min(1,130/py,240/(Math.max(base,px)-Math.min(0,px)));const W=base*k,X=px*k,H=py*k;const mnx=Math.min(0,X),mxx=Math.max(W,X);const ox=20-mnx,oy=H+16;
  const lab=(x,y,t,c)=>`<text x="${x}" y="${y}" font-size="14" fill="${c}" font-weight="900" text-anchor="middle">${t}</text>`;
  return `<svg viewBox="0 0 ${mxx-mnx+40} ${H+30}" class="mdl" style="max-width:240px"><path d="M${ox} ${oy} L${ox+W} ${oy} L${ox+X} ${oy-H} Z" fill="#fff4d6" stroke="#4a3b2a" stroke-width="3" stroke-linejoin="round"/>${lab(ox+30*Math.cos(A/2),oy-30*Math.sin(A/2)+5,a+'°','#2b2340')}${lab(ox+W-30*Math.cos(B/2),oy-30*Math.sin(B/2)+5,b+'°','#2b2340')}${(()=>{const cx=(ox+ox+W+ox+X)/3,cy=(oy+oy+oy-H)/3,dx=cx-(ox+X),dy=cy-(oy-H),dl=Math.hypot(dx,dy)||1,r=Math.min(24,dl*.6);return lab(ox+X+dx/dl*r,oy-H+dy/dl*r+6,'?','#e8434f');})()}</svg>`;},
 place(digs,names){ // 자릿값 표
  return `<table class="ptab"><tr>${names.map(n=>`<th>${n}</th>`).join('')}</tr><tr>${digs.map(d=>`<td>${d}</td>`).join('')}</tr></table>`;}
};

// 수 뒤 조사: 끝자리 읽는 소리로(분수는 분자로 읽어요: 3/4 → 사분의 삼)
const J=(x,p)=>{const t=String(x);const m=t.match(/(\d+)\/\d+$/);const key=m?m[1]:(t.match(/\d+$/)||[t])[0];return t+josa(key,p).slice(key.length);};
const nf=n=>Number(n).toLocaleString('ko-KR');
function choicesNum(ans,cands,rng,fmtf=nf){ // 정답과 그럴듯한 오답(오개념 위주) 4개
 const A=Number(ans);const out=[];const seen=new Set([String(A)]);
 for(const c of cands){if(c==null||!isFinite(c)||c<0)continue;const k=String(c);if(seen.has(k))continue;seen.add(k);out.push(c);if(out.length>=3)break;}
 const near=[1,-1,10,-10,2,-2,5,-5,100,-100,3,-3];let i=0;
 while(out.length<3&&i<60){const c=A+near[i%near.length]*(1+Math.floor(i/near.length));i++;if(c<0||seen.has(String(c)))continue;seen.add(String(c));out.push(c);}
 return {a:fmtf(A),ch:[A,...out].map(fmtf)};}
const R_=rng=>({i:(a,b)=>a+Math.floor(rng()*(b-a+1)),p:arr=>arr[Math.floor(rng()*arr.length)],r:rng});

// ---- 1~4학년 생성기 (직접 만듦) ----
// sk: id, s 학기, u 단원 번호(1부터), n 이름, g(R) → {q, a, ch, m(모델 html), e(설명)}
const SK=[];
function sk(id,s,u,n,g){SK.push({id,s,u,n,g});}
// 1-1
sk('1a','1-1',1,'9까지의 수 세기',R=>{const n=R.i(1,9);const c=choicesNum(n,[n+1,n-1,n+2],R.r);return{q:'점은 모두 몇 개일까요?',pic:MODEL.dots(n),...c,m:MODEL.dots(n),e:n>5?`한 줄에 5개씩이에요. 5와 ${n-5}를 합하면 ${n}개.`:`하나씩 짚으며 세면 ${n}개.`};});
sk('1b','1-1',1,'1 큰 수, 1 작은 수',R=>{const n=R.i(1,8),up=R.r()<.5;const a=up?n+1:n-1;if(a<0)return null;const c=choicesNum(a,[up?n-1:n+1,n],R.r);return{q:`${n}보다 1 ${up?'큰':'작은'} 수는?`,...c,m:MODEL.line(0,10,1,a,i=>String(i)),e:`수직선에서 1 ${up?'큰 수는 바로 오른쪽':'작은 수는 바로 왼쪽'}이에요. ${n} → ${a}`};});
sk('1c','1-1',3,'모으기와 가르기',R=>{const t=R.i(3,9),a=R.i(1,t-1),b=t-a;const c=choicesNum(b,[t+a,b+1,b-1],R.r);return{q:`${J(t,'은는')} ${J(a,'와과')} □로 가를 수 있어요. □는?`,...c,m:MODEL.dots(t),e:`${t}개 중 ${a}개를 덜어 내면 ${b}개가 남아요.`};});
sk('1d','1-1',3,'합이 9까지인 덧셈',R=>{const a=R.i(1,8),b=R.i(1,9-a);const c=choicesNum(a+b,[a+b+1,a+b-1,Math.abs(a-b)],R.r);return{q:`${a} + ${b} = ?`,...c,m:MODEL.dots(a)+MODEL.dots(b,'#4dabf7'),e:`${a}에서 ${b}만큼 이어 세면 ${a+b}.`};});
sk('1e','1-1',3,'9까지의 뺄셈',R=>{const a=R.i(2,9),b=R.i(1,a);const c=choicesNum(a-b,[a+b,a-b+1,a-b-1],R.r);return{q:`${a} − ${b} = ?`,...c,m:MODEL.dots(a),e:`${a}개에서 ${b}개를 빼면 ${a-b}개가 남아요.`};});
sk('1f','1-1',5,'50까지의 수(묶음과 낱개)',R=>{const t=R.i(1,4),o=R.i(0,9);const n=t*10+o;const c=choicesNum(n,[o?o*10+t:t,t+o,n+10],R.r);return{q:o?`10개씩 묶음 ${t}개와 낱개 ${o}개는?`:`10개씩 묶음 ${t}개는?`,...c,m:MODEL.blocks(0,t,o),e:o?`10개씩 묶음 ${t}개 → ${t*10}, 낱개 ${o}개 → ${t*10}+${o}=${n}`:`10개씩 묶음 ${t}개 → ${n}`};});
// 1-2
sk('2a','1-2',1,'100까지의 수 크기 비교',R=>{let a=R.i(10,99),b=R.i(10,99);if(a===b)b=a<99?a+1:a-1;const big=Math.max(a,b);return{q:`더 큰 수는 어느 것일까요?`,a:String(big),ch:[String(a),String(b)],m:MODEL.blocks(0,Math.floor(a/10),a%10)+MODEL.blocks(0,Math.floor(b/10),b%10),e:`10개씩 묶음 수를 먼저 비교해요. 같으면 낱개를 비교해요. → ${big}`};});
sk('2b','1-2',2,'(몇십몇) ± (몇)',R=>{const t=R.i(1,9),o=R.i(0,8),plus=R.r()<.5;let n=t*10+o,k=plus?R.i(1,9-o):R.i(1,o||1);if(!plus&&o===0)return null;const a=plus?n+k:n-k;const c=choicesNum(a,[plus?n+k*10:n-k*10,a+1,a-1],R.r);return{q:`${n} ${plus?'+':'−'} ${k} = ?`,...c,m:MODEL.blocks(0,t,o),e:`낱개끼리 ${plus?'더해요':'빼요'}: ${o} ${plus?'+':'−'} ${k} = ${plus?o+k:o-k}. 10개씩 묶음 ${t}개는 그대로 → ${a}`};});
sk('2c','1-2',3,'시각 읽기(몇 시, 몇 시 30분)',R=>{const h=R.i(1,12),m=R.p([0,30]);const t=m?`${h}시 30분`:`${h}시`;const h2=h%12+1,h0=h===1?12:h-1;return{q:'시계가 나타내는 시각은?',pic:MODEL.clock(h,m),a:t,ch:m?[t,`${h2}시 30분`,`${h}시`,`${h2}시`]:[t,`${h}시 30분`,`${h2}시`,`${h0}시`],m:MODEL.clock(h,m),e:m?`긴바늘이 6을 가리키면 30분이에요. 짧은바늘은 ${J(h,'와과')} ${h2} 사이에 있으니 ${t}.`:`긴바늘이 12를 가리키면 "정각"이에요. 짧은바늘이 ${J(h,'을를')} 가리키니 ${t}.`};});
sk('2d','1-2',4,'10이 되는 더하기',R=>{const a=R.i(1,9);const c=choicesNum(10-a,[a,11-a,9-a],R.r);return{q:`${a} + □ = 10, □는?`,...c,m:MODEL.dots(a),e:`10칸 틀에서 빈칸이 ${10-a}개예요.`};});
sk('2e','1-2',4,'10을 만들어 세 수 더하기',R=>{const a=R.i(1,9),b=10-a,c2=R.i(1,9);const arr=R.p([[a,b,c2],[c2,a,b],[a,c2,b]]);const s=a+b+c2;const c=choicesNum(s,[s+1,s-1,s-10],R.r);return{q:`${arr[0]} + ${arr[1]} + ${arr[2]} = ?`,...c,m:MODEL.dots(10)+MODEL.dots(c2,'#4dabf7'),e:`더해서 10이 되는 두 수(${J(a,'와과')} ${b})를 먼저 더해요 → 10, 10+${c2}=${s}`};});
sk('2f','1-2',6,'받아올림 있는 (몇)+(몇)',R=>{const a=R.i(2,9),b=R.i(11-a,9);if(b<2)return null;const s=a+b;const c=choicesNum(s,[s-10,s+1,s-1],R.r);return{q:`${a} + ${b} = ?`,...c,m:MODEL.dots(s),e:`${a}에 ${10-a}를 더해 10을 만들고, 남은 ${b-(10-a)}를 더해요 → 10+${b-(10-a)}=${s}`};});
sk('2g','1-2',6,'받아내림 있는 (십몇)−(몇)',R=>{const a=R.i(11,18),b=R.i(a-9,9);if(b<=a-10)return null;const d=a-b;const c=choicesNum(d,[b-(a-10),d+1,d-1,d+10],R.r);return{q:`${a} − ${b} = ?`,...c,m:MODEL.dots(a),e:`${a}에서 먼저 ${J(a-10,'을를')} 빼서 10을 만들고, 남은 ${J(b-(a-10),'을를')} 더 빼요 → ${d}`};});

 if(!ok&&struggling(v)&&!m.found[q.sk]){const pre=preOf(q.sk).filter(p=>!solid(p));if(pre.length){m.found[q.sk]={d:today(),n:0};const ks=Object.keys(m.found);if(ks.length>3)delete m.found[ks[0]];
   S.foundMsg=`「${SKM[q.sk].n}」이(가) 어려웠군요. 바탕이 되는 <b>${esc(semName(SKM[pre[0]].s))}</b> 내용부터 좌삼을 쌓아요!`;}}
 if(q.found&&m.found[q.found])m.found[q.found].n++;
 for(const F in m.found){const done=recentOf(m.sk[F]).slice(-3)==='111'||preOf(F).every(solid);if(done){delete m.found[F];m.stats.foundDone=(m.stats.foundDone||0)+1;m.coins+=50;S.foundMsg=`좌삼 완성! 「${esc(SKM[F].n)}」의 바탕을 단단히 쌓았어요. 코인 +50`;}}}
function pickQ(opt={}){let pool=opt.pool,found=null;
 if(!pool){const fp=foundPool();if(fp.length&&rnd()<.35){pool=fp;found=1;}else pool=rnd()<.7?focusSkills():reviewSkills();}
 if(!pool.length)return null;
 for(let k=0;k<12;k++){const s=wpick(pool);const q=makeQ(s,rnd);if(!q)continue;if(RECENT.includes(q.key)&&k<10)continue;RECENT.push(q.key);if(RECENT.length>8)RECENT.shift();balanceAns(q);
  if(found){const m=S.meta;q.found=Object.keys(m.found).find(F=>preOf(F).includes(s.id))||null;}
  return q;}
 return null;}
const ANS_HIST=[];
function balanceAns(q){const n=q.ch.length;if(n<2)return;let i=q.ch.indexOf(q.a);const L=ANS_HIST.length;
 const same3=L>=2&&ANS_HIST[L-1]===i&&ANS_HIST[L-2]===i;const same1=L>=1&&ANS_HIST[L-1]===i;
 if(same3||(same1&&rnd()<.5)){let j;do{j=Math.floor(rnd()*n);}while(j===i);[q.ch[i],q.ch[j]]=[q.ch[j],q.ch[i]];i=j;}
 ANS_HIST.push(i);if(ANS_HIST.length>10)ANS_HIST.shift();}

// ---- 레벨 ----
const LV_TITLES=['새내기 트레이너','꼬마 트레이너','성실한 트레이너','숫자 탐험가','계산 레인저','개념 기사','수학 연구원','체육관 도전자','엘리트 트레이너','수학 챔피언','전설의 트레이너'];
const lvNeed=l=>80+l*40;
function lvOf(xp){let lv=1,x=xp;while(x>=lvNeed(lv)){x-=lvNeed(lv);lv++;}return{lv,cur:x,need:lvNeed(lv),title:LV_TITLES[Math.min(LV_TITLES.length-1,Math.floor((lv-1)/3))]};}
function gainXP(n){const b=lvOf(S.meta.xp).lv;S.meta.xp+=n;if(typeof gainSeasonXP==='function')gainSeasonXP(n);const a=lvOf(S.meta.xp).lv;if(a>b){S.lvUp=(S.lvUp||0)+(a-b);}}

// ---- 기록 ----
function dayRec(d=today()){const m=S.meta;return m.days[d]||(m.days[d]={n:0,c:0,ms:0,t:0,tt:0});}
function recordAnswer(q,ok,ms,opt={}){const m=S.meta,v=skState(q.sk),d=dayRec();
 if(!opt.retry){m.stats.q++;d.n++;v.c+=ok?1:0;v.x+=ok?0:1;}
 d.tt=(d.tt||0)+Math.min(ms,90000);
 if(ok){m.stats.c+=opt.retry?0:1;if(!opt.retry){d.c++;d.ms+=Math.min(ms,60000);}v.run++;v.w=Math.max(0,v.w-1);
  if(v.run>=3&&v.st<5){v.run=0;v.st++;S.newStars=(S.newStars||[]);S.newStars.push(q.sk);
   if(semIdx(SKM[q.sk].s)<semIdx(m.gs)){m.coins+=15;m.candy+=5;m.stats.lowerStar=(m.stats.lowerStar||0)+1;S.foundMsg=`아래 학년 「${esc(SKM[q.sk].n)}」 별 획득! 기초 보상 코인 +15 · 사탕 +5`;}}
  m.stats.streak++;m.stats.bestCombo=Math.max(m.stats.bestCombo,m.stats.streak);}
 else{v.run=0;v.w=Math.min(3,v.w+1);m.stats.streak=0;if(q.mis&&q.mis[opt.choice]){m.misc=m.misc||{};const id=q.mis[opt.choice];m.misc[id]=(m.misc[id]||0)+1;}}
 v.last=today();v.r=(recentOf(v)+(ok?'1':'0')).slice(-10);
 const prevOk=m.hist[m.hist.length-1];if(ok&&opt.retry)m.stats.retryOk=(m.stats.retryOk||0)+1;if(ok&&!opt.retry&&prevOk===0)m.stats.bounce=(m.stats.bounce||0)+1;if(ok&&!opt.retry&&ms<4000&&v.st>=3)m.stats.fast=(m.stats.fast||0)+1; // 숙달한 개념을 빠르게 맞혔을 때만
 {const h=new Date().getHours();m.tod=m.tod||{m:0,a:0,e:0};m.tod[h<12?'m':h<18?'a':'e']++;}
 if(!opt.retry){m.hist.push(ok?1:0);if(m.hist.length>200)m.hist.shift();m.thist=m.thist||[];m.thist.push(Math.round(Math.min(ms,60000)/100)/10);if(m.thist.length>200)m.thist.shift();
  if(!m.first20&&m.hist.length>=20){m.first20=m.hist.slice(0,20);m.first20t=m.thist.slice(-20);}
  const se=m.season;if(se&&se.f20&&se.f20.length<20){se.f20.push(ok?1:0);se.f20t.push(m.thist[m.thist.length-1]);}}
 {const pid=partnerId();m.bond=m.bond||{};m.bond[pid]=(m.bond[pid]||0)+1;}
 foundUpdate(q,ok);
 if(opt.guess){m.stats.guessWrong=(m.stats.guessWrong||0)+1;}
 gainXP(ok?10:opt.guess?0:3); // 틀려도 노력 점수(단, 찍은 답은 빼요)
 const ks=Object.keys(m.days);if(ks.length>400)ks.sort().slice(0,ks.length-400).forEach(k=>delete m.days[k]);
 m.stats.bestStreak=Math.max(m.stats.bestStreak||0,streakDays());
 checkBadges();autoSave();}
function unitsWithSkills(){const map={};allowedSkills().forEach(s=>{const k=unitKey(s.s,s.u);(map[k]=map[k]||[]).push(s);});return map;}
function checkBadges(){const m=S.meta,map=unitsWithSkills();for(const k in map){if(m.badges[k])continue;if(map[k].every(s=>(m.sk[s.id]&&m.sk[s.id].st>=3))){m.badges[k]=today();m.packs+=1;gainXP(100);if(semIdx(k.split('|')[0])<semIdx(m.gs))m.coins+=100;S.newBadges=(S.newBadges||[]);S.newBadges.push(k);}}}
function streakDays(){const m=S.meta;let n=0;let d=new Date();if(!m.days[today(d)]){d.setDate(d.getDate()-1);}while(m.days[today(d)]&&m.days[today(d)].n>0){n++;d.setDate(d.getDate()-1);}return n;}

// ---- 배운 만큼 말하기: 평균·백분율·소수를 배웠는지에 따라 성장 이야기가 달라져요 ----
function learned(m=S.meta){const gi=semIdx(m.gs),u=m.uMax||99;const at=(s,uu)=>gi>semIdx(s)||(gi===semIdx(s)&&u>=uu);return{dec:at('3-1',6),avg:at('5-2',6),pct:at('6-1',4)};}
function secTxt(sec,m=S.meta){return learned(m).dec?(Math.round(sec*10)/10)+'초':'약 '+Math.max(1,Math.round(sec))+'초';}
const avgOf=a=>a&&a.length?a.reduce((s,x)=>s+x,0)/a.length:0;
const r2=v=>String(Math.round(v*100)/100);
function growthTalk(m=S.meta){const L=learned(m),h=m.hist||[];const out=[];
 if(h.length<20){out.push(`문제를 20개 풀면 <b>처음의 나</b>를 기록해 둘게요. (지금 ${h.length}개)`);return out;}
 const past=m.first20||h.slice(0,20),pc=past.reduce((s,x)=>s+x,0);
 if(h.length<40&&!m.first20t){out.push(`처음 20문제에서 <b>${pc}개</b>를 맞혔어요. 문제를 더 풀면 지금의 나와 비교해 줄게요!`);return out;}
 const rec=h.slice(-20),rc=rec.reduce((s,x)=>s+x,0);const diff=rc-pc;
 if(L.avg){
  out.push(`맞히면 1점, 틀리면 0점으로 생각해 볼까요? <b>처음 20문제의 평균</b>은 ${pc}÷20 = <b>${r2(pc/20)}점</b>, <b>최근 20문제의 평균</b>은 ${rc}÷20 = <b>${r2(rc/20)}점</b>이에요.`);
  out.push(diff>0?`평균이 <b>${r2(diff/20)}점</b> 올랐어요! (5학년 2학기에 배운 <b>평균</b> = 모두 더한 값 ÷ 개수)`:diff===0?'평균이 그대로예요. 꾸준히 해내고 있어요!':'요즘 평균이 조금 낮아졌어요. 더 어려운 문제에 도전하며 좌삼을 쌓는 중이에요!');
  if(L.pct)out.push(`백분율로 바꾸면 ${pc*5}% → <b>${rc*5}%</b>예요. (평균 × 100)`);}
 else{
  out.push(`처음에는 문제 20개 중 <b>${pc}개</b>를 맞혔는데, 요즘은 20개 중 <b>${rc}개</b>를 맞혀요!`);
  out.push(diff>0?`<b>${diff}개</b>나 더 맞히게 되었어요. 어제보다 오늘 더 강해졌어요!`:diff===0?'처음처럼 꾸준히 해내고 있어요!':'요즘 더 어려운 문제에 도전하고 있어요. 차근차근 좌삼을 쌓는 중이에요!');}
 const pt=avgOf(m.first20t),rt=avgOf((m.thist||[]).slice(-20));
 if(rc<19)return out; // 빠르기는 거의 다 맞힐 만큼 익숙해진 뒤에 의미가 있어요
 if(pt&&rt){if(L.avg)out.push(`한 문제에 걸린 시간의 <b>평균</b>은 ${r2(pt)}초 → <b>${r2(rt)}초</b>${rt<pt-.3?'로 빨라졌어요!':'예요.'}`);
  else out.push(`한 문제 푸는 데 처음에는 ${secTxt(pt,m)}, 요즘은 <b>${secTxt(rt,m)}</b> 걸려요${rt<pt-.5?'. 더 빨라졌어요!':'.'}`);}
 return out;}

// ---- 문제 화면 (훈련과 배틀이 같이 써요) ----
function qHTML(q,head=''){const two=q.ch.length===2;
 return `${head}<div class=qCard>${q.retry?'<span class=retryTag>다시 도전!</span>':q.found?`<span class=retryTag style="background:#8a6a3c">좌삼 쌓기 · 기초 다지기</span>`:''}<div class=qSk>${esc(semName(SKM[q.sk].s))} · ${esc(SKM[q.sk].n)}</div><div class=qText>${fmtMath(q.q)}</div>${q.pic?`<div class=qPic>${q.pic}</div>`:''}</div>
 <div class="choices${two?' two':''}">${q.ch.map((c,i)=>`<button class=ch data-i="${i}">${fmtMath(esc(c))}</button>`).join('')}</div><div class=qAfter></div>`;}
// ---- 찍기 방지: 문제를 읽을 시간보다 훨씬 빨리 고르고 자꾸 틀리면 '천천히 모드' ----
// 읽는 데 필요한 최소 시간(글자 수·그림에 따라). 이보다 빠르면 '너무 빠른 답'.
function thinkMs(q){return clamp(700+stripTags(q.q).length*35+(q.pic?1200:0),900,3500);}
const GQ=[];
function guessCheck(q,ms,ok,pos){const fast=ms<thinkMs(q)*.6;GQ.push({fast,ok,pos});if(GQ.length>6)GQ.shift();
 const last4=GQ.slice(-4),last6=GQ.slice(-6);
 const spam=last4.length===4&&last4.filter(x=>x.fast).length>=3&&last4.filter(x=>!x.ok).length>=2;
 const samePos=last6.length===6&&last6.every(x=>x.pos===last6[0].pos)&&last6.filter(x=>!x.ok).length>=3;
 if((spam||samePos)&&!S.careful){S.careful=6;GQ.length=0;S.meta.stats.guessAlert=(S.meta.stats.guessAlert||0)+1;S.carefulMsg=1;}
 return fast;}
function carefulPopup(){return new Promise(res=>{S.carefulMsg=0;sfx('heal');let t=3;
 M(`<div style="text-align:center"><h2>잠깐! 천천히 해 볼까요?</h2><div style="display:flex;justify-content:center;height:90px">${monImg(partnerId(),'anim')}</div>
  <p style="font-size:17px;line-height:1.6">답을 너무 빨리 고르고 있어요.<br><b>문제를 소리 내어 끝까지 읽고</b> 골라 봐요.<br>찍어서 맞힌 건 내 실력이 아니에요. 천천히 풀어야 <b>좌삼</b>이 단단해져요!</p>
  <p class=mut style="font-size:13px">다음 몇 문제는 생각할 시간이 지난 뒤에 고를 수 있어요.</p>
  <div class=mbtns><button class="btn gold big" data-a=x disabled id=cfOk>숨 고르기… 3</button></div></div>`,{x:()=>{closeM();res();},_close:()=>{}});
 const iv=setInterval(()=>{t--;const b=$('#cfOk');if(!b){clearInterval(iv);return;}if(t<=0){clearInterval(iv);b.disabled=false;b.textContent='천천히 해 볼게요!';}else b.textContent='숨 고르기… '+t;},1000);});}
function askQ(host,q,opt={}){return new Promise(async res=>{
 if(S.carefulMsg&&!window.__sim)await carefulPopup();
 S.curQ=q;host.innerHTML=qHTML(q,opt.head||'');const t0=performance.now();let done=false;
 // 모든 문제: 0.5초는 고를 수 없어요(연타 방지). 천천히 모드: 읽는 시간만큼 기다려요.
 const lock=S.careful?thinkMs(q):500;if(S.careful)S.careful--;
 const chs=host.querySelectorAll('.ch');chs.forEach(b=>{b.classList.add('wait');b.style.setProperty('--lk',lock+'ms');});
 if(lock>600){const t=document.createElement('div');t.className='thinkBar';t.innerHTML=`<i style="animation-duration:${lock}ms"></i><span>문제를 끝까지 읽어요…</span>`;host.querySelector('.choices').before(t);}
 setTimeout(()=>{chs.forEach(b=>b.classList.remove('wait'));const t=host.querySelector('.thinkBar');if(t)t.remove();},lock);
 host.querySelectorAll('.ch').forEach(b=>b.onclick=async()=>{if(done||b.classList.contains('wait'))return;done=true;const ms=performance.now()-t0;const c=q.ch[+b.dataset.i];const ok=c===q.a;
  const guess=guessCheck(q,ms,ok,+b.dataset.i)&&!ok;
  host.querySelectorAll('.ch').forEach(x=>{const v=q.ch[+x.dataset.i];if(v===q.a)x.classList.add('ok');else if(x===b)x.classList.add('no');else x.classList.add('dim');});
  if(ok){sfx('ok',Math.min(8,S.meta.stats.streak));await wait(opt.fast?380:560);return res({ok,ms,choice:c,guess:false});}
  sfx('wrong');
  const mis=q.mis&&q.mis[c]&&ES_MIS[q.mis[c]];
  host.querySelector('.qAfter').innerHTML=`<div class=explain><b>정답은 ${fmtMath(esc(q.a))}</b>${mis?`<br>혹시 <b>「${esc(mis.l)}」</b> 실수를 했나요?`:''}${q.e?`<br>${fmtMath(q.e)}`:''}${q.m&&!q.pic?`<div class=mdlBox>${q.m}</div>`:''}<div class=mbtns><button class="btn gold big" data-k=1>알겠어요!</button></div><div class=mut style="font-size:12px;text-align:center;margin-top:4px">${opt.noRetry?'':'이 문제는 조금 뒤에 다시 나와요. 그때 맞히면 내 것이 돼요!'}</div></div>`;
  const k=host.querySelector('[data-k]');try{k.scrollIntoView({block:'nearest',behavior:'smooth'});}catch(e){}
  k.onclick=()=>{sfx('tap');res({ok,ms,choice:c,guess});};});});}

// ---- 오늘의 훈련 · 연습 · 끝없는 도전 ----

const TRAIN_N={1:10,2:10,3:9,4:8,5:7,6:6};
function trainN(m=S.meta){return TRAIN_N[+String(m.gs||'1')[0]]||10;}
function lastTrain(){const h=S.meta.train.hist||[];const td=today();
 for(let i=h.length-1;i>=0;i--)if(h[i].d!==td)return h[i];
 return h.length?h[h.length-1]:null;}
async function startTraining(opt={}){
 const m=S.meta;if(!allowedSkills().length){toast('이 학기에는 아직 연습할 단원이 없어요');return;}
 S.screen='train';S.newStars=[];S.newBadges=[];S.lvUp=0;S.foundMsg='';
 const endless=!!opt.endless;const N=endless?Infinity:(opt.n||trainN());const ghost=(opt.pool||endless)?null:lastTrain();
 const v=$('#view');

 v.scrollTop=0;
 $('#tQuit').onclick=async()=>{if(endless){stop({stop:1});return;}if(await confirmBox('훈련을 그만둘까요? 지금까지 푼 문제는 기록에 남아요.','그만두기','계속하기')){clearInterval(ghT);stop({stop:1,quit:1});}};

 // 막대 = 맞힌 문제 수(빠르기가 아니라 정확하게!). 끝없는 도전은 10문제마다 다시
 const prog=()=>{const p=$('.prog .me');if(p)p.style.width=(endless?(idx%10)/10*100:correct/N*100)+'%';const c=$('#tCombo');if(c)c.textContent=endless?idx+'문제':`${idx}/${N} · 정답 ${correct}`;};
 if(!m.seen.c_train){await coachOnce('c_train',[
  {h:'오늘의 훈련',ic:'flame',t:`문제 ${trainN()}개를 풀어요.`+' 정답마다 <b>사탕</b>이 생기고, 사탕을 모으면 포켓몬이 <b>진화</b>해요!'},
  ...(ghost?[{el:'.prog',h:'어제의 나',ic:'calendar',t:'초록 막대는 <b>오늘 맞힌 문제</b>, 회색 포켓몬은 <b>어제의 나</b>가 맞힌 수예요. 빠르기보다 <b>신중하게, 정확하게!</b>'}]:[]),
  {h:'틀려도 괜찮아요',ic:'heart',t:'틀리면 원리 그림과 설명이 나오고, <b>조금 뒤에 같은 문제를 다시</b> 풀어요. 자꾸 틀리는 개념은 <b>아래 학년 기초부터 좌삼을 쌓아요</b>.'}]);}

// ---- 덱 ----
const DECK_N=12;
function deckValid(d){return d.length===DECK_N&&d.every(id=>MON[id]);}
function autoDeck(){const me=S.meta;const list=[];Object.keys(me.col).map(Number).sort((a,b)=>{const A=MON[a],B=MON[b];return (B.atk+B.hp)/(B.cost+1)-(A.atk+A.hp)/(A.cost+1);}).forEach(id=>{for(let k=0;k<deckLim(id);k++)list.push(id);});
 // 비용이 고르게: 1~2비용 6장, 3~4비용 4장, 5~6비용 2장을 목표로
 const pick=[];const want={a:6,b:4,c:2};const band=id=>MON[id].cost<=2?'a':MON[id].cost<=4?'b':'c';
 for(const id of list){if(pick.length>=DECK_N)break;const b=band(id);if(want[b]>0){want[b]--;pick.push(id);}}
 for(const id of list){if(pick.length>=DECK_N)break;const used=pick.filter(x=>x===id).length;if(used<deckLim(id))pick.push(id);}
 return pick.slice(0,DECK_N);}
function ensureDeck(){const me=S.meta;const cnt={};const ok=me.deck.filter(id=>{cnt[id]=(cnt[id]||0)+1;return me.col[id]&&cnt[id]<=deckLim(id);});
 if(ok.length>DECK_N)ok.length=DECK_N;
 if(ok.length<DECK_N){for(const id of autoDeck()){if(ok.length>=DECK_N)break;const n=ok.filter(x=>x===id).length;if(n<deckLim(id))ok.push(id);}}
 me.deck=ok;return deckValid(me.deck);}
function renderDeck(keep){S.screen='deck';const me=S.meta;if(!keep)ensureDeck();
 const counts={};me.deck.forEach(id=>counts[id]=(counts[id]||0)+1);
 const curve=[1,2,3,4,5,6].map(c=>me.deck.filter(id=>MON[id].cost===c).length);
 const owned=Object.keys(me.col).map(Number).sort((a,b)=>MON[a].cost-MON[b].cost||a-b);
 $('#view').innerHTML=hudHTML()+`<div class=wrap><div class=panel><div class=row style="align-items:center"><h2 style="margin:0">${I('cards')} 내 덱 (${me.deck.length}/${DECK_N})</h2><span class=hudSp></span><button class="btn blue sm" id=dAuto>자동으로 짜기</button></div>
  <p class=mut style="font-size:13px;margin:6px 0">덱 카드를 누르면 빠지고, 아래 카드를 누르면 들어가요. 같은 카드는 2장까지. 비용이 낮은 카드가 많아야 처음부터 싸울 수 있어요.</p>
  <div class=row style="align-items:flex-end;gap:16px;margin-bottom:18px"><div><div class=mut style="font-size:12px">비용별 장수</div><div class=curve>${curve.map((n,i)=>`<div style="height:${n*8+2}px"><span>${i+1}</span></div>`).join('')}</div></div></div>
  <div class=deckBar id=deckBar>${me.deck.map((id,i)=>cardHTML(id,{size:'sm',noHolo:1}).replace('class="card','data-di="'+i+'" class="card')).join('')}</div>
  <h3>가진 카드</h3><div class=colGrid>${owned.map(id=>{const inD=counts[id]||0,lim=deckLim(id);return cardHTML(id,{size:'sm',cnt:me.col[id],noHolo:1,cls:inD>=lim?'locked':''});}).join('')}</div></div></div>`;
 bindHud();

function gymDeck(g,diff){ // 상대 덱: 체육관 타입 + 난이도에 맞는 비용
 const pool=MON_IDS.filter(id=>{const m=MON[id];if(m.rar===5&&diff<9)return false;if(g&&g.types&&!m.types.some(t=>g.types.includes(t)))return false;return m.cost<=Math.min(6,2+Math.ceil(diff/2));});
 const d=[];const want=diff<=2?{1:4,2:5,3:3}:diff<=5?{1:3,2:4,3:3,4:2}:{1:2,2:3,3:3,4:2,5:1,6:1};
 for(const c in want){const p=shuffle(pool.filter(id=>MON[id].cost===+c));for(let k=0;k<want[c];k++)if(p.length)d.push(p[k%p.length]);}
 while(d.length<DECK_N&&pool.length)d.push(rpick(pool));
 return shuffle(d.slice(0,DECK_N));}
// 배틀 안의 운(불씨 대상 등)은 친구 대전에서 두 기기가 똑같이 나오도록 같은 씨앗 난수를 써요
const brand=()=>B&&B.rng?B.rng():rnd();
// 필드 칸 수 (3칸 → 5칸으로 늘림)
const BOARD_N=5;
function mkPlayer(name,deck,hp,av,keep,owned=[],specials=false){return{name,hp,max:hp,mana:0,maxMana:0,deck:keep?deck.slice():shuffle(deck.slice()),hand:[],board:Array(BOARD_N).fill(null),av,fat:0,owned:(owned||[]).map(Number).filter(id=>MON[id]),specials:!!specials,powerUses:2};}
function mkUnit(id){const m=MON[id];const kw=kwOf(m).k;return{id,atk:m.atk,hp:m.hp,max:m.hp,kw,att:kw==='rush'?1:0,frozen:0,dodge:kw==='dodge'?1:0,tough:kw==='tough'?1:0,grow:0,fresh:1,shield:0};}
function playerRoll(P){return B&&B.pvp&&P&&P.drawRng?P.drawRng():brand();}
function ownedBand(P,band){return (P&&P.owned||[]).filter(id=>MON[id]&&MON[id].cost>=band[0]&&MON[id].cost<=band[1]);}
function drawSpecial(P){if(!P||!P.specials)return null;
 // 전체 확률: 랜덤 카드 20%, 돌 카드 20%(화염/물/전기/달 각각 5%), 덱 카드 60%.
 const roll=playerRoll(P);
 if(roll<.05)return stoneCard('fire');
 if(roll<.10)return stoneCard('water');
 if(roll<.15)return stoneCard('thunder');
 if(roll<.20)return stoneCard('moon');
 if(roll<.40){
  const tier=playerRoll(P);let ball=tier<.20?'master':tier<.50?'power':'poke';
  let c=randomBandCard(ball);
  if(!c||!ownedBand(P,c.band).length){
   // 보유한 코스트 구간만 대상으로 바꿔, 랜덤 카드 20% 확률은 유지해요.
   const available=['master','power','poke'].filter(b=>{const rc=randomBandCard(b);return rc&&ownedBand(P,rc.band).length>0;});
   if(!available.length)return null;
   ball=available[Math.floor(playerRoll(P)*available.length)];c=randomBandCard(ball);
  }
  return c;
 }
 return null;}

  startTurn('me');})();}

function matchup(aid,did){const k=typeMul(aid,did);return k>=2?{c:'adv',t:'유리 ×1.5'}:k<1?{c:'dis',t:'불리 −1'}:null;}
function predDmg(a,d){if(d.dodge)return 0;let dmg=a.atk+(a.kw==='fight'?1:0);dmg=applyType(dmg,typeMul(a.id,d.id));if(d.kw==='armor'&&dmg>1)dmg-=1;return dmg;}
function tgtBadge(d,i){if(!B||B.side!=='me')return '';const me=B.me;let out='';
 if(B.sel>=0&&me.board[B.sel]){const a=me.board[B.sel];if(!targetsFor(B.sel).units.includes(i))return '';const mu=matchup(a.id,d.id);const dm=predDmg(a,d);
  out=(mu?`<b class=${mu.c}>${mu.t}</b>`:'')+`<b class=dmgp>-${dm}</b>`+(dm>=d.hp&&!d.tough?'<b class=ko>쓰러뜨려요!</b>':'');}
 else if(B.pick>=0&&me.hand[B.pick]!=null&&!isBattleSpecial(me.hand[B.pick])){const mu=matchup(me.hand[B.pick],d.id);if(mu)out=`<b class=${mu.c}>${mu.t}</b>`;}

async function pvpStart(host,code){const m=S.meta;if(m.coins<PVP_COST){toast('코인이 모자라요');return;}if(!ensureDeck()){toast('덱이 12장이어야 해요');return;}
 PV.host=host;PV.code=code;PV.q=[];PV.started=false;PV.charged=false;
 pvBox(`<p>연결 준비 중…</p><button class="btn ghost" id=pvCancel>취소</button>`);
 try{await loadPeer();}catch(e){pvBox(`<p style="color:#d9393f">${esc(e.message)}</p><button class="btn ghost" id=pvCancel>돌아가기</button>`);return;}
 const id='pkmath-'+PVP_VER+'-'+code;
 const peer=host?new Peer(id):new Peer();PV.peer=peer;
 peer.on('error',e=>{const t=String(e&&e.type||'');pvBox(`<p style="color:#d9393f">${t==='unavailable-id'?'이미 쓰는 방 번호예요. 다시 만들어 주세요.':t==='peer-unavailable'?'그 번호의 방이 없어요. 번호를 확인해 주세요.':t==='network'||t==='server-error'?'연결 서버에 닿지 못했어요. 인터넷을 확인해 주세요.':'연결하지 못했어요 ('+esc(t)+')'}</p><button class="btn ghost" id=pvCancel>돌아가기</button>`);});
 peer.on('open',()=>{
  if(host){pvBox(`<p>친구에게 이 방 번호를 알려 주세요</p><div class=tcode style="font-size:52px;margin:8px 0">${code}</div><p class=mut>친구를 기다리는 중…</p><button class="btn ghost" id=pvCancel>취소</button>`);
   peer.on('connection',c=>{if(PV.conn){c.close();return;}PV.conn=c;pvBind(c);});}
  else{pvBox(`<p>방 ${code}에 들어가는 중…</p><button class="btn ghost" id=pvCancel>취소</button>`);const c=peer.connect(id,{reliable:true});PV.conn=c;pvBind(c);}});}
function pvBind(c){
 c.on('open',()=>{const me=S.meta;const deck=shuffle(me.deck.slice());PV.myDeck=deck;PV.myOwned=Object.keys(me.col).map(Number).filter(id=>MON[id]);
  pvpSend({t:'hi',v:PVP_VER,name:me.name,deck,col:PV.myOwned,av:partnerId(),seed:PV.host?(Math.random()*1e9|0):0});});
 c.on('data',d=>{PV.q.push(d);pvpPump();});
 c.on('close',()=>{if(B&&B.pvp&&!B.over){B.over=true;toast('친구와 연결이 끊겼어요');pvpEnd(null);}else if(!PV.started&&S.screen==='pvp'){pvBox(`<p>연결이 끊겼어요</p><button class="btn ghost" id=pvCancel>돌아가기</button>`);}});}
// 받은 행동을 차례대로 하나씩 처리해요(애니메이션이 겹치지 않게)
async function pvpPump(){if(PV.busy)return;PV.busy=true;
 try{while(PV.q.length){const d=PV.q[0];
  if(d.t==='hi'){PV.q.shift();if(d.v!==PVP_VER){pvBox(`<p style="color:#d9393f">친구와 게임 버전이 달라요. 둘 다 최신 파일로 열어 주세요.</p><button class="btn ghost" id=pvCancel>돌아가기</button>`);continue;}PV.foe=d;if(PV.host)PV.seed=d.seed||((Math.random()*1e9)|0);
   if(PV.host){PV.seed=PV.seed||((Math.random()*1e9)|0);pvpSend({t:'go',seed:PV.seed});pvpBegin(PV.seed);}continue;}
  if(d.t==='go'){PV.q.shift();pvpBegin(d.seed);continue;}
  if(d.t==='gg'){PV.q.shift();toast(`${esc((PV.foe&&PV.foe.name)||'친구')}: "좋은 경기였어!"`);sfx('heal');continue;}
  if(!B||!B.pvp||B.over){PV.q.shift();continue;}
  // 내 차례가 시작되기 전에 들어온 상대 행동은 상대 차례에 처리
  if(d.t==='sum'){PV.q.shift();B.busy=true;await summon(B.foe,d.h,d.s);B.busy=false;continue;}
  if(d.t==='item'){PV.q.shift();B.busy=true;await playItem(B.foe,d.h,d.target,true);B.busy=false;continue;}
  if(d.t==='atk'){PV.q.shift();B.busy=true;const a=B.foe.board[d.si];msg(`${esc(PV.foe.name)}의 ${a?esc(MON[a.id].name):''} 공격! ${d.ok?'(문제 정답!)':'(문제를 틀려서 약하게)'}`);await wait(500);
   let reduce=0;if(d.tg&&d.tg.hero){const q=pickQ();const r=q?await battleQ(q,{who:B.me.av,what:`방어 문제! 맞히면 ${esc(PV.foe.name)}의 트레이너 공격 피해가 1 줄어요`,defense:true }):{ok:false};if(r.ok){reduce=1;B.qc++;S.meta.stats.defOk=(S.meta.stats.defOk||0)+1;fx(heroEl(B.me),'방어 성공! -1','txt');}else fx(heroEl(B.me),'방어 실패','txt');pvpSend({t:'defres',reduce,ok:r.ok});}
   await resolveAttack(B.foe,B.me,d.si,d.tg,d.ok,d.cb,reduce);B.busy=false;continue;}
  if(d.t==='defres'){PV.q.shift();const p=B.pendingAttack;if(p){B.pendingAttack=null;B.busy=true;await resolveAttack(B.me,B.foe,p.si,p.tg,p.ok,p.cb,d.reduce||0);B.busy=false;renderBattle();}continue;}
  if(d.t==='pow'){PV.q.shift();B.foe.powerUses=Math.max(0,(B.foe.powerUses||0)-1);if(d.ok)draw(B.foe);fx(heroEl(B.foe),d.ok?'공부 기술 성공!':'공부 기술','txt');renderBattle();continue;}
  if(d.t==='end'){PV.q.shift();await startTurn('me');continue;}
  if(d.t==='quit'){PV.q.shift();if(!B.over){B.over=true;toast('친구가 대전을 그만두었어요');setTimeout(()=>endBattle(true),600);}continue;}
  PV.q.shift();}}
 finally{PV.busy=false;}}
function pvpBegin(seed){if(PV.started)return;PV.started=true;const me=S.meta,f=PV.foe;
 me.coins-=PVP_COST;PV.charged=true;autoSave();
 const G={n:'친구 대전',ldr:f.name,c:'#bfe6ff'};
 B={gi:-2,g:G,diff:3,turn:0,round:0,side:'me',pvp:true,rng:mkRng(seed),me:mkPlayer(me.name,PV.myDeck,HERO_HP,partnerId(),true,PV.myOwned||Object.keys(me.col).map(Number),true),foe:mkPlayer(f.name,f.deck,HERO_HP,MON[f.av]?f.av:25,true,f.col||[],true),
  sel:-1,pick:-1,busy:false,combo:0,qn:0,qc:0,defUsed:true,over:false};
 // 포켓몬별 특수 카드 확률 난수는 트레이너 이름과 대전 씨앗으로 분리해 두 기기에서 같은 결과가 나와요.
 B.me.drawRng=mkRng((seed^hashStr(B.me.name)^0x51A7)>>>0);B.foe.drawRng=mkRng((seed^hashStr(B.foe.name)^0x51A7)>>>0);
 // 먼저 하는 사람(방장)은 3장, 나중에 하는 사람은 4장
 const meFirst=PV.host;for(let i=0;i<(meFirst?3:4);i++)draw(B.me,true);for(let i=0;i<(meFirst?4:3);i++)draw(B.foe,true);
 S.screen='battle';$('#view').innerHTML='';$('#battle').classList.add('on');startBgm('battle');renderBattle();
 banner('친구 대전!',`${esc(f.name)}와(과) 대결`,1800);
 setTimeout(()=>{if(!B)return;if(meFirst)startTurn('me');else{B.side='foe';B.turn++;B.foe.maxMana=1;B.foe.mana=1;draw(B.foe);B.busy=false;renderBattle();pvpPump();}},1600);}
async function pvpEnd(win){startBgm('adventure');const me=S.meta;const f=PV.foe||{name:'친구'};
 if(win!==null){me.pvp=me.pvp||{n:0,w:0,l:0,gg:0,foes:{}};me.pvp.n++;if(win)me.pvp.w++;else me.pvp.l++;me.pvp.foes[f.name]=(me.pvp.foes[f.name]||0)+1;me.pvp.last=Date.now();

  ${win!==null?`<p style="margin-top:10px">이기든 지든, 친구에게 인사해 볼까요?</p>`:''}
  <div class=mbtns>${win!==null?`<button class="btn green big" data-a=gg>${I('heart')} 좋은 경기!</button>`:''}<button class="btn gold" data-a=x>확인</button></div></div>`,
  {gg:b=>{pvpSend({t:'gg'});me.pvp.gg=(me.pvp.gg||0)+1;autoSave();toast('친구에게 "좋은 경기!"라고 인사했어요');b.disabled=true;},x:()=>{closeM();B=null;$('#battle').classList.remove('on');$('#battle').innerHTML='';setTimeout(pvpClose,1500);if(S.lvUp)levelUpFx();renderPvp();},_close:()=>{}});}

 return{id:se.id,name:m.name,gs:m.gs,partner:partnerId(),made:Date.now(),range:r,days:dk.length,first:dk[0]||'',last:dk[dk.length-1]||'',n:tot.n,c:tot.c,tt:tot.tt,ms:tot.ms,months,

const STONE_COL={1:['#ffb3c7','#ffd9e3'],2:['#ffc58a','#ffe0bf'],3:['#ffe27a','#fff1b8'],4:['#9fe08a','#cff2c2'],5:['#8cc8ff','#c6e4ff'],6:['#c8a6ff','#e4d6ff']};
function stoneList(m){const out=[];const n=Math.min(30,m.stats.foundDone||0);for(let i=0;i<n;i++)out.push(0);
 const per={};for(const id in m.sk){const s=SKM[id];if(!s)continue;const g=+s.s[0];per[g]=(per[g]||0)+(m.sk[id].st||0);}
 Object.keys(per).sort().forEach(g=>{for(let i=0;i<per[g];i++)out.push(+g);});return out;}
function stoneSVG(m,opt={}){const all=stoneList(m);const CAP=66;const per=Math.max(1,Math.ceil(all.length/CAP));const st=[];for(let i=0;i<all.length;i+=per)st.push(all[i]);
 const rows=[];let cap=11,i=0;while(i<st.length&&cap>0){rows.push(st.slice(i,i+cap));i+=cap;cap--;}
 const SW=26,SH=15,W=11*SW+40,H=Math.max(70,rows.length*SH+90);const base=H-24;
 const seen=opt.seen==null?st.length:opt.seen;let k=0,out='';
 rows.forEach((r,ri)=>{const y=base-ri*SH-SH;const x0=(W-r.length*SW)/2+(ri%2?3:0);r.forEach((g,ci)=>{const x=Math.round(x0+ci*SW);const c=g?STONE_COL[g]:['#ffd23f','#fff3a0'];const isNew=k>=seen;
