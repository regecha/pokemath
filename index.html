function showCard(id){const m=MON[id],me=S.meta,own=me.col[id]||0;const kw=kwOf(m);const sh=(me.shard&&me.shard[id])||0,need=SHARD_NEED[m.rar];
 const evo=m.to.map(t=>{const need=evoCost(m);return `<button class="btn ${me.candy>=need&&own?'green':'ghost'}" data-a="ev${t}" ${own?'':'disabled'}>${I('candy')} ${need} → ${josa(esc(MON[t].name),'이로')} 진화</button>`;}).join('');
 const acts={x:()=>closeM(),_close:()=>closeM(),buy:async()=>{const p=buyPrice(id);if(!p||me.coins<p)return;if(!(await confirmBox(`정말 갖고 싶나요?<br><b>${josa(esc(m.name),'을를')}</b> <b>${p}코인</b>(가치의 ${BUY_X}배)으로 데려올까요?<br><span class=mut>코인은 문제를 풀어 모은 소중한 보상이에요.</span>`,'데려올래요','조금 더 생각할래요')))return;me.coins-=p;if(me.shard)delete me.shard[id];me.col[id]=1;me.dexSeen[id]=1;me.stats.bought=(me.stats.bought||0)+1;autoSave();sfx('evolve');confetti(40);toast(`${esc(m.name)}${hasJong(m.name)?'과':'와'} 함께하게 되었어요!`);showCard(id);},pt:()=>{setPartner(id);showCard(id);},craft:()=>{const g=craft(id);if(!g)return;sfx(g.k==='done'||g.k==='new'?'evolve':'coin');if(g.k==='done'||g.k==='new'){confetti(40);toast(`${esc(m.name)} 카드를 얻었어요!`);}else toast(`조각 ${g.n}/${g.need}`);showCard(id);}};m.to.forEach(t=>acts['ev'+t]=()=>evolve(id,t));
 M(`<div style="display:flex;flex-direction:column;align-items:center;gap:10px">${own?cardHTML(id,{size:'lg'}):`<div class="card lg locked">${''}<div class=art>${monImg(id,'front')}</div></div>`}
  <div style="text-align:center"><b class=jua style="font-size:22px">No.${m.id} ${esc(m.name)}</b> <span class=mut>${esc(m.genus)}</span><br>${own?`<span class=mut>가지고 있는 카드 ${own}장 · 키 ${m.ht}m · 몸무게 ${m.wt}kg</span>`:'<span class=mut>아직 없는 카드예요</span>'}</div>
  ${!own&&(me.dexSeen[id]||sh)?`<div class=explain style="font-size:14px;width:100%">${need?`조각 <b>${sh} / ${need}</b> <span class=xpBar style="display:inline-block;width:120px;vertical-align:middle"><i style="width:${sh/need*100}%"></i></span><br>`:''}${I('star')} 별가루 ${DUST_COST[m.rar]}개로 ${need?'조각 1개':'카드'}를 만들 수 있어요 (지금 ${me.dust||0}개)<div class=mbtns><button class="btn purple sm" data-a=craft ${(me.dust||0)>=DUST_COST[m.rar]?'':'disabled'}>만들기</button></div></div>`:''}
  ${!own&&(me.dexSeen[id]||sh)?(m.rar>=5?`<div class=explain style="font-size:13px;width:100%;background:#fff3c4">${I('lock')} <b>전설의 포켓몬</b>은 살 수 없어요. 열심히 문제를 풀어 <b>조각</b>을 모아 만나요!</div>`:`<div class=explain style="font-size:13px;width:100%">${I('coin')} 이 카드의 가치는 <b>${CARD_VALUE[m.rar]}코인</b>이에요. 너무너무 갖고 싶다면 <b>${BUY_X}배인 ${buyPrice(id)}코인</b>으로 바로 데려올 수 있어요. (지금 ${me.coins}코인)<div class=mbtns><button class="btn red sm" data-a=buy ${me.coins>=buyPrice(id)?'':'disabled'}>${buyPrice(id)}코인으로 데려오기</button></div></div>`):''}
  ${own&&m.flavor?`<div class=explain style="font-size:14px">${esc(m.flavor)}</div>`:''}
  ${own?`<div class=explain style="font-size:14px;background:#eef6ff;border-color:#9fc3ff">${I(kw.ic)} <b style="color:#2f62b5">${kw.n}</b> — ${kw.d}<br>희귀도 ${RAR_NAME[m.rar]} · 비용 ${m.cost} · 공격 ${m.atk} · 체력 ${m.hp}</div>`:''}
  ${m.to.length?`<div class=menuCol style="width:100%">${evo}<div class=mut style="font-size:12px;text-align:center">내 사탕 ${me.candy}개</div></div>`:''}

  ${own?`<div class=row style="width:100%;align-items:center"><span class=mut style="font-size:13px">${regionOf(id)} 지역 · 함께 푼 문제 ${bondOf(id)}개</span>${partnerId()===id?`<span class=pill style="border-color:#ff5a8a">${I('heart')} 지금 파트너</span>`:`<button class="btn red sm" data-a=pt>${I('heart')} 파트너로 함께 공부</button>`}</div>`:''}
  <button class="btn gold" data-a=x>닫기</button></div>`,acts);
 tiltOn($('#mbox .card.lg'));}

 const inR=id=>DEXR<0||(id>=REGIONS[DEXR][1]&&id<=REGIONS[DEXR][2]);

 $('#view').querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{sfx('tap');DEXF=b.dataset.f;renderDex();});

// ---- 덱 ----
const DECK_N=12;
function deckValid(d){return d.length===DECK_N&&d.every(id=>MON[id]);}
function autoDeck(){const me=S.meta;const list=[];Object.keys(me.col).map(Number).sort((a,b)=>{const A=MON[a],B=MON[b];return (B.atk+B.hp)/(B.cost+1)-(A.atk+A.hp)/(A.cost+1);}).forEach(id=>{for(let k=0;k<deckLim(id);k++)list.push(id);});
 // 비용이 고르게: 1~2비용 6장, 3~4비용 4장, 5~6비용 2장을 목표로
 const pick=[];const want={a:6,b:4,c:2};const band=id=>MON[id].cost<=2?'a':MON[id].cost<=4?'b':'c';
 for(const id of list){if(pick.length>=DECK_N)break;const b=band(id);if(want[b]>0){want[b]--;pick.push(id);}}
 for(const id of list){if(pick.length>=DECK_N)break;const used=pick.filter(x=>x===id).length;if(used<deckLim(id))pick.push(id);}
 return pick.slice(0,DECK_N);}
function ensureDeck(){const me=S.meta;const cnt={};const ok=me.deck.filter(id=>{cnt[id]=(cnt[id]||0)+1;return me.col[id]&&cnt[id]<=deckLim(id);});
 if(ok.length>DECK_N)ok.length=DECK_N;
 if(ok.length<DECK_N){for(const id of autoDeck()){if(ok.length>=DECK_N)break;const n=ok.filter(x=>x===id).length;if(n<deckLim(id))ok.push(id);}}
 me.deck=ok;return deckValid(me.deck);}
function renderDeck(keep){S.screen='deck';const me=S.meta;if(!keep)ensureDeck();
 const counts={};me.deck.forEach(id=>counts[id]=(counts[id]||0)+1);
 const curve=[1,2,3,4,5,6].map(c=>me.deck.filter(id=>MON[id].cost===c).length);
 const owned=Object.keys(me.col).map(Number).sort((a,b)=>MON[a].cost-MON[b].cost||a-b);
 $('#view').innerHTML=hudHTML()+`<div class=wrap><div class=panel><div class=row style="align-items:center"><h2 style="margin:0">${I('cards')} 내 덱 (${me.deck.length}/${DECK_N})</h2><span class=hudSp></span><button class="btn blue sm" id=dAuto>자동으로 짜기</button></div>
  <p class=mut style="font-size:13px;margin:6px 0">덱 카드를 누르면 빠지고, 아래 카드를 누르면 들어가요. 같은 카드는 2장까지. 비용이 낮은 카드가 많아야 처음부터 싸울 수 있어요.</p>

function center(el){const r=zRect(el);return[r.left+r.width/2,r.top+r.height/2];}
function particles(el,col,n){if(!el||S.meta.settings.lowfx||window.__sim)return;const[x,y]=center(el);for(let k=0;k<n;k++){const d=document.createElement('div');d.className='pcl';d.style.left=x+'px';d.style.top=y+'px';d.style.background=k%3?col:'#fff';const a=Math.random()*Math.PI*2,r=50+Math.random()*70;d.style.setProperty('--dx',Math.cos(a)*r+'px');d.style.setProperty('--dy',Math.sin(a)*r+'px');d.style.setProperty('--r',(Math.random()*540-270)+'deg');document.body.appendChild(d);setTimeout(()=>d.remove(),600);}

 }

 const k=skillOf(a.id),epic=(MON[a.id]&&MON[a.id].cost>=5),basePw=ok?(cb?1.25:1):.6,pw=epic&&ok?(cb?1.8:1.55):basePw;

 skAura(k,fromEl,pw);sfx('tap');
 try{fromEl.animate([{transform:'none'},{transform:`translateY(${A===B.me?6:-6}px) scale(${epic&&ok?1.12:.94})`,offset:.5},{transform:'none'}],{duration:260});}catch(e){}
 await wait(170);

async function playerAttack(si,tg,coopAnswer=null){const me=B.me,fo=B.foe;const a=me.board[si];if(!a)return;B.busy=true;B.sel=-1;renderBattle();
 let ok=coopAnswer==null?true:!!coopAnswer;const q=coopAnswer==null?pickQ():null;if(B.coop&&coopAnswer!=null)B.qn++;
 if(q){const r=await battleQ(q,{who:a.id,what:tg.hero?`${esc(fo.name)}에게 공격!`:`${esc(MON[fo.board[tg.u].id].name)}에게 공격!`});ok=r.ok;}
 if(!B)return;
 let cb=false;if(ok){B.combo++;B.qc++;cb=B.combo>=3;}else B.combo=0;
 if(B.pvp){pvpSend({t:'atk',si,tg,ok,cb});if(tg.hero){B.pendingAttack={si,tg,ok,cb};msg('상대 트레이너가 방어 문제를 푸는 중…');renderBattle();return;}}
 await resolveAttack(me,fo,si,tg,ok,cb);B.busy=false;renderBattle();}

// 공격 결과 (내 공격·친구의 공격이 같은 규칙) — ok: 문제를 맞혔나, cb: 3연속 콤보
async function resolveAttack(A,D,si,tg,ok,cb,defReduce=0){const a=A.board[si];if(!a)return;
 let dmg=a.atk;let note='';
 if(ok){if(cb){dmg+=1;note='콤보 +1! ';}}else{dmg=Math.ceil(dmg/2);note='약한 공격… ';}
 a.att--;a.fresh=0;
 if(tg.hero){if(a.kw==='quake')dmg+=1;if(defReduce>0){dmg=Math.max(0,dmg-defReduce);note+=`방어 문제 정답 -${defReduce}! `;}const el=heroEl(D);await skillMove(A,si,el,ok,cb);D.hp-=dmg;if(dmg>0){impact(el,dmg,{hero:1,col:'#ff5a5f'});fx(el,'-'+dmg,ok?'crit big':'');}else fx(el,'공격을 막았다!','txt');if(ok&&dmg>0)sfx('crit');if(note)fx(unitEl(A,si),note,'txt');}
 else{const d=D.board[tg.u];if(!d){return;}
  if(a.kw==='fight')dmg+=1;const k=typeMul(a.id,d.id);dmg=applyType(dmg,k);
  await skillMove(A,si,unitEl(D,tg.u),ok,cb);
  if(k>=2){fx(unitEl(D,tg.u),'효과가 굉장했다!','txt super');if(A===B.me)S.meta.stats.superEff=(S.meta.stats.superEff||0)+1;}else if(k<1)fx(unitEl(D,tg.u),'효과가 별로인 듯…','txt');
  await dealUnit(D,tg.u,dmg);
  if(a.kw==='freeze'&&D.board[tg.u])D.board[tg.u].frozen=1;
  if(a.kw==='poison'&&D.board[tg.u])D.board[tg.u].atk=Math.max(0,D.board[tg.u].atk-1);
  if(!(B.wildMode&&D===B.foe)){let cd=d.atk;const k2=typeMul(d.id,a.id);cd=applyType(cd,k2);if(cd>0){await wait(220);await dealUnit(A,si,cd);}}
  if(note)fx(unitEl(A,si),note,'txt');}
 cleanup();renderBattle();checkEnd();}

async function battleQ(q,opt){B.qn++;if(window.__sim)return{ok:rnd()<SIM.p,ms:3000};const box=$('#bq');box.innerHTML=`<div class="sheet${opt.defense?' defense':''}"><div class=bqHead><span class=who>${monImg(opt.who,'front')}${esc(MON[opt.who]?MON[opt.who].name:'')}</span><span>${opt.what}</span></div><div id=bqHost></div></div>`;box.classList.add('on');
 const r=await askQ($('#bqHost'),q,{fast:true,noRetry:true});recordAnswer(q,r.ok,r.ms,{choice:r.choice,guess:r.guess});box.classList.remove('on');box.innerHTML='';
 if(!r.ok){B.retryQ=q;}return r;}
function cleanup(){[B.me,B.foe].forEach(P=>P.board.forEach((u,i)=>{if(u&&u.hp<=0){P.board[i]=null;}}));if(B&&B.wildMode)syncWildPrimary();}
function checkEnd(){if(!B||B.over)return false;if(B.wildMode){const live=syncWildPrimary();if(!live.length){if(B.coop){if(BC.host)bossFinish('win');return true;}B.over=true;const caught=(B.wildState.caughtIds||[]).length>0;const note=caught?'야생 포켓몬 전투가 끝났어요. 포획한 포켓몬은 도감에 등록됐어요.':'야생 포켓몬이 모두 쓰러져 포획하지 못했어요.';if(!window.__sim)setTimeout(()=>finishEndlessWild(caught?'caught':'knockout',note),650);return true;}if(B.coop&&B.coop.players.some(p=>p.hp<=0)){if(BC.host)bossFinish('lost');return true;}if(B.me.hp<=0&&!B.coop){B.over=true;if(!window.__sim)setTimeout(()=>finishEndlessWild('lost','트레이너 체력이 0이 되어 야생 전투를 마쳤어요.'),650);return true;}const weak=live.filter(i=>B.foe.board[i].hp<=B.foe.board[i].max*.3).sort((a,b)=>B.foe.board[a].hp/B.foe.board[a].max-B.foe.board[b].hp/B.foe.board[b].max);if(weak.length&&!B.capturePrompted&&!(B.wildState&&B.wildState.scenarioMode)){B.capturePrompted=true;B.wildCaptureTargetSlot=weak[0];if(!window.__sim)setTimeout(scheduleWildCapturePrompt,180);}return false;}if(B.foe.hp<=0||B.me.hp<=0){B.over=true;if(window.__sim)return true;setTimeout(()=>endBattle(B.foe.hp<=0&&B.me.hp>0||(B.foe.hp<=0&&B.me.hp>=B.foe.hp)),600);return true;}return false;}
async function startTurn(side){if(!B||B.over)return;closeInfo();if(B.coop&&side==='foe')bossSetActive(0);B.side=side;const P=side==='me'?B.me:B.foe;B.turn++;if(side==='me'){B.round++;B.counterActive=0;}
 P.maxMana=Math.min(6,P.maxMana+1);P.mana=P.maxMana;B.defUsed=false;
 if(side==='me'&&!B.pvp&&!window.__sim){const ml=B.coop?(Number(P.manaLv)||0):(Number(trainerSkillLevels().mana)||0);if(ml>0&&rnd()*100<manaChance(ml)){P.mana+=1;B.manaBonusFx=1;}}
 const wildAliveCount=B.wildMode&&side==='foe'?B.foe.board.filter(u=>u&&u.hp>0).length:0;
 P.board.forEach(u=>{if(!u)return;if(B.coop&&side==='me'&&Number(u.coopOwner??0)!==B.coop.active)return;u.fresh=0;u.att=u.frozen?0:(B.wildMode&&P===B.foe?(((S.meta.settings.easy&&!B.coop)||wildAliveCount>=2)?1:2):(u.kw==='double'?2:1));if(u.frozen&&side==='me'){}if(u.kw==='grow'&&u.grow<2){u.grow++;u.atk++;}});
 // 얼음은 한 차례만
 P.board.forEach(u=>{if(u&&u.frozen&&(!B.coop||side==='foe'||Number(u.coopOwner??0)===B.coop.active)){u.frozen=0;u.att=0;}});
 if(!(B.wildMode&&side==='foe'))draw(P);
 const rd=B.pvp?Math.ceil(B.turn/2):B.round;
 if(rd>=10&&!(B.wildMode&&P===B.foe)){const sd=rd-9;P.hp-=sd;renderBattle();fx(heroEl(P),`지쳤다 -${sd}`,'');if(checkEnd())return;}
 renderBattle();
 if(B.manaBonusFx){B.manaBonusFx=0;fx(heroEl(P),'마나 연구! 에너지 +1','heal');}
 if(side==='me'){if(B.coop){const act=B.coop.active;banner.local=1;banner(act===BC.localIndex?'내 차례!':`${esc(B.coop.players[act].name)}의 차례!`,'',1000);banner.local=0;bossSend({t:'boss-turn',a:act,ms:1000});}else banner('내 차례!','',1000);}
 else if(B.pvp){B.busy=false;renderBattle();pvpPump();}
 else{await wait(700);await foeTurn();}}
function endTurn(){if(!B||B.over)return;if(B.coop){if(B.coop.active===0){bossSetActive(1);startTurn('me');}else{startTurn('foe');}return;}startTurn(B.side==='me'?'foe':'me');}
// 상대 AI
async function foeTurn(){const fo=B.foe,me=B.me;B.busy=true;renderBattle();
 // 1) 일반 상대는 카드를 내지만, 야생 포켓몬은 트레이너·손패 없이 직접 공격해요.
 if(!B.wildMode){let played=true;while(played){played=false;const h=fo.hand.map((id,i)=>({id,i})).filter(x=>MON[x.id].cost<=fo.mana).sort((a,b)=>MON[b.id].cost-MON[a.id].cost);const slot=fo.board.indexOf(null);
  if(h.length&&slot>=0){await summon(fo,h[0].i,slot);B.busy=true;played=true;await wait(450);if(B.over)return;}}}
 // 2) 공격
 for(let i=0;i<fo.board.length;i++){let u=fo.board[i];while(u&&u.att>0&&!u.frozen&&!B.over){
   const taunts=me.board.map((x,j)=>isTaunt(x)?j:-1).filter(j=>j>=0);let tg=null;
   const faceDmg=fo.board.reduce((s,x)=>s+(x&&x.att>0&&!x.frozen?x.atk:0),0);
   if(taunts.length&&u.kw!=='sneak')tg={u:taunts.sort((a,b)=>me.board[a].hp-me.board[b].hp)[0]};
   else if(B.coop?bossLethal(faceDmg)>=0:faceDmg>=me.hp)tg=bossPickTrainer(faceDmg);
   else{let best=null,bv=-1;me.board.forEach((x,j)=>{if(!x)return;const dm=applyType(u.atk+(u.kw==='fight'?1:0),typeMul(u.id,x.id));const back=applyType(x.atk,typeMul(x.id,u.id));const kill=dm>=x.hp,die=back>=u.hp;let v;
      if(B.gi>=0){
       // 관장은 처치 가능한 위협부터 제거하고, 처치가 어렵다면 위험한 상대에게 큰 피해를 줘요.
       v=kill?100+MON[x.id].cost*4-MON[u.id].cost*1.5+(!die?18:0)+(isTaunt(x)?5:0):Math.min(dm,x.hp)*1.8+x.atk*2+MON[x.id].cost*.7+(isTaunt(x)?6:0)+(x.kw==='grow'?3:0);
      }else v=kill?(die?MON[x.id].cost-MON[u.id].cost+.5:MON[x.id].cost+3):-1;
      if(v>bv){bv=v;best=j;}});
    const smart=B.gi>=0?.97:(B.diff>=3?.8:.45);if(best!=null&&bv>0&&rnd()<smart)tg={u:best};else tg=bossPickTrainer(faceDmg);}
   await foeAttack(i,tg);u=fo.board[i];await wait(380);}}
 if(B.over)return;B.busy=false;await wait(300);if(B.coop)bossSetActive(0);startTurn('me');}
async function foeAttack(i,tg){const fo=B.foe,me=B.me;const a=fo.board[i];if(!a)return;a.att--;
 let dmg=a.atk;
 if(tg.hero){if(a.kw==='quake')dmg+=1;
  // 막기 문제: 내 트레이너가 피해 2 이상을 받을 때마다 방어 문제를 표시
  const tp=(B.coop&&tg.p!=null&&B.coop.players[tg.p])?B.coop.players[tg.p]:me;const remoteDef=!!B.coop&&tp!==B.coop.players[0];
   if(S.meta.settings.defq&&dmg>=2){renderBattle();bossMarkTarget(tp);let r=null;if(remoteDef){r=await bossAskDefense(tp,a);}else{const q=pickQ();if(q)r=await battleQ(q,{who:tp.av,what:`막기! ${esc(MON[a.id].name)}의 공격을 막아요`,defense:true});}
    if(r){if(r.ok){B.qc++;B.combo++;if(!remoteDef)S.meta.stats.defOk=(S.meta.stats.defOk||0)+1;dmg=Math.max(0,dmg-2);fx(heroEl(tp),'막았다!','txt');if(B.counterActive>0){await dealUnit(fo,i,B.counterActive);fx(heroEl(tp),`반격 -${B.counterActive}`,'txt');}}else B.combo=0;}}
  bossMarkTarget(tp);await skillMove(fo,i,heroEl(tp),true,false);tp.hp-=dmg;if(dmg){impact(heroEl(tp),dmg,{hero:1,col:'#ff5a5f'});fx(heroEl(tp),'-'+dmg,dmg>=4?'big':'');}}
 else{const d=me.board[tg.u];if(!d)return;if(a.kw==='fight')dmg+=1;const k=typeMul(a.id,d.id);dmg=applyType(dmg,k);
  await skillMove(fo,i,unitEl(me,tg.u),true,false);if(k>=2)fx(unitEl(me,tg.u),'효과가 굉장했다!','txt');
  await dealUnit(me,tg.u,dmg);if(a.kw==='freeze'&&me.board[tg.u])me.board[tg.u].frozen=1;if(a.kw==='poison'&&me.board[tg.u])me.board[tg.u].atk=Math.max(0,me.board[tg.u].atk-1);

const STONE_COL={1:['#ffb3c7','#ffd9e3'],2:['#ffc58a','#ffe0bf'],3:['#ffe27a','#fff1b8'],4:['#9fe08a','#cff2c2'],5:['#8cc8ff','#c6e4ff'],6:['#c8a6ff','#e4d6ff']};
function stoneList(m){const out=[];const n=Math.min(30,m.stats.foundDone||0);for(let i=0;i<n;i++)out.push(0);
 const per={};for(const id in m.sk){const s=SKM[id];if(!s)continue;const g=+s.s[0];per[g]=(per[g]||0)+(m.sk[id].st||0);}
 Object.keys(per).sort().forEach(g=>{for(let i=0;i<per[g];i++)out.push(+g);});return out;}
function stoneSVG(m,opt={}){const all=stoneList(m);const CAP=66;const per=Math.max(1,Math.ceil(all.length/CAP));const st=[];for(let i=0;i<all.length;i+=per)st.push(all[i]);
 const rows=[];let cap=11,i=0;while(i<st.length&&cap>0){rows.push(st.slice(i,i+cap));i+=cap;cap--;}

  ${change?'<button class="btn ghost sm" id=nBack>취소</button>':''}
  <p class=mut style="font-size:12px;text-align:center">닉네임은 이 기기와 저장 코드에만 남아요. 선생님은 닉네임으로 기록을 봐요.</p></div></div>`;
 const inp=$('#nIn');setTimeout(()=>inp.focus(),100);
 $('#nRand').onclick=()=>{sfx('tap');inp.value=rpick(NICK_A)+' '+rpick(NICK_B)+(rnd()<.5?rint(1,99):'');};
 if($('#nBack'))$('#nBack').onclick=()=>{sfx('tap');renderHub();};
 const ok=async()=>{const v=inp.value.trim().replace(/[<>]/g,'').replace(/\s+/g,' ');if(!v){toast('닉네임을 적어 주세요');return;}
  if(looksReal(v.replace(/\s/g,''))&&!(await confirmBox(`<b>${esc(v)}</b>, 혹시 진짜 이름인가요?<br>개인정보를 지키려면 <b>닉네임</b>을 쓰는 게 좋아요.`,'닉네임 다시 정하기','진짜 이름이 아니에요'))===false){inp.value='';inp.focus();return;}
  S.meta.name=v;if(!S.meta.created)S.meta.created=Date.now();autoSave();sfx('ok');if(change){toast('닉네임을 바꿨어요');renderHub();}else renderStarter();};
 $('#nOk').onclick=ok;inp.onkeydown=e=>{if(e.key==='Enter')ok();};}
let STR_R='관동';
function renderStarter(){S.screen='starter';$('#view').innerHTML=`<div class=wrap><div class=panel style="text-align:center"><h2>첫 파트너를 골라요!</h2><p class=mut>어느 지역의 포켓몬과 시작할까요? 첫 파트너는 덱에 2장 들어가요.<br>공부하며 카드를 모으면 <b>다른 포켓몬과도 함께 공부</b>할 수 있어요.</p>
  <div class=regions style="margin-top:10px">${Object.keys(STARTERS).filter(r=>MON[STARTERS[r][0]]).map(r=>`<button class="fbtn${STR_R===r?' on':''}" data-r="${r}">${r}</button>`).join('')}</div></div>
  <div class=colGrid>${STARTERS[STR_R].filter(id=>MON[id]).map(id=>cardHTML(id,{noHolo:1})).join('')}</div></div>`;
 $('#view').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{sfx('tap');STR_R=b.dataset.r;renderStarter();});
 $('#view').querySelectorAll('.card').forEach(c=>c.onclick=async()=>{const id=+c.dataset.id;sfx('tap');if(!(await confirmBox(`<b>${josa(esc(MON[id].name),'와과')}</b> 함께할까요?<div style="display:flex;justify-content:center">${monImg(id,'anim')}</div>`,'함께할래요!','다시 고를래요')))return;
  const m=S.meta;m.starter=id;m.partner=id;addCard(id,2);STARTER_DECK.forEach(x=>addCard(x,2));m.deck=[id,id,...STARTER_DECK.flatMap(x=>[x,x])];autoSave();sfx('win');confetti(40);
  askUnit(()=>{renderHub();});});}
function askUnit(next,again){const m=S.meta;const us=UNITS[m.gs]||[];const set=v=>{m.uMax=v;m.uMaxAt=today();autoSave();closeM();next();};
 M(`<h2>${again?'진도가 나갔나요?':'지금 몇 단원을 배우고 있나요?'}</h2>${again&&m.uMax?`<p style="font-size:15px">지금은 <b>${m.uMax>=20?'전체':m.uMax+'단원까지'}</b> 문제가 나와요.</p>`:''}<p class=mut style="font-size:14px">${esc(semName(m.gs))}에서 <b>배운 단원까지만</b> 문제가 나와요. 잘 모르면 선생님께 물어보거나 '전체'를 골라요. 나중에 학습 지도에서 바꿀 수 있어요.</p>
  <div class=menuCol style="width:100%;margin-top:8px">${us.map((n,i)=>`<button class="btn ${m.uMax===i+1?'gold':'ghost'}" data-a="u${i+1}">${i+1}단원 ${esc(n)}까지</button>`).join('')}<button class="btn blue" data-a=u99>전체</button>${again?'<button class="btn ghost" data-a=keep>그대로 할래요</button>':''}</div>`,
  Object.fromEntries([...us.map((n,i)=>['u'+(i+1),()=>set(i+1)]),['u99',()=>set(99)],['keep',()=>{m.uMaxAt=today();autoSave();closeM();next();}]]));}

async function teacherLogin(){M(`<h2>${I('teacher')} 선생님 화면</h2><p class=mut style="font-size:14px">비밀번호를 넣어 주세요.</p><input class=inp id=tPw type=password><div class=mbtns><button class="btn blue" data-a=ok>들어가기</button><button class="btn ghost" data-a=x>닫기</button></div>`,
 {ok:()=>{if($('#tPw').value===TEACHER_PW){closeM();renderTeacher();}else{toast('비밀번호가 달라요');}},x:()=>closeM(),_close:()=>closeM()});

function renderTeacher(){S.screen='teacher';const y=schoolYear();
 $('#view').innerHTML=`<div class=wrap><div class=panel><div class=row style="align-items:center"><h2 style="margin:0">${I('teacher')} 선생님 화면</h2><span class=hudSp></span><button class="btn ghost sm" id=tcBack>나가기</button></div>
  <p style="font-size:14px;line-height:1.6;margin-top:8px">학생은 <b>학년·학기 코드</b>가 있어야 시작할 수 있어요. 코드의 학기보다 뒤 학년 문제는 나오지 않아요. 코드는 <b>${y}학년도(${y}.3~${y+1}.2)</b>에만 쓸 수 있고, 3월이 되면 새 코드를 나눠 주면 돼요. 학급 글자를 바꾸면 반마다 다른 코드가 돼요.</p>
  <div class=setRow><b>학급 글자 (3자)</b><input class="inp codeIn" id=tcCls maxlength=3 style="width:140px;font-size:22px" value="${esc(S.tcCls||'SSC')}"></div>
  <div id=tcList style="display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px"></div></div>
 <div class=panel><h2>${I('chart')} 학생 기록 모아 보기</h2><p class=mut style="font-size:13px">학생들이 보낸 <b>저장 코드(PKMT…)</b>를 한 줄에 하나씩 붙여 넣거나 .md 파일을 여러 개 고르면 표로 보여 줘요. 이 표는 이 화면에만 보이고 어디에도 보내지 않아요. 학생은 실명 대신 <b>닉네임</b>을 써요 — 누가 누구인지는 선생님만 따로 적어 두세요.</p>
  <textarea class="inp code" id=tcIn style="height:120px" placeholder="PKMTZ:...&#10;PKMTZ:..."></textarea><div class=row style="margin-top:8px"><button class="btn blue" id=tcGo>표 만들기</button><button class="btn ghost" id=tcFiles>${I('folder')} .md 파일 여러 개</button></div>
  <input type=file id=tcF multiple accept=".md,.txt" class=hidden><div id=tcRep style="overflow-x:auto;margin-top:10px"></div></div>
 <div class=panel><h2>${I('medal')} 학생 트레이너 카드 인쇄</h2><p class=mut style="font-size:13px">위 칸에 학생 저장 코드를 넣고 「카드 만들기」를 누르면, 학생이 꾸민 배지와 기록으로 카드(85.5×54mm, 300dpi)를 만들어요. <b>포켓몬 그림·이름은 들어가지 않아요.</b> 카드 등급(첫 돌 5 · 돌탑 20 · 좌삼 50 · 공든 좌삼 100 돌)에 오른 학생만 만들어져요.</p>
  <div class=row><button class="btn blue" id=tcCards>카드 만들기</button><button class="btn ghost" id=tcCardsA4>모두 A4로 인쇄</button></div><div id=tcCardBox style="display:flex;flex-wrap:wrap;gap:12px;margin-top:10px"></div></div></div>`;
 const list=()=>{const c=($('#tcCls').value||'').toUpperCase();S.tcCls=c;let h='';for(let g=1;g<=6;g++)for(let s=1;s<=2;s++){const code=makeTeacherCode(g,s,c.length===3?c:'SSC',y);h+=`<div style="text-align:center;background:#fff;border:2px solid var(--line);border-radius:14px;padding:8px"><div class=jua>${g}학년 ${s}학기</div><div class=tcode style="font-size:24px">${code}</div></div>`;}$('#tcList').innerHTML=h;};
 list();$('#tcCls').oninput=list;
 $('#tcBack').onclick=()=>{sfx('tap');renderTitle();};
 const rows=[];const add=o=>{const m=upgradeMeta(mergeMeta(o.meta));for(const a of ACH){const t=achTier(a,m);if(t>((m.ach[a.k]&&m.ach[a.k].t)||0))m.ach[a.k]={t,d:[]};}const sk=Object.entries(m.sk);const weak=sk.filter(([id,v])=>SKM[id]&&v.x>=2&&v.x>=v.c/2).map(([id])=>SKM[id].n).slice(0,3);
  const last7=Object.keys(m.days).filter(k=>dayDiff(k,today())<7).reduce((s,k)=>s+m.days[k].n,0);
  rows.push(`<tr><td>${esc(m.name)}</td><td>${esc(semName(m.gs))}</td><td>${lvOf(m.xp).lv}</td><td>${m.stats.q}</td><td>${m.stats.q?Math.round(m.stats.c/m.stats.q*100):0}%</td><td>${last7}</td><td>${Object.keys(m.days).length}</td><td>${Object.keys(m.badges).length}</td><td>${(()=>{const h=m.hist||[];if(h.length<40&&!m.first20)return '-';const p=(m.first20||h.slice(0,20)).reduce((a,x)=>a+x,0),r=h.slice(-20).reduce((a,x)=>a+x,0);return `${p} → <b>${r}</b>`;})()}</td><td style="text-align:left">${esc(Object.keys(m.found||{}).map(F=>SKM[F]?SKM[F].n:'').filter(Boolean).join(', ')||'-')}</td><td style="text-align:left">${esc(weak.join(', ')||'-')}</td><td>${m.stats.guessWrong||0}회${m.stats.guessAlert?` (천천히 안내 ${m.stats.guessAlert})`:''}</td><td>${ACH.reduce((s,a)=>s+((m.ach[a.k]&&m.ach[a.k].t)||0),0)}</td><td style="text-align:left">${esc(strengths(m).slice(0,2).map(x=>STR[x.k].n).join(', ')||'-')}${playStyle(m).length?'<br><span class=mut>'+esc(playStyle(m).map(t=>'#'+t[0]).join(' '))+'</span>':''}</td></tr>`);};
 const show=()=>{$('#tcRep').innerHTML=rows.length?`<table class=rep><tr><th>닉네임</th><th>학기</th><th>Lv</th><th>푼 문제</th><th>정답률</th><th>최근 7일</th><th>공부한 날</th><th>단원 배지</th><th>처음 20 → 최근 20</th><th>좌삼 쌓는 중</th><th>더 연습할 개념</th><th>찍기 의심</th><th>도전 배지</th><th>강점 · 스타일</th></tr>${rows.join('')}</table>`:'<p class=mut>읽을 수 있는 기록이 없어요</p>';};
 $('#tcGo').onclick=async()=>{rows.length=0;for(const line of $('#tcIn').value.split(/\n+/)){if(!line.trim())continue;try{add(await readAny(line));}catch(e){}}show();};
 $('#tcFiles').onclick=()=>$('#tcF').click();
 const cards=[];$('#tcCards').onclick=async()=>{cards.length=0;const box=$('#tcCardBox');box.innerHTML='';const keep=S.meta;
  for(const line of $('#tcIn').value.split(/\n+/)){if(!line.trim())continue;let o;try{o=await readAny(line);}catch(e){continue;}const m=upgradeMeta(mergeMeta(o.meta));S.meta=m;const T=cardTier(m);if(!T){box.insertAdjacentHTML('beforeend',`<div class=skRow>${esc(m.name)} — 아직 카드 등급 전(돌 ${stoneList(m).length}개)</div>`);continue;}const sp=cardSpec();await cardPreload(m,sp);const cv=renderCard(m,sp,T);S.meta=keep;cards.push(cv);
   const w=document.createElement('div');w.style.cssText='text-align:center';cv.style.cssText='width:300px;border-radius:10px;box-shadow:0 4px 12px rgba(0,0,0,.2)';w.appendChild(cv);const b=document.createElement('div');b.innerHTML=`<div style="font-size:13px">${esc(m.name)} · ${T.n}</div><button class="btn sm blue">이 카드 인쇄</button> <button class="btn sm ghost">PNG</button>`;b.querySelectorAll('button')[0].onclick=()=>cardPrint(cv);b.querySelectorAll('button')[1].onclick=()=>cardDownload(cv,`트레이너카드_${m.name}_${T.n}`);w.appendChild(b);box.appendChild(w);}
  S.meta=keep;if(!cards.length&&!box.innerHTML)box.innerHTML='<p class=mut>읽을 수 있는 저장 코드가 없어요</p>';};
 $('#tcCardsA4').onclick=()=>{if(!cards.length){toast('먼저 「카드 만들기」를 눌러 주세요');return;}cardPrint(cards);};
 $('#tcF').onchange=async e=>{rows.length=0;for(const f of e.target.files){try{add(await readAny(await f.text()));}catch(er){}}show();e.target.value='';};}

let _bgCur='';function bgTick(){

  if(B&&B.wildMode&&B.wildState&&B.wildState.scenarioMode){scApplyBackdrop(B.wildState.scenarioStage,true,undefined,B.wildState.scenarioBoss?'boss':'');return;}
